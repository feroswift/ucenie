<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fyzika hravo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --grid:#E1E7F1; --ink:#2336A8; --onink:#FFFFFF;
  --text:#1E2233; --muted:#596077; --card:#FFFFFF; --line:#C9D2E3;
  --yellow:#FFE45C; --pink:#FFA3C0; --green:#1F8A57; --greenbg:#DDF5E8; --red:#C93C3C; --redbg:#FCE3E3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161925; --grid:#222738; --ink:#9AABFF;
    --onink:#111420; --text:#ECEFF6; --muted:#A6ADBE; --card:#1E2231; --line:#363D52;
    --yellow:#C9AE22; --pink:#B85C7D; --green:#56D094; --greenbg:#173A2B; --red:#F07A7A; --redbg:#3E1F25;
  }
}
:root[data-theme="dark"]{
  --paper:#161925; --grid:#222738; --ink:#9AABFF; --onink:#111420;
  --text:#ECEFF6; --muted:#A6ADBE; --card:#1E2231; --line:#363D52;
  --yellow:#C9AE22; --pink:#B85C7D; --green:#56D094; --greenbg:#173A2B; --red:#F07A7A; --redbg:#3E1F25;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:Nunito, "Segoe UI", system-ui, -apple-system, sans-serif; font-size:17px; line-height:1.45;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

.hero{margin:18px 4px 26px}
.hero h1{font-family:Caveat, "Comic Sans MS", cursive;font-weight:700;font-size:3.6rem;line-height:1;color:var(--ink);margin:0;transform:rotate(-2deg);transform-origin:left}
.hero p{margin:10px 0 0;color:var(--muted)}

.topic{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px 18px 18px;margin-bottom:16px}
.topic .emo{position:absolute;right:16px;top:12px;font-size:2.2rem}
.topic h2{font-family:Caveat, cursive;font-size:2.1rem;line-height:1.1;margin:0 56px 6px 0;font-weight:700}
.hl{padding:0 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hl-yellow{background:linear-gradient(transparent 50%,var(--yellow) 50%,var(--yellow) 92%,transparent 92%)}
.hl-pink{background:linear-gradient(transparent 50%,var(--pink) 50%,var(--pink) 92%,transparent 92%)}
.meta{margin:0 0 14px;color:var(--muted)}
.meta b{color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap}

.btn{padding:12px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:800}
.btn.primary{background:var(--ink);color:var(--onink)}
.btn:active{transform:translateY(1px)}

.bar{display:flex;align-items:center;gap:12px;margin:6px 0 26px}
.x{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.1rem;flex:none}
.prog{flex:1;height:14px;border-radius:8px;background:var(--line);overflow:hidden}
.prog div{height:100%;background:var(--ink);border-radius:8px;transition:width .3s ease}

.q{margin-bottom:20px}
.again{display:inline-block;margin:0 0 10px;padding:2px 10px;border-radius:8px;background:var(--yellow);color:#1E2233;font-weight:700;font-size:.9rem}
.prompt{margin:0;color:var(--muted);font-size:1.1rem;font-weight:700}
.big{margin:4px 0 0;font-family:Caveat, cursive;font-size:2.6rem;line-height:1.1;color:var(--ink);font-weight:700}
.sym{font-family:"Times New Roman", Georgia, serif;font-style:italic;font-weight:700}
.big.sym{font-size:3rem}

.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two .opt{text-align:center;min-height:72px;font-size:1.25rem}
.opt{min-height:58px;padding:12px 16px;text-align:left;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:1.1rem}
.opt.sym{font-size:1.5rem}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--greenbg)}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
.opt.right::after{content:" ✓";color:var(--green)}
.opt.wrong::after{content:" ✗";color:var(--red)}

.fb{margin-top:18px;padding:16px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fb.ok{background:var(--greenbg);border:2px solid var(--green)}
.fb.no{background:var(--redbg);border:2px solid var(--red)}
.fb p{margin:0;font-weight:700;font-size:1.1rem}

.end{text-align:center;padding-top:30px}
.stars{font-size:3rem;letter-spacing:6px}
.end h2{font-family:Caveat, cursive;font-size:3rem;color:var(--ink);margin:8px 0 4px}
.score{font-size:1.3rem;font-weight:800;margin:0 0 24px}
.end .row{justify-content:center}

.rhead{display:flex;align-items:center;gap:12px;margin:6px 0 8px}
.rhead h2{font-family:Caveat, cursive;font-size:2.2rem;margin:0}
.hint{color:var(--muted);margin:0 0 16px}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);min-height:112px;display:flex;flex-direction:column;gap:6px}
.card .ce{font-size:1.6rem}
.card .cn{font-weight:800}
.card .ca{margin-top:auto;color:var(--muted);font-weight:700}
.card.open{border-color:var(--ink)}
.card.open .ca{color:var(--ink)}
.card .dl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:.95rem}
.card .dl span:nth-child(odd){color:var(--muted)}
@media (prefers-reduced-motion: reduce){.prog div{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ===== DÁTA – sem sa pridávajú ďalšie okruhy ===== */
const INVENTORS = [
  {name:"Eduard Penkala", inv:"pero", e:"✒️"},
  {name:"Jozef Čabelka", inv:"zváranie", e:"🔥"},
  {name:"Štefan Jedlík", inv:"sóda", e:"🫧"},
  {name:"Jozef Maximilián Petzval", inv:"objektív", e:"📷"},
  {name:"Aurel Stodola", inv:"protéza", e:"🦾"},
  {name:"Jozef Karol Hell", inv:"vodočerpací stroj", e:"💧"},
  {name:"Štefan Banič", inv:"padák", e:"🪂"},
  {name:"Ján Bahýľ", inv:"helikoptéra", e:"🚁"},
  {name:"Jozef Murgaš", inv:"rádio, telegraf a naviják", e:"📻"},
  {name:"Ján Dopjera", inv:"akustická gitara", e:"🎸"},
  {name:"Ján Andrej Segner", inv:"Segnerovo koleso", e:"🌀"},
  {name:"Ivan Getting", inv:"GPS", e:"🛰️"},
  {name:"Bohumil Vančo", inv:"spätné zrkadlo", e:"🪞"},
  {name:"Štefan Klein", inv:"lietajúce auto", e:"🚗"},
  {name:"Miroslav Trnka", inv:"antivírus NOD", e:"🛡️"}
];
const QUANT = [
  {name:"dĺžka", sym:"d", unit:"meter", usym:"m", tool:"dĺžkové meradlo", e:"📏"},
  {name:"objem", sym:"V", unit:"meter kubický", usym:"m³", tool:"odmerný valec", e:"🧪"},
  {name:"teplota", sym:"T", unit:"stupeň Celzia", usym:"°C", tool:"teplomer", e:"🌡️"},
  {name:"hmotnosť", sym:"m", unit:"kilogram", usym:"kg", tool:"váha", e:"⚖️"}
];

const LATKY=["porcelán","sklo","papier","plast","mlieko","koža","vzduch","drevo","voda","železo","zlato","striebro","hliník","guma","vlna","bavlna","vosk","oceľ","piesok","olej","med","soľ","cukor","hlina"];
const TELESA=["tanier","okno","strana v knihe","obal od cukríkov","kniha","ceruzka","opasok","lopta","stolička","pohár","lyžica","prsteň","klinec","sviečka","sveter","tričko","tehla","pneumatika","alobal","stôl","hrnček","fľaša","topánka","minca"];
const SOLID=["porcelán","sklo","papier","plast","koža","drevo","železo","zlato","striebro","hliník","guma","vlna","bavlna","vosk","oceľ","hlina"];
const PAIRS=[
  {t:"tanier",l:"porcelán",alt:["sklo","plast"],e:"🍽️"},
  {t:"okno",l:"sklo",alt:["drevo","plast"],e:"🪟"},
  {t:"strana v knihe",l:"papier",e:"📖"},
  {t:"obal od cukríkov",l:"plast",alt:["papier","hliník"],e:"🍬"},
  {t:"opasok",l:"koža",alt:["plast"],e:"👖"},
  {t:"ceruzka",l:"drevo",alt:["plast"],e:"✏️"},
  {t:"lopta",l:"guma",alt:["plast","koža"],e:"⚽"},
  {t:"prsteň",l:"zlato",alt:["striebro"],e:"💍"},
  {t:"klinec",l:"železo",alt:["oceľ"],e:"🔩"},
  {t:"sviečka",l:"vosk",e:"🕯️"},
  {t:"sveter",l:"vlna",alt:["bavlna"],e:"🧶"},
  {t:"tričko",l:"bavlna",alt:["vlna","plast"],e:"👕"},
  {t:"tehla",l:"hlina",e:"🧱"},
  {t:"alobal",l:"hliník",e:"🌯"},
  {t:"pneumatika",l:"guma",e:"🛞"},
  {t:"pohár",l:"sklo",alt:["plast","porcelán"],e:"🥛"}
];

/* ===== pomocné ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeQ(prompt,big,answer,pool,bigSym,optSym){
  const others=shuffle([...new Set(pool)].filter(x=>x!==answer)).slice(0,3);
  return {prompt,big,answer,opts:shuffle([answer,...others]),bigSym:!!bigSym,optSym:!!optSym,retry:false};
}
const col=(arr,f)=>arr.map(x=>x[f]);

const TOPICS = {
  vynalezcovia:{
    title:"Slovenskí vynálezcovia", color:"yellow", emoji:"💡", count:10,
    desc:INVENTORS.length+" vynálezcov a ich vynálezy.",
    gen(){
      return shuffle(INVENTORS).slice(0,this.count).map(it=>Math.random()<0.5
        ? makeQ("Čo vynašiel",it.name,it.inv,col(INVENTORS,"inv"))
        : makeQ("Kto vynašiel",it.inv,it.name,col(INVENTORS,"name")));
    },
    card:it=>({front:`<span class="ce">${it.e}</span><span class="cn">${it.name}</span>`, back:it.inv}),
    items:INVENTORS
  },
  veliciny:{
    title:"Fyzikálne veličiny", color:"pink", emoji:"📏", count:10,
    desc:"Značky, jednotky a meradlá.",
    gen(){
      const T=[
        q=>makeQ("Akou značkou označujeme veličinu",q.name,q.sym,col(QUANT,"sym"),false,true),
        q=>makeQ("Aká je základná jednotka veličiny",q.name,q.unit,col(QUANT,"unit")),
        q=>makeQ("Ako skrátene zapíšeme jednotku",q.unit,q.usym,col(QUANT,"usym")),
        q=>makeQ("Čím meriame veličinu",q.name,q.tool,col(QUANT,"tool")),
        q=>makeQ("Čo meriame týmto meradlom",q.tool,q.name,col(QUANT,"name")),
        q=>makeQ("Ktorá veličina má značku",q.sym,q.name,col(QUANT,"name"),true,false),
        q=>makeQ("Ktorá veličina sa meria v jednotkách",q.usym,q.name,col(QUANT,"name"))
      ];
      const combos=[];QUANT.forEach(q=>T.forEach(t=>combos.push([q,t])));
      return shuffle(combos).slice(0,this.count).map(([q,t])=>t(q));
    },
    card:it=>({front:`<span class="ce">${it.e}</span><span class="cn">${it.name}</span>`,
      back:`<span class="dl"><span>značka</span><span class="sym">${it.sym}</span><span>jednotka</span><span>${it.unit} (${it.usym})</span><span>meradlo</span><span>${it.tool}</span></span>`}),
    items:QUANT
  },
  latky:{
    title:"Látky a telesá", color:"yellow", emoji:"🧱", count:10,
    desc:"Rozlíš, čo je látka a čo teleso.",
    hint:"Teleso je konkrétna vec (tanier). Látka je to, z čoho je vyrobená (porcelán). Ťukni na kartičku.",
    gen(){
      const qs=[];
      shuffle([...LATKY.map(w=>[w,"látka"]),...TELESA.map(w=>[w,"teleso"])]).slice(0,5)
        .forEach(([w,a])=>qs.push({prompt:"Je to látka, alebo teleso",big:w,answer:a,opts:["látka","teleso"],two:true,retry:false}));
      shuffle(PAIRS).slice(0,3).forEach(p=>{
        const bad=new Set([p.l,...(p.alt||[])]);
        qs.push({prompt:"Z akej látky je",big:p.t,answer:p.l,opts:shuffle([p.l,...shuffle(SOLID.filter(x=>!bad.has(x))).slice(0,3)]),retry:false});
      });
      const t=shuffle(TELESA)[0], l=shuffle(LATKY)[0];
      qs.push({prompt:"Ktoré z toho je",big:"teleso",answer:t,opts:shuffle([t,...shuffle(LATKY).slice(0,3)]),retry:false});
      qs.push({prompt:"Ktoré z toho je",big:"látka",answer:l,opts:shuffle([l,...shuffle(TELESA).slice(0,3)]),retry:false});
      return shuffle(qs);
    },
    card:it=>({front:`<span class="ce">${it.e}</span><span class="cn">${it.t}</span>`, back:`z látky: ${it.l}`}),
    items:PAIRS
  }
};

/* ===== aplikácia ===== */
const app=document.getElementById("app");
let S=null;
const PRAISE=["Správne!","Výborne!","Presne tak!","Super!","Paráda!"];
function best(k){try{return +localStorage.getItem("fyzika-best-"+k)||0}catch(e){return 0}}
function saveBest(k,v){try{if(v>best(k))localStorage.setItem("fyzika-best-"+k,String(v))}catch(e){}}

function home(){
  S=null;
  app.innerHTML=`<header class="hero"><h1>Fyzika hravo</h1><p>Opakovanie z poznámok do fyziky</p></header>`+
  Object.entries(TOPICS).map(([k,t])=>{
    const b=best(k);
    return `<section class="topic">
      <div class="emo" aria-hidden="true">${t.emoji}</div>
      <h2><span class="hl hl-${t.color}">${t.title}</span></h2>
      <p class="meta">${t.desc}${b?` Najlepší výsledok: <b>${b}/${t.count}</b>`:""}</p>
      <div class="row">
        <button class="btn primary" data-act="quiz" data-k="${k}">Spustiť kvíz</button>
        <button class="btn" data-act="review" data-k="${k}">Opakovať</button>
      </div></section>`;
  }).join("");
  window.scrollTo(0,0);
}

function startQuiz(k){S={k,queue:TOPICS[k].gen(),i:0,score:0,answered:false};renderQuiz();}

function renderQuiz(){
  const q=S.queue[S.i];
  const pct=Math.round(S.i/S.queue.length*100);
  app.innerHTML=`<div class="bar"><button class="x" data-act="home" aria-label="Späť na začiatok">✕</button>
    <div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div></div>
    <div class="q">${q.retry?`<p class="again">Skúsme to ešte raz</p><br>`:""}
      <p class="prompt">${q.prompt}</p>
      <p class="big${q.bigSym?" sym":""}">${q.big}<span style="font-style:normal">?</span></p></div>
    <div class="opts${q.two?" two":""}">${q.opts.map((o,i)=>`<button class="opt${q.optSym?" sym":""}" data-act="opt" data-i="${i}">${o}</button>`).join("")}</div>
    <div id="fb" aria-live="polite"></div>`;
  window.scrollTo(0,0);
}

function answer(i){
  if(S.answered)return;
  S.answered=true;
  const q=S.queue[S.i], ok=q.opts[i]===q.answer;
  if(ok&&!q.retry)S.score++;
  if(!ok)S.queue.push({...q,retry:true,opts:shuffle(q.opts)});
  app.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled=true;
    if(q.opts[j]===q.answer)b.classList.add("right");
    else if(j===i)b.classList.add("wrong");
  });
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">
    <p>${ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:`Správne je: ${q.answer}`}</p>
    <button class="btn primary" data-act="next">Ďalej</button></div>`;
  app.querySelector('[data-act="next"]').focus({preventScroll:false});
}

function next(){
  S.i++;S.answered=false;
  if(S.i>=S.queue.length)end();else renderQuiz();
}

function end(){
  const t=TOPICS[S.k],s=S.score,n=t.count;
  saveBest(S.k,s);
  const stars=s>=n*0.9?3:s>=n*0.6?2:1;
  const msg=stars===3?"Výborne!":stars===2?"Dobrá práca!":"Ide ti to, skús znova!";
  app.innerHTML=`<div class="end">
    <div class="stars" aria-label="${stars} z 3 hviezd">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
    <h2>${msg}</h2>
    <p class="score">Na prvý pokus správne: ${s} z ${n}</p>
    <div class="row"><button class="btn primary" data-act="quiz" data-k="${S.k}">Hrať znova</button>
    <button class="btn" data-act="home">Späť na začiatok</button></div></div>`;
  window.scrollTo(0,0);
}

function review(k){
  const t=TOPICS[k];
  app.innerHTML=`<div class="rhead"><button class="x" data-act="home" aria-label="Späť na začiatok">✕</button>
    <h2><span class="hl hl-${t.color}">${t.title}</span></h2></div>
    <p class="hint">${t.hint||"Ťukni na kartičku a pozri sa na odpoveď."}</p>
    <div class="cards">${t.items.map((it,i)=>{const c=t.card(it);
      return `<button class="card" data-act="flip" data-k="${k}" data-i="${i}" aria-pressed="false">${c.front}<span class="ca">?</span></button>`;}).join("")}</div>
    <div class="row" style="margin-top:20px"><button class="btn primary" data-act="quiz" data-k="${k}">Spustiť kvíz</button></div>`;
  window.scrollTo(0,0);
}

function flip(b){
  const t=TOPICS[b.dataset.k], c=t.card(t.items[+b.dataset.i]);
  const open=!b.classList.contains("open");
  b.classList.toggle("open",open);
  b.setAttribute("aria-pressed",String(open));
  b.querySelector(".ca").innerHTML=open?c.back:"?";
}

app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const a=b.dataset.act;
  if(a==="quiz")startQuiz(b.dataset.k);
  else if(a==="review")review(b.dataset.k);
  else if(a==="home")home();
  else if(a==="opt")answer(+b.dataset.i);
  else if(a==="next")next();
  else if(a==="flip")flip(b);
});

home();
</script>
<script>
/* Odkaz späť na rozcestník Učíme sa hravo (len na webe) */
(function(){
  if(!/^https?:$/.test(location.protocol))return;
  var css=document.createElement("style");
  css.textContent='.hub-back{display:inline-flex;align-items:center;margin:0 0 12px;padding:5px 12px 5px 9px;border-radius:999px;border:1.5px solid currentColor;color:inherit;opacity:.7;font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;text-decoration:none;transform:none;position:relative;z-index:1}.hub-back:focus-visible{outline:3px solid currentColor;outline-offset:2px}';
  document.head.appendChild(css);
  var T=[[".hero",0],["#home",0],["h1.hello",1]];
  function place(){
    for(var i=0;i<T.length;i++){
      var el=document.querySelector(T[i][0]);if(!el)continue;
      var box=T[i][1]?document.getElementById("app"):el;
      if(!box)return;
      var f=box.firstElementChild;if(f&&f.classList.contains("hub-back"))return;
      var a=document.createElement("a");a.className="hub-back";a.href="./";a.textContent="‹ Všetky appky";
      box.insertBefore(a,box.firstChild);return;
    }
  }
  place();new MutationObserver(place).observe(document.body,{childList:true,subtree:true});
})();
</script>
</body>
</html>
