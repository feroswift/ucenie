<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Irregular verbs – Simonka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5FB; --grid:rgba(40,70,140,.07); --card:#FFFFFF; --ink:#1B2A57; --ink-soft:#5A6790;
  --pink:#FF3E9A; --pink-ink:#FFFFFF; --pink-soft:#FFE0EF; --mark:#FFE14D;
  --green:#12995F; --green-soft:#D8F5E7; --red:#E0383E; --red-soft:#FDE2E3; --yellow:#F5C400;
  --line:#D6DEF0; --press:#C4CDE4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11172A; --grid:rgba(255,255,255,.04); --card:#1B2340; --ink:#EEF1FA; --ink-soft:#A3ACCB;
    --pink:#FF5FAE; --pink-ink:#1A0A14; --pink-soft:#46203D; --mark:rgba(255,95,174,.38);
    --green:#3DD68C; --green-soft:#143A2A; --red:#FF6B70; --red-soft:#40202A; --yellow:#FFD83A;
    --line:#2E3858; --press:#0B1020;
  }
}
:root[data-theme="dark"]{
  --paper:#11172A; --grid:rgba(255,255,255,.04); --card:#1B2340; --ink:#EEF1FA; --ink-soft:#A3ACCB;
  --pink:#FF5FAE; --pink-ink:#1A0A14; --pink-soft:#46203D; --mark:rgba(255,95,174,.38);
  --green:#3DD68C; --green-soft:#143A2A; --red:#FF6B70; --red-soft:#40202A; --yellow:#FFD83A;
  --line:#2E3858; --press:#0B1020;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);
  font-family:'Fredoka','Nunito','Segoe UI',system-ui,sans-serif;
  font-size:17px; line-height:1.4; min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
#app{max-width:480px;margin:0 auto;padding:20px 18px calc(28px + env(safe-area-inset-bottom))}

/* home */
.hero{padding:18px 0 8px}
.hero h1{font-family:'Caveat','Comic Sans MS',cursive;font-weight:700;font-size:64px;line-height:.9;margin:0;letter-spacing:-.5px}
.swipe{display:block;width:230px;height:18px;margin:2px 0 0 -4px}
.swipe path{stroke:var(--pink);stroke-width:9;fill:none;stroke-linecap:round;opacity:.85;stroke-dasharray:260;stroke-dashoffset:0;animation:draw .7s .15s ease-out both}
@keyframes draw{from{stroke-dashoffset:260}}
.lead{color:var(--ink-soft);margin:10px 0 0;max-width:34ch}
.chip{display:inline-block;margin-top:14px;padding:6px 14px;border-radius:999px;background:var(--pink-soft);color:var(--ink);font-weight:500;font-size:15px}
.stats{margin:26px 0 22px}
.stats .head{display:flex;justify-content:space-between;align-items:baseline}
.stats .big{font-size:30px;font-weight:600}
.stats .big small{font-size:17px;color:var(--ink-soft);font-weight:400}
.xp{color:var(--ink-soft);font-size:15px}
.meter{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:8px 0 10px}
.meter i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-soft);margin:0;padding:0;list-style:none}
.legend li::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c);vertical-align:0}
.actions{display:grid;gap:12px}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:16px 18px;font-size:19px;font-weight:600;background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--press);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.btn.primary{background:var(--pink);color:var(--pink-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--pink) 60%,#000)}
.btn.go{background:var(--green);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--green) 60%,#000)}
.btn .n{font-weight:400;opacity:.75}
.btn.quiet{background:transparent;box-shadow:none;border:2px solid var(--line);font-weight:500}

/* game */
.top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.icon{border:0;background:transparent;font-size:22px;width:40px;height:40px;border-radius:12px;flex:none;color:var(--ink-soft)}
.bar{flex:1;height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);border-radius:7px;transition:width .3s}
.combo{min-width:44px;text-align:right;font-weight:600;color:var(--pink)}
.q{margin-bottom:22px}
.label{margin:0 0 6px;color:var(--ink-soft);font-size:16px}
.prompt{margin:0;font-size:44px;line-height:1.1;font-weight:600;word-break:break-word}
.prompt.sk{font-size:34px}
.prompt mark{background:linear-gradient(transparent 55%,var(--mark) 55%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 4px}
.sub{margin:6px 0 0;color:var(--ink-soft);font-size:18px}
.ask{display:inline-block;margin:0 0 14px;padding:8px 16px;border-radius:999px;font-size:19px;font-weight:500}
.ask b{font-weight:700}
.f2{background:var(--yellow);color:#1B2A57}
.f3{background:var(--pink);color:var(--pink-ink)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.cell{border-radius:16px;padding:8px 6px 10px;text-align:center;background:var(--card);border:2px solid var(--line)}
.cell small{display:block;font-size:13px;color:var(--ink-soft)}
.cell span{display:block;font-size:28px;font-weight:600;line-height:1.25;word-break:break-word}
.cell.on{border-color:transparent;box-shadow:0 4px 0 color-mix(in srgb,currentColor 25%,transparent);transform:scale(1.05)}
.cell.on.f2{background:var(--yellow);color:#1B2A57}
.cell.on.f3{background:var(--pink);color:var(--pink-ink)}
.cell.on span{font-size:32px;font-weight:700}
.strip+.sub{margin-top:12px}
.cell.on small{color:inherit;opacity:.8}
.cell.off span{color:var(--line)}
.opts{display:grid;gap:12px}
.opts.c2{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:16px 12px;font-size:21px;font-weight:500;box-shadow:0 3px 0 var(--line);min-height:62px;transition:transform .08s,background .15s}
.opts.c1 .opt{text-align:left;padding-left:18px;font-size:19px}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.correct{border-color:var(--green);background:var(--green-soft);box-shadow:0 3px 0 var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);box-shadow:0 3px 0 var(--red)}
.opt.dim{opacity:.45}
.skip{display:block;margin:22px auto 0;border:0;background:none;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;font-size:16px;padding:8px}

.slots{display:grid;gap:10px;margin-bottom:18px}
.slot{display:flex;justify-content:space-between;align-items:center;border:2px dashed var(--line);background:transparent;border-radius:14px;padding:10px 16px;min-height:58px;text-align:left}
.slot small{color:var(--ink-soft);font-size:14px}
.slot span{font-size:21px;font-weight:600}
.slot.filled{border-style:solid;background:var(--card)}
.slot.correct{border-color:var(--green);background:var(--green-soft)}
.slot.wrong{border-color:var(--red);background:var(--red-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.tile{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-size:19px;font-weight:500;box-shadow:0 3px 0 var(--line)}
.tile[disabled]{opacity:.2;box-shadow:none}

/* feedback */
.sheet{position:fixed;left:0;right:0;bottom:0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out;z-index:5}
.sheet>div,.sheet>p,.sheet>button{max-width:444px;margin-left:auto;margin-right:auto}
.sheet.ok{background:var(--green-soft);border-top:3px solid var(--green)}
.sheet.bad{background:var(--red-soft);border-top:3px solid var(--red)}
@keyframes up{from{transform:translateY(100%)}}
.verdict{margin:0 0 8px;font-weight:600;font-size:21px}
.sheet.ok .verdict{color:var(--green)}
.sheet.bad .verdict{color:var(--red)}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.forms{display:flex;flex-wrap:wrap;gap:4px 0;font-size:22px;font-weight:600}
.forms span+span::before{content:"–";margin:0 8px;color:var(--ink-soft);font-weight:400}
.vrow .sk{display:block;color:var(--ink-soft);font-size:16px}
.speak{background:var(--card);font-size:20px}

/* results */
.res{text-align:center;padding-top:30px}
.stars{font-size:52px;letter-spacing:6px;margin:0}
.res h2{font-family:'Caveat',cursive;font-size:54px;margin:6px 0 0;line-height:1}
.res .score{font-size:20px;color:var(--ink-soft);margin:6px 0 24px}
.missed{text-align:left;background:var(--card);border-radius:18px;padding:14px 16px;margin:0 0 22px}
.missed h3{margin:0 0 6px;font-size:17px;font-weight:500;color:var(--ink-soft)}

/* dictionary */
.dhead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dhead h2{margin:0;font-size:26px;font-weight:600}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:15px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.list{list-style:none;margin:0;padding:0;background:var(--card);border-radius:18px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.list button{display:grid;grid-template-columns:12px 1fr;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:10px 14px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.list .forms{font-size:18px}
.list .sk{color:var(--ink-soft);font-size:15px}
.empty{padding:18px;color:var(--ink-soft);text-align:center;margin:0}
.reset{margin-top:20px}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.confetti i{position:absolute;top:-20px;width:10px;height:22px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const RAW=`be|was, were|been|byť
become|became|become|stať sa
begin|began|begun|začať
break|broke|broken|zlomiť, rozbiť
bring|brought|brought|priniesť
build|built|built|postaviť, stavať
burn|burnt, burned|burnt, burned|horieť
buy|bought|bought|kúpiť
catch|caught|caught|chytiť
choose|chose|chosen|vybrať (si)
come|came|come|prísť
cost|cost|cost|stáť (cena)
cut|cut|cut|rezať
do|did|done|robiť
draw|drew|drawn|kresliť, ťahať
dream|dreamed, dreamt|dreamed, dreamt|snívať
drink|drank|drunk|piť
drive|drove|driven|jazdiť (na aute), odviezť
eat|ate|eaten|jesť
fall|fell|fallen|spadnúť
feel|felt|felt|cítiť
find|found|found|nájsť
fly|flew|flown|letieť
forget|forgot|forgotten|zabudnúť
get|got|got|dostať
give|gave|given|dať
go|went|gone, been|ísť
grow|grew|grown|rásť
have|had|had|mať
hear|heard|heard|počuť
hit|hit|hit|udrieť
hold|held|held|držať
hurt|hurt|hurt|bolieť, ublížiť
keep|kept|kept|držať
know|knew|known|vedieť
learn|learned, learnt|learned, learnt|učiť sa
leave|left|left|odísť, opustiť`;
const V=RAW.split('\n').map(l=>{const[b,p,pp,sk]=l.split('|');return{b,p,pp:pp||null,sk}});

/* ---------- storage ---------- */
const KEY='irregular-verbs-simonka-v1';
let P={v:{},xp:0};
try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v)P=o}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
const rec=v=>P.v[v.b];
function status(v){const r=rec(v);if(!r||!r.s)return'new';if(r.b>=4)return'known';if(r.b<=1)return'learning';return'almost'}
const isWeak=v=>{const r=rec(v);return !!(r&&r.s&&r.b<=1&&r.w>0)};
const COL={known:'var(--green)',almost:'var(--yellow)',learning:'var(--pink)',new:'var(--line)'};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- speech ---------- */
const canSpeak='speechSynthesis' in window;
function speak(t){
  if(!canSpeak)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='en-GB';u.rate=.85;
    const vs=speechSynthesis.getVoices();
    const vv=vs.find(x=>/^en[-_]GB/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));
    if(vv)u.voice=vv;
    speechSynthesis.speak(u);
  }catch(e){}
}
const sayVerb=v=>speak([v.b,v.p.replace(',',''),v.pp].filter(Boolean).join(', '));

/* ---------- wrong-but-plausible forms ---------- */
const ED_OK=new Set(['learn','burn','smell','spell','dream']);
const BAD=new Set(['gotten','waked']);
const SPECIAL={be:{p:['been','is, are','beed'],pp:['was','being','were']},can:{p:['canned','can','cant']}};
function fakeEd(b){
  if(b.endsWith('e'))return b+'d';
  if(/[^aeiou]y$/.test(b))return b.slice(0,-1)+'ied';
  if(/^[^aeiou]*[aeiou][bdgmnpt]$/.test(b))return b+b.slice(-1)+'ed';
  return b+'ed';
}
const fakeEn=b=>b.endsWith('e')?b+'n':b+'en';
function swaps(b){const m=b.match(/^(.*)i(ng|nk|m|n)$/);return m?[m[1]+'a'+m[2],m[1]+'u'+m[2]]:[]}
function distract(v,field){
  const correct=v[field];
  let c=[...(SPECIAL[v.b]?.[field]||[])];
  if(!ED_OK.has(v.b))c.push(fakeEd(v.b));
  c.push(...swaps(v.b),v.b,v.p,v.pp,fakeEn(v.b));
  if(field==='pp')c.push(fakeEn(v.p.split(',')[0]));
  c=[...new Set(c.filter(x=>x&&x!==correct&&!BAD.has(x)))];
  shuffle(c);
  const out=c.slice(0,3);
  let g=0;
  while(out.length<3&&g++<80){const o=pick(V)[field];if(o&&o!==correct&&!out.includes(o))out.push(o)}
  return out;
}

/* ---------- questions ---------- */
function makeQ(i){
  const v=V[i],r=rec(v),box=r?.b??0,seen=r?.s??0;
  let types;
  if(!seen)types=['en2sk','sk2en'];
  else if(box<=1)types=['sk2en','en2sk','p','pp','which'];
  else if(box<=3)types=['p','pp','which','trio','trio'];
  else types=['trio','trio','p','pp','which'];
  if(S&&S.mode==='forms')types=(!seen||box<=1)?['p','pp','p','pp','which']:['trio','trio','p','pp','which'];
  if(!v.pp)types=types.map(t=>t==='pp'||t==='trio'?'p':t);
  let t=pick(types);
  if(t==='which'){
    const forms=[v.p,v.pp].filter(f=>f&&f!==v.b&&!f.includes(',')&&!V.some(o=>o!==v&&[o.b,o.p,o.pp].some(x=>x&&x.split(', ').includes(f))));
    if(forms.length){
      const f=pick(forms);
      const others=shuffle(V.filter(o=>o!==v)).slice(0,3).map(o=>({text:o.b,ok:false}));
      return{type:t,i,label:'Z ktorého slovesa je tento tvar?',prompt:f,cols:2,options:shuffle([{text:v.b,ok:true},...others])};
    }
    t='p';
  }
  if(t==='en2sk'){
    const others=[...new Set(shuffle(V.filter(o=>o.sk!==v.sk)).map(o=>o.sk))].slice(0,3).map(x=>({text:x,ok:false}));
    return{type:t,i,label:'Čo to znamená po slovensky?',prompt:v.b,cols:1,options:shuffle([{text:v.sk,ok:true},...others])};
  }
  if(t==='sk2en'){
    const others=shuffle(V.filter(o=>o.sk!==v.sk)).slice(0,3).map(o=>({text:o.b,ok:false}));
    return{type:t,i,label:'Ako sa to povie po anglicky?',prompt:v.sk,promptSk:true,cols:2,options:shuffle([{text:v.b,ok:true},...others])};
  }
  if(t==='p'||t==='pp'){
    const opts=[{text:v[t],ok:true},...distract(v,t).map(x=>({text:x,ok:false}))];
    return{type:t,i,label:t==='p'?'Past simple (2. tvar)':'Past participle (3. tvar)',prompt:v.b,sub:v.sk,cols:2,options:shuffle(opts)};
  }
  // trio
  const correct=[v.b,v.p,v.pp];
  let extra=[];
  if(!ED_OK.has(v.b))extra.push(fakeEd(v.b));
  extra.push(...swaps(v.b),fakeEn(v.b),fakeEn(v.p.split(',')[0]));
  extra=[...new Set(extra.filter(x=>!correct.includes(x)&&!BAD.has(x)))];
  shuffle(extra);extra=extra.slice(0,3);
  let g=0;
  while(extra.length<3&&g++<80){const o=pick(V);const f=pick([o.p,o.pp]);if(f&&!correct.includes(f)&&!extra.includes(f))extra.push(f)}
  const fm=S&&S.mode==='forms';
  return{type:'trio',i,label:'Poskladaj všetky tri tvary',prompt:fm?v.b:v.sk,promptSk:!fm,sub:fm?v.sk:'',tiles:shuffle([...correct,...extra]),slots:[null,null,null]};
}

/* ---------- session ---------- */
let S=null;
function startSession(mode){
  const now=Date.now(),idx=V.map((_,i)=>i),R=i=>rec(V[i]);
  let q=[];
  if(mode==='mistakes'){
    q=shuffle(idx.filter(i=>isWeak(V[i])).sort((a,b)=>R(a).b-R(b).b||R(b).w-R(a).w).slice(0,12));
  }else{
    const weak=shuffle(idx.filter(i=>{const r=R(i);return r&&r.s&&r.b<=1})).slice(0,5);
    const fresh=shuffle(idx.filter(i=>!R(i)||!R(i).s));
    const neu=fresh.slice(0,weak.length>=5?2:4);
    const rev=idx.filter(i=>{const r=R(i);return r&&r.s&&r.b>=2})
      .map(i=>({i,sc:(6-R(i).b)*2+(now-R(i).t)/864e5+Math.random()*2})).sort((a,b)=>b.sc-a.sc).map(o=>o.i);
    q=[...weak,...neu];
    for(const i of [...rev,...fresh,...shuffle(idx)]){if(q.length>=12)break;if(!q.includes(i))q.push(i)}
    shuffle(q);
  }
  S={mode,queue:q,pos:0,correct:0,answered:0,combo:0,xp:0,missed:new Set(),reins:{},cur:null,locked:false,last:-1};
  nextQ();
}
function nextQ(){
  if(S.pos>=S.queue.length)return results();
  if(S.queue[S.pos]===S.last&&S.pos+1<S.queue.length){const k=S.pos+1;[S.queue[S.pos],S.queue[k]]=[S.queue[k],S.queue[S.pos]]}
  S.cur=makeQ(S.queue[S.pos]);S.locked=false;
  renderQ();
}
function renderQ(){
  const q=S.cur,pct=S.pos/S.queue.length*100;
  let body;
  if(q.type==='trio'){
    const names=['Verb','Past simple','Past participle'];
    body=`<div class="slots">${names.map((n,k)=>{const t=q.slots[k];return`<button class="slot ${t!=null?'filled':''}" data-act="unslot" data-k="${k}" aria-label="${n}"><small>${n}</small><span>${t!=null?esc(q.tiles[t]):''}</span></button>`}).join('')}</div>
    <div class="tiles">${q.tiles.map((t,k)=>`<button class="tile" data-act="tile" data-k="${k}" ${q.slots.includes(k)?'disabled':''}>${esc(t)}</button>`).join('')}</div>
    <button class="btn primary" data-act="check" ${q.slots.includes(null)?'disabled':''}>Skontrolovať</button>`;
  }else{
    body=`<div class="opts c${q.cols}">${q.options.map((o,k)=>`<button class="opt" data-act="opt" data-k="${k}">${esc(o.text)}</button>`).join('')}</div>`;
  }
  app.innerHTML=`<div class="game">
    <div class="top"><button class="icon" data-act="home" aria-label="Ukončiť">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="combo">${S.combo>=2?'🔥 '+S.combo:''}</span></div>
    ${(q.type==='p'||q.type==='pp')?formHead(q):`<section class="q"><p class="label">${q.label}</p><h2 class="prompt ${q.promptSk?'sk':''}"><mark>${esc(q.prompt)}</mark></h2>${q.sub?`<p class="sub">${esc(q.sub)}</p>`:''}</section>`}
    ${body}
    <button class="skip" data-act="dunno">Neviem, ukáž mi</button>
    <div id="fb"></div></div>`;
}
function formHead(q){
  const k=q.type==='p'?2:3,c='f'+k;
  const cell=n=>n===1?`<div class="cell"><small>1. tvar</small><span>${esc(q.prompt)}</span></div>`
    :n===k?`<div class="cell on ${c}"><small>${k}. tvar</small><span>?</span></div>`
    :`<div class="cell off"><small>${n}. tvar</small><span>…</span></div>`;
  return`<section class="q"><p class="ask ${c}">Hľadám <b>${k}. tvar</b> ${k===2?'(past simple)':'(past participle)'}</p>
    <div class="strip">${cell(1)}${cell(2)}${cell(3)}</div>
    ${q.sub?`<p class="sub">${esc(q.sub)}</p>`:''}</section>`;
}
const PRAISE=['Super!','Presne tak!','Výborne!','Paráda!','Správne!'];
function answer(ok){
  const v=V[S.cur.i];
  const r=P.v[v.b]||(P.v[v.b]={b:0,s:0,w:0,t:0});
  r.s++;r.t=Date.now();S.answered++;S.last=S.cur.i;
  if(ok){
    r.b=Math.min(5,r.b+1);S.correct++;S.combo++;
    const g=10+(S.cur.type==='trio'?5:0)+(S.combo>=3?2:0);S.xp+=g;P.xp=(P.xp||0)+g;
  }else{
    r.b=0;r.w++;S.combo=0;S.missed.add(S.cur.i);
    const n=S.reins[S.cur.i]||0;
    if(n<2&&S.queue.length<24){S.reins[S.cur.i]=n+1;S.queue.splice(Math.min(S.pos+3,S.queue.length),0,S.cur.i)}
  }
  save();
  const combo=document.querySelector('.combo');if(combo)combo.textContent=S.combo>=2?'🔥 '+S.combo:'';
  const v2=V[S.cur.i];
  $('#fb').innerHTML=`<div class="sheet ${ok?'ok':'bad'}" role="status">
    <p class="verdict">${ok?pick(PRAISE)+(S.combo>=3?` ${S.combo}× za sebou`:''):'Takto je to správne'}</p>
    <div class="vrow"><div><div class="forms"><span>${esc(v2.b)}</span><span>${esc(v2.p)}</span>${v2.pp?`<span>${esc(v2.pp)}</span>`:''}</div><span class="sk">${esc(v2.sk)}</span></div>
    ${canSpeak?`<button class="icon speak" data-act="speak" aria-label="Prehrať výslovnosť">🔊</button>`:''}</div>
    <button class="btn ${ok?'go':'primary'}" data-act="next">Ďalej</button></div>`;
  $('#fb [data-act=next]').focus({preventScroll:true});
  if(!ok&&canSpeak)sayVerb(v2);
}

/* ---------- screens ---------- */
function testChip(){
  const now=new Date(),t=new Date(2026,9,9);
  const d=Math.round((t-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
  if(d<0)return'';
  const txt=d===0?'Test je dnes, držím palce!':d===1?'Test je zajtra':`Do testu v piatok ${d<5?'zostávajú':'zostáva'} ${d} ${d<5?'dni':'dní'}`;
  return`<span class="chip">${txt}</span>`;
}
function home(){
  S=null;
  const c={known:0,almost:0,learning:0,new:0};V.forEach(v=>c[status(v)]++);
  const weak=V.filter(isWeak).length,n=V.length;
  const seg=k=>`<i style="width:${c[k]/n*100}%;background:${COL[k]}"></i>`;
  app.innerHTML=`<main>
    <header class="hero">
      <h1>Irregular verbs</h1>
      <svg class="swipe" viewBox="0 0 230 18" aria-hidden="true"><path d="M6 11 C60 5 150 4 224 9"/></svg>
      <p class="lead">Vyberaj správne tvary. Čo ešte nevieš, príde znova.</p>
      ${testChip()}
    </header>
    <section class="stats">
      <div class="head"><span class="big">${c.known} <small>z ${n} viem</small></span><span class="xp">⭐ ${P.xp||0} bodov</span></div>
      <div class="meter">${seg('known')}${seg('almost')}${seg('learning')}</div>
      <ul class="legend">
        <li style="--c:${COL.known}">Viem ${c.known}</li>
        <li style="--c:${COL.almost}">Skoro ${c.almost}</li>
        <li style="--c:${COL.learning}">Učím sa ${c.learning}</li>
        <li style="--c:${COL.new}">Nové ${c.new}</li>
      </ul>
    </section>
    <div class="actions">
      <button class="btn primary" data-act="forms">Tvary slovies<br><span class="n" style="font-size:15px">minulý čas a 3. tvar</span></button>
      <button class="btn" data-act="play">Hrať aj s prekladom</button>
      <button class="btn" data-act="mistakes" ${weak?'':'disabled'}>Opakovať chyby <span class="n">${weak}</span></button>
      <button class="btn quiet" data-act="dict">Všetky slovesá</button>
    </div>
  </main>`;
}
function results(){
  const pct=S.answered?S.correct/S.answered:0;
  const stars=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
  const title=['Nevadí, skúsime znova','Dobrý začiatok','Veľmi pekne!','Si hviezda!'][stars];
  const missed=[...S.missed].map(i=>V[i]);
  app.innerHTML=`<main class="res">
    <p class="stars" aria-label="${stars} z 3 hviezd">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</p>
    <h2>${title}</h2>
    <p class="score">${S.correct} z ${S.answered} správne, +${S.xp} bodov</p>
    ${missed.length?`<section class="missed"><h3>Tieto si ešte zopakuj</h3>${missed.map(v=>`<div class="vrow" style="margin:8px 0"><div><div class="forms"><span>${esc(v.b)}</span><span>${esc(v.p)}</span>${v.pp?`<span>${esc(v.pp)}</span>`:''}</div><span class="sk">${esc(v.sk)}</span></div></div>`).join('')}</section>`:''}
    <div class="actions">
      <button class="btn primary" data-act="${S.mode==='forms'?'forms':'play'}">Hrať ďalšie kolo</button>
      ${V.some(isWeak)?`<button class="btn" data-act="mistakes">Opakovať chyby</button>`:''}
      <button class="btn quiet" data-act="home">Domov</button>
    </div></main>`;
  if(stars>=2)confetti();
}
let dictFilter='all',resetArmed=false;
function dict(){
  const rows=V.filter(v=>{const s=status(v);return dictFilter==='all'||(dictFilter==='learning'?(s==='learning'||s==='almost'):s===dictFilter)});
  const f=(k,l)=>`<button data-act="filter" data-f="${k}" aria-pressed="${dictFilter===k}">${l}</button>`;
  app.innerHTML=`<main>
    <div class="dhead"><button class="icon" data-act="home" aria-label="Späť">←</button><h2>Všetky slovesá</h2></div>
    <div class="filters">${f('all','Všetky')}${f('learning','Učím sa')}${f('known','Viem')}${f('new','Nové')}</div>
    <ul class="list">${rows.length?rows.map(v=>`<li><button data-act="say" data-b="${esc(v.b)}"><span class="dot" style="--c:${COL[status(v)]}"></span><span><span class="forms"><span>${esc(v.b)}</span><span>${esc(v.p)}</span>${v.pp?`<span>${esc(v.pp)}</span>`:''}</span><span class="sk">${esc(v.sk)}</span></span></button></li>`).join(''):'<li><p class="empty">Tu zatiaľ nič nie je.</p></li>'}</ul>
    ${canSpeak?'<p class="lead" style="font-size:15px">Ťukni na sloveso a vypočuj si výslovnosť.</p>':''}
    <button class="btn quiet reset" data-act="reset">${resetArmed?'Naozaj vymazať? Ťukni znova':'Vymazať pokrok'}</button>
  </main>`;
}
function confetti(){
  if(reduce)return;
  const box=document.createElement('div');box.className='confetti';
  const cols=['var(--pink)','var(--yellow)','var(--green)','#5B8CFF'];
  for(let k=0;k<36;k++){const i=document.createElement('i');i.style.left=Math.random()*100+'%';i.style.background=pick(cols);i.style.animationDelay=Math.random()*.5+'s';i.style.transform=`rotate(${Math.random()*180}deg)`;box.appendChild(i)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),2300);
}

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act!=='reset')resetArmed=false;
  switch(act){
    case'play':startSession('smart');break;
    case'forms':startSession('forms');break;
    case'mistakes':startSession('mistakes');break;
    case'dict':dictFilter='all';dict();break;
    case'home':home();break;
    case'filter':dictFilter=el.dataset.f;dict();break;
    case'say':{const v=V.find(x=>x.b===el.dataset.b);if(v)sayVerb(v);break}
    case'reset':if(resetArmed){P={v:{},xp:0};save();resetArmed=false;home()}else{resetArmed=true;dict()}break;
    case'speak':sayVerb(V[S.cur.i]);break;
    case'next':S.pos++;nextQ();break;
    case'opt':{
      if(S.locked)return;S.locked=true;
      const k=+el.dataset.k,ok=S.cur.options[k].ok;
      app.querySelectorAll('.opt').forEach((b,j)=>{const o=S.cur.options[j];b.classList.add(o.ok?'correct':j===k?'wrong':'dim')});
      answer(ok);break;
    }
    case'tile':{
      if(S.locked)return;const q=S.cur,s=q.slots.indexOf(null);
      if(s>-1){q.slots[s]=+el.dataset.k;renderQ()}break;
    }
    case'unslot':{
      if(S.locked)return;const k=+el.dataset.k;
      if(S.cur.slots[k]!=null){S.cur.slots[k]=null;renderQ()}break;
    }
    case'check':{
      if(S.locked)return;S.locked=true;
      const v=V[S.cur.i],want=[v.b,v.p,v.pp];
      let all=true;
      app.querySelectorAll('.slot').forEach((b,k)=>{const good=S.cur.tiles[S.cur.slots[k]]===want[k];all=all&&good;b.classList.add(good?'correct':'wrong')});
      app.querySelectorAll('.tile').forEach(t=>t.disabled=true);
      el.disabled=true;
      answer(all);break;
    }
    case'dunno':{
      if(S.locked)return;S.locked=true;
      if(S.cur.options)app.querySelectorAll('.opt').forEach((b,j)=>b.classList.add(S.cur.options[j].ok?'correct':'dim'));
      answer(false);break;
    }
  }
});
document.addEventListener('keydown',e=>{
  if(!S||!S.cur)return;
  if(S.locked&&(e.key==='Enter'||e.key===' ')){const n=$('#fb [data-act=next]');if(n){e.preventDefault();n.click()}return}
  if(!S.locked&&S.cur.options&&/^[1-4]$/.test(e.key)){const b=app.querySelectorAll('.opt')[+e.key-1];if(b)b.click()}
});
if(canSpeak)try{speechSynthesis.getVoices()}catch(e){}
home();
</script>
</body>
</html>
