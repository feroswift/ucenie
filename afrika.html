<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afrika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Zošit na štvorčeky, slepá mapa ako hlavná plocha (rovnaký štýl ako Povrch Slovenska) */
:root{
  --paper:#FFFFFF; --grid:#E1E7F1; --ink:#2336A8; --onink:#FFFFFF;
  --text:#1E2233; --muted:#596077; --card:#FFFFFF; --line:#C9D2E3;
  --sea:#D5E5F4; --land:#F3F1EC; --st0:#FBF1D2; --st:#F4CF6A; --stline:#6B5520; --landline:#2B2F45; --border:#A7AEBF;
  --river:#2F6FCC; --lake:#A9CBEF; --guide:#B5473F; --canal:#0F3F8C;
  --mtn:#D9A877; --mtnline:#7B4B22; --sand:#E2A43C; --pen:#8A5BC7; --belt:#4E8F3A;
  --target:#FFE45C; --okfill:#8FD9AE; --badfill:#F5A7A7; --label:#2B2F45;
  --mint:#FFA3C0; --yellow:#FFE45C;
  --green:#1F8A57; --greenbg:#DDF5E8; --red:#C93C3C; --redbg:#FCE3E3;
  --display:Caveat,"Comic Sans MS",cursive; --body:Nunito,"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161925; --grid:#222738; --ink:#9AABFF; --onink:#111420;
    --text:#ECEFF6; --muted:#A6ADBE; --card:#1E2231; --line:#363D52;
    --sea:#1B2A40; --land:#2A2F3E; --st0:#3A3826; --st:#8C7428; --stline:#E8CF85; --landline:#C9CFE0; --border:#5A6278;
    --river:#6FA3EE; --lake:#2E4F7A; --guide:#F08C82; --canal:#9CC2FF;
    --mtn:#6E5035; --mtnline:#D7A06A; --sand:#C98F2C; --pen:#B48BEA; --belt:#8FCB78;
    --target:#E2C42A; --okfill:#2F8F5B; --badfill:#9A3B3B; --label:#F1F3F9;
    --mint:#B85C7D; --yellow:#C9AE22;
    --green:#56D094; --greenbg:#173A2B; --red:#F07A7A; --redbg:#3E1F25; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#161925; --grid:#222738; --ink:#9AABFF; --onink:#111420;
  --text:#ECEFF6; --muted:#A6ADBE; --card:#1E2231; --line:#363D52;
  --sea:#1B2A40; --land:#2A2F3E; --st0:#3A3826; --st:#8C7428; --stline:#E8CF85; --landline:#C9CFE0; --border:#5A6278;
  --river:#6FA3EE; --lake:#2E4F7A; --guide:#F08C82; --canal:#9CC2FF;
  --mtn:#6E5035; --mtnline:#D7A06A; --sand:#C98F2C; --pen:#B48BEA; --belt:#8FCB78;
  --target:#E2C42A; --okfill:#2F8F5B; --badfill:#9A3B3B; --label:#F1F3F9;
  --mint:#B85C7D; --yellow:#C9AE22;
  --green:#56D094; --greenbg:#173A2B; --red:#F07A7A; --redbg:#3E1F25; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--text);font-family:var(--body);font-size:17px;line-height:1.45;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px}
main{max-width:980px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1,h2,h3{text-wrap:balance}

.hero{margin:14px 4px 22px}
.eyebrow{margin:0;color:var(--muted);font-weight:800;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
.hero h1{font-family:var(--display);font-weight:700;font-size:3.6rem;line-height:1;color:var(--ink);margin:6px 0 0;transform:rotate(-2deg);transform-origin:left}
.hero p.sub{margin:10px 0 0;color:var(--muted)}
.hl{padding:0 6px;background:linear-gradient(transparent 50%,var(--mint) 50%,var(--mint) 92%,transparent 92%);box-decoration-break:clone;-webkit-box-decoration-break:clone}

.lbl{font-weight:800;margin:0 0 8px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:800}
.chip small{color:var(--muted);font-weight:700;margin-left:4px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--onink)}
.chip[aria-pressed="true"] small{color:var(--onink);opacity:.8}
.group{margin:8px 0 26px}
.group h2.gh{font-family:var(--display);font-size:2.2rem;line-height:1;margin:0 0 10px;color:var(--text)}

.acts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.act{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border-radius:18px;border:2px solid var(--line);background:var(--card)}
.act:hover{border-color:var(--ink)}
.act h3{font-family:var(--display);font-size:2rem;line-height:1.05;margin:0;color:var(--ink)}
.act p{margin:0;color:var(--muted)}
.act .best{margin-top:auto;padding-top:6px;font-weight:800;color:var(--text);font-size:.95rem}
.note{color:var(--muted);margin:20px 4px 0;font-size:.95rem}

.bar{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.x{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.1rem;flex:none}
.prog{flex:1;height:14px;border-radius:8px;background:var(--line);overflow:hidden}
.prog div{height:100%;background:var(--ink);border-radius:8px;transition:width .3s ease}
.bar h2{margin:0;font-family:var(--display);font-size:2rem;flex:1;min-width:0}

.ask{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:0 2px 10px}
.ask .q{margin:0;color:var(--muted);font-weight:800;flex-basis:100%}
.ask .big{margin:0;font-family:var(--display);font-size:2.5rem;line-height:1.05;color:var(--ink);font-weight:700}
.ask .fact{margin:0;font-size:1.3rem;font-weight:800;line-height:1.3;padding:12px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);flex-basis:100%}
.again{display:inline-block;padding:2px 10px;border-radius:8px;background:var(--yellow);color:#1E2233;font-weight:800;font-size:.85rem}

.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.zoom{display:flex;align-items:center;gap:6px;margin-left:auto}
.zb{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:1.2rem}
.zb:disabled{opacity:.4;cursor:default}
.zl{min-width:3.4em;text-align:center;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.95rem}
.tog{padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800}
.tog[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.hint{color:var(--muted);font-size:.95rem;margin:0}

.mapwrap{overflow:auto;max-height:min(72vh,660px);border:2px solid var(--line);border-radius:16px;background:var(--sea);touch-action:pan-x pan-y pinch-zoom}
.mapwrap.mini{overflow:hidden;max-height:none}
.map{display:block;width:100%;height:auto;aspect-ratio:var(--ar);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.map .seabg{fill:var(--sea)}
.map .land{fill:var(--land);stroke:var(--border);stroke-width:.8;stroke-linejoin:round}
.map .st{fill:var(--st0);stroke:var(--stline);stroke-width:1.1;stroke-linejoin:round}
.map .borders{fill:none;stroke:var(--border);stroke-width:.8;pointer-events:none}
.map .lakes{fill:var(--lake);pointer-events:none}
.map .riv{fill:none;stroke:var(--river);stroke-width:1;opacity:.55;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.map .nile{fill:none;stroke:var(--river);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.map .cty{fill:var(--muted);font:800 calc(11px * var(--fs,1)) var(--body);letter-spacing:.18em;opacity:.75;pointer-events:none;text-anchor:middle}
.map .capdot{fill:var(--landline);stroke:var(--land);stroke-width:1.6}

.rg{cursor:pointer;transition:fill .15s,stroke .15s}
.rg.off{display:none}
.rg.st{fill:var(--st);stroke:var(--stline);stroke-width:1.4}
.rg.sea{fill:transparent;stroke:none}
.rg.desert{fill:url(#sand);stroke:var(--sand);stroke-width:1.4;stroke-dasharray:5 4}
.rg.mtn{fill:var(--mtn);stroke:var(--mtnline);stroke-width:1.3;fill-opacity:.85}
.rg.pen{fill:url(#hatch);stroke:var(--pen);stroke-width:1.6}
.rg.isl{fill:transparent;stroke:var(--landline);stroke-width:1.3;stroke-dasharray:4 3}
.rg.belt{fill:url(#belt);stroke:var(--belt);stroke-width:1.3;stroke-dasharray:5 4}
.rg.erg{fill:var(--sand);fill-opacity:.5;stroke:var(--sand);stroke-width:1.4}
.rg.water{fill:var(--lake);stroke:var(--river);stroke-width:1.4}
.rg.ln.coast{stroke:var(--pen);stroke-width:4.5;stroke-linecap:round}
.rg.hitell{fill:transparent;stroke:var(--stline);stroke-width:1.2;stroke-dasharray:3 3}
.map .islring{fill:none;stroke:var(--stline);stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.rg.hitell.sel,.rg.hitell.target,.rg.hitell.ok,.rg.hitell.bad{fill-opacity:.35}
.rg.ln{fill:none}
.rg.ln.guide{stroke:var(--guide);stroke-width:1.8;stroke-dasharray:9 6}
.rg.ln.canal{stroke:var(--canal);stroke-width:3.4}
.rg.ln.nile{stroke:var(--river);stroke-width:2.8}
.rg.pt{fill:var(--card);stroke:var(--landline);stroke-width:2}
.rg.cap{fill:var(--landline);stroke:var(--land);stroke-width:2}

.rg.sel,.rg.target{fill:var(--target);stroke:var(--ink);stroke-width:3}
.rg.sea.sel,.rg.sea.target{fill:var(--target);fill-opacity:.6;stroke:none}
.rg.ok{fill:var(--okfill);stroke:var(--green);stroke-width:3}
.rg.bad{fill:var(--badfill);stroke:var(--red);stroke-width:3}
.rg.sea.ok,.rg.sea.bad{fill-opacity:.6;stroke:none}
.rg.desert.sel,.rg.desert.target,.rg.desert.ok,.rg.desert.bad{fill-opacity:.7;stroke-dasharray:none}
.rg.ln.sel,.rg.ln.target{stroke:var(--target);stroke-width:7;stroke-dasharray:none}
.rg.ln.ok{stroke:var(--green);stroke-width:7;stroke-dasharray:none}
.rg.ln.bad{stroke:var(--red);stroke-width:7;stroke-dasharray:none}
.rg.target{animation:pulse 1.1s ease-in-out infinite}
.rg.ln.target{animation:pulseln 1.1s ease-in-out infinite}
@keyframes pulse{50%{stroke-width:7}}
@keyframes pulseln{50%{stroke-width:11}}
@media (hover:hover){.map.live .rg:not(.ln):not(.ok):not(.bad):not(.target):not(.sel):hover{filter:brightness(1.07);stroke-width:2.6}}
.tn{font:800 calc(12px * var(--fs,1)) var(--body);fill:var(--label);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.tn.c{font-weight:700;font-size:calc(11px * var(--fs,1));text-anchor:start}

.info{display:flex;flex-direction:column;gap:4px;min-height:58px;padding:12px 16px;border-radius:14px;border:2px dashed var(--line);background:var(--card);margin-bottom:10px}
.info.on{border-style:solid;border-color:var(--ink)}
.info .nm{font-family:var(--display);font-size:2rem;line-height:1;font-weight:700}
.info .ty{color:var(--muted);font-size:.95rem}
.info ul{margin:4px 0 0;padding-left:20px}
.info b{font-weight:800}

.legend{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:18px}
.legend h3{margin:0 0 8px;font-size:1rem}
.legend ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.legend button{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;padding:6px 10px;border-radius:10px;border:2px solid transparent;background:transparent}
.legend button:hover{border-color:var(--line);background:var(--card)}
.legend button[aria-pressed="true"]{border-color:var(--ink);background:var(--card)}
.legend small{color:var(--muted)}

.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:12px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:58px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:1.05rem;text-align:left}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--greenbg)}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
@media (max-width:420px){.opts{grid-template-columns:1fr}.opt{min-height:50px}}

.fb{margin-top:12px;padding:14px 16px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fb.ok{background:var(--greenbg);border:2px solid var(--green)}
.fb.no{background:var(--redbg);border:2px solid var(--red)}
.fb p{margin:0;font-weight:700;min-width:0;flex:1 1 220px}
.btn{padding:12px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:800}
.btn.primary{background:var(--ink);color:var(--onink)}

.end{text-align:center;padding-top:26px}
.stars{font-size:3rem;letter-spacing:6px}
.end h2{font-family:var(--display);font-size:3rem;color:var(--ink);margin:8px 0 4px}
.score{font-size:1.25rem;font-weight:800;margin:0 0 18px}
.miss{max-width:560px;margin:0 auto 22px;text-align:left;padding:14px 18px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.miss h3{margin:0 0 6px;font-size:1rem}
.miss ul{margin:0;padding-left:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){.rg.target{animation:none;stroke-width:5}.rg.ln.target{animation:none;stroke-width:9}.prog div{transition:none}}
@media (max-width:520px){.hero h1{font-size:3rem}.ask .big{font-size:2.1rem}.ask .fact{font-size:1.15rem}}
</style>
</head>

const rings = d => d.split("M").filter(Boolean).map(s=>s.replace(/Z$/,"").split("L").map(p=>p.trim().split(/\s+/).map(Number)));
const LANDALL = GEO.land+Object.values(GEO.states).join("");

const ITEMS = {};
Object.entries(STATES).forEach(([id,s])=>{
  const r=rings(GEO.states[id]);
  const h=GEO.stateHit&&GEO.stateHit[id];
  ITEMS[id]=h?{id,k:"s",n:s.n,g:{t:"ell",cx:h.cx,cy:h.cy,rx:h.rx,ry:h.ry,rot:h.rot},c:GEO.stateLabel[id],area:Math.PI*h.rx*h.ry,isl:true}
    :{id,k:"s",n:s.n,g:{t:"poly",r},c:GEO.stateLabel[id],area:areaOf(r)};
  if(!s.noCap)ITEMS["c-"+id]={id:"c-"+id,k:"c",n:s.cap,of:id,g:{t:"pt",x:GEO.capitals[id][0],y:GEO.capitals[id][1],rad:6},c:GEO.capitals[id],area:.5};
});
Object.entries(TERMS).forEach(([id,t])=>{
  const g=GEO.terms[id]; let geo;
  if(g.t==="sea"||g.t==="land"||g.t==="water")geo={t:"poly",r:rings(g.d),sea:g.t==="sea",onland:g.t==="land"};
  else if(g.t==="line")geo={t:"line",r:rings(g.d)};
  else if(g.t==="pt")geo={t:"pt",x:g.x,y:g.y,rad:8,s:g.s};
  else geo={t:"ell",cx:g.cx,cy:g.cy,rx:g.rx,ry:g.ry,rot:g.rot};
  let c=g.l||(geo.t==="pt"?[g.x,g.y]:null);
  if(!c&&geo.t==="line"){const all=geo.r.flat();c=all[Math.floor(all.length/2)]}
  ITEMS[id]={id,k:"t",n:t.n,g:geo,c,nl:g.nl,area:geo.t==="poly"?areaOf(geo.r):geo.t==="ell"?Math.PI*geo.rx*geo.ry:geo.t==="pt"?.5:1};
});
function areaOf(R){let s=0;R.forEach(r=>{let a=0;r.forEach((p,i)=>{const q=r[(i+1)%r.length];a+=p[0]*q[1]-q[0]*p[1]});s+=Math.abs(a/2)});return s}
function inRings(R,x,y){let c=false;for(const P of R){for(let i=0,j=P.length-1;i<P.length;j=i++){const[a,b]=P[i],[e,f]=P[j];if((b>y)!==(f>y)&&x<(e-a)*(y-b)/(f-b)+a)c=!c}}return c}
function segDist(x,y,[a,b],[e,f]){const dx=e-a,dy=f-b,l=dx*dx+dy*dy;let t=l?((x-a)*dx+(y-b)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(x-a-t*dx,y-b-t*dy)}
function lineDist(R,x,y){let m=1e9;for(const P of R)for(let i=1;i<P.length;i++)m=Math.min(m,segDist(x,y,P[i-1],P[i]));return m}
function polyDist(R,x,y){let m=1e9;for(const P of R)for(let i=0;i<P.length;i++)m=Math.min(m,segDist(x,y,P[i],P[(i+1)%P.length]));return m}
const onLand=(x,y)=>inRings(LANDR,x,y);
function measure(it,x,y,tol){ // [zásah?, vzdialenosť]
  const g=it.g;
  if(g.t==="pt"){const d=Math.hypot(x-g.x,y-g.y)-g.rad;return [d<=0,Math.max(0,d)]}
  if(g.t==="line"){const d=lineDist(g.r,x,y);return [d<=tol*.45,d]}
  if(g.t==="ell"){
    const a=-g.rot*Math.PI/180,dx=x-g.cx,dy=y-g.cy,xr=dx*Math.cos(a)-dy*Math.sin(a),yr=dx*Math.sin(a)+dy*Math.cos(a);
    const d=Math.hypot(xr/g.rx,yr/g.ry);return [d<=1,d<=1?0:Math.hypot(dx,dy)*(1-1/d)]}
  let inside=inRings(g.r,x,y);
  if(inside&&g.sea&&onLand(x,y))inside=false;
  if(inside&&g.onland&&!onLand(x,y))inside=false;
  return [inside,inside?0:(g.sea?1e9:polyDist(g.r,x,y))];
}
function pickAt(x,y,ids,tol){
  let best=null,bestA=1e15,near=null,nearD=tol;
  ids.forEach(id=>{const it=ITEMS[id],[hit,d]=measure(it,x,y,tol);
    if(hit&&it.area<bestA){best=id;bestA=it.area}else if(!hit&&d<nearD){near=id;nearD=d}});
  return best||near;
}
const hits=(id,x,y,tol)=>{const [h,d]=measure(ITEMS[id],x,y,tol);return h||d<tol*.6};

function shape(id,cls){
  const it=ITEMS[id],g=it.g,d=`class="rg ${cls}" data-id="${id}"`;
  if(it.k==="s")return `<path ${d} d="${GEO.states[id]}"/>`+(it.isl?`<ellipse class="rg ${cls} hitell" data-id="${id}" cx="${g.cx}" cy="${g.cy}" rx="${g.rx}" ry="${g.ry}"/>`:"");
  if(it.k==="c")return `<circle ${d} cx="${g.x}" cy="${g.y}" r="5.5"/>`;
  const raw=GEO.terms[id];
  if(g.t==="ell")return `<ellipse ${d} cx="${g.cx}" cy="${g.cy}" rx="${g.rx}" ry="${g.ry}" transform="rotate(${g.rot} ${g.cx} ${g.cy})"/>`;
  if(g.t==="pt"){
    if(g.s==="peak")return `<path ${d} d="M${g.x} ${g.y-10}L${g.x+9} ${g.y+6}L${g.x-9} ${g.y+6}Z"/>`;
    if(g.s==="dam")return `<rect ${d} x="${g.x-9}" y="${g.y-4}" width="18" height="8" rx="2"/>`;
    return `<circle ${d} cx="${g.x}" cy="${g.y}" r="7"/>`;
  }
  return `<path ${d} d="${raw.d}"${g.onland?' clip-path="url(#landclip)"':""}/>`;
}
const TCLS={atl:"sea",med:"sea",red:"sea",sahara:"desert",atlas:"mtn",ahaggar:"mtn",tibesti:"mtn",sinai:"pen",canary:"isl",nile:"ln nile",suez:"ln canal",tropic:"ln guide",meridian:"ln guide",gib:"pt",aswan:"pt",tubkal:"pt",

function mapMarkup(o){ // o: {layer:'s'|'t'|'c'|null, active:[], names:bool, live:bool, focus:id}

function mountMap(onPick){
  const wrap=app.querySelector(".mapwrap:not(.mini)"); if(!wrap)return;
  const svg=wrap.querySelector("svg");
  if(ZOOM===null) ZOOM = wrap.clientWidth<620?2:1;
  applyZoom(ZOOM,false);
  svg.addEventListener("click",e=>{
    if(!onPick)return;
    const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
    const q=p.matrixTransform(svg.getScreenCTM().inverse());
    const scale=svg.getBoundingClientRect().width/VB()[2];
    onPick(q.x,q.y,22/scale);
  });
}
function applyZoom(z,keep=true){
  const wrap=app.querySelector(".mapwrap:not(.mini)");if(!wrap)return;
  const svg=wrap.querySelector("svg");
  const fx=keep&&wrap.scrollWidth?(wrap.scrollLeft+wrap.clientWidth/2)/wrap.scrollWidth:.5;
  const fy=keep&&wrap.scrollHeight?(wrap.scrollTop+wrap.clientHeight/2)/wrap.scrollHeight:.5;
  ZOOM=z; svg.style.width=(z*100)+"%";
  wrap.scrollLeft=fx*wrap.scrollWidth-wrap.clientWidth/2;
  wrap.scrollTop=fy*wrap.scrollHeight-wrap.clientHeight/2;
  const i=ZL.indexOf(z);
  const zl=document.getElementById("zl"); if(zl)zl.textContent=Math.round(z*100)+" %";
  app.querySelectorAll('[data-act="zout"]').forEach(b=>b.disabled=i<=0);
  app.querySelectorAll('[data-act="zin"]').forEach(b=>b.disabled=i>=ZL.length-1);
}
function focusOn(id){
  const wrap=app.querySelector(".mapwrap:not(.mini)");if(!wrap||!ITEMS[id].c)return;
  const svg=wrap.querySelector("svg"),vb=VB(),s=svg.clientWidth/vb[2],c=ITEMS[id].c;
  const x=(c[0]-vb[0])*s, y=(c[1]-vb[1])*s, m=60;
  const vis=x>wrap.scrollLeft+m&&x<wrap.scrollLeft+wrap.clientWidth-m&&y>wrap.scrollTop+m&&y<wrap.scrollTop+wrap.clientHeight-m;
  if(!vis) wrap.scrollTo({left:x-wrap.clientWidth/2,top:y-wrap.clientHeight/2,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}

  const card=(m,act="quiz")=>`<button class="act" data-act="${act}" data-m="${m}"><h3>${MODES[m].title}</h3><p>${MODES[m].desc}</p><span class="best">${best(m)}</span></button>`;
  app.innerHTML=`<header class="hero"><p class="eyebrow">Zemepis</p><h1><span class="hl">Afrika</span></h1>
    <p class="sub">${esc(SECTIONS[SEC].label)}: ${esc(SECTIONS[SEC].sub)}</p></header>
    <p class="lbl">Časť Afriky</p><div class="sets" role="group" aria-label="Časť Afriky">${secs}</div>
    <section class="group"><h2 class="gh">Slepá mapa</h2>
      <div class="sets" role="group" aria-label="Čo hľadáme na mape">${lays}</div>
      <div class="acts">
        <button class="act" data-act="learn"><h3>Prezri si mapu</h3><p>Ťukni na miesto na mape a uvidíš, čo to je. Dole je celý zoznam.</p><span class="best">Na učenie</span></button>
        ${card("find")}${card("name")}
      </div></section>
    <section class="group"><h2 class="gh">Štáty a hlavné mestá</h2>
      <div class="acts">${card("caps")}${card("facts")}</div></section>
    <p class="note">Častejšie sa pýtam na to, čo ti ešte nejde. ${esc(SECTIONS[SEC].source)}</p>`;
  window.scrollTo(0,0);
}

/* --- prezeranie --- */
function learn(){S={mode:"learn",active:layerIds(LAYER).slice(),names:false,sel:null};if(LAYER==="s")S.active.push(...capStates().map(id=>"c-"+id));renderLearn()}
function renderLearn(){
  let groups;
  if(LAYER==="s") groups=`<section><h3>Štáty</h3><ol>${SECTIONS[SEC].states.map(id=>`<li><button data-act="pick" data-id="${id}" aria-pressed="${S.sel===id}"><span>${esc(STATES[id].n)}</span>${STATES[id].noCap?`<small>územie</small>`:`<small>${esc(STATES[id].cap)}</small>`}</button></li>`).join("")}</ol></section>`;
  else{const by={};SECTIONS[SEC].terms.forEach(id=>{(by[TERMS[id].g]=by[TERMS[id].g]||[]).push(id)});
    groups=Object.entries(by).map(([g,ids])=>`<section><h3>${esc(g)}</h3><ol>${ids.map(id=>`<li><button data-act="pick" data-id="${id}" aria-pressed="${S.sel===id}"><span>${esc(TERMS[id].n)}</span><small>${esc(TERMS[id].ty)}</small></button></li>`).join("")}</ol></section>`).join("")}
  app.innerHTML=`<div class="bar"><button class="x" data-act="home" aria-label="Späť na začiatok">✕</button><h2>Prezri si mapu</h2></div>
    <div class="info" id="info"></div>
    ${toolsMarkup(`<button class="tog" data-act="names" aria-pressed="${S.names}">Názvy na mape</button>`)}
    <div class="mapwrap">${mapMarkup({layer:LAYER,active:S.active,names:S.names,live:true,caps:true})}</div>
    <div class="legend">${groups}</div>`;
  mountMap((x,y,tol)=>{const id=pickAt(x,y,S.active,tol);if(id)select(id,false)});
  if(S.sel)select(S.sel,false); else showInfo(null);
}
function showInfo(id){
  const el=document.getElementById("info");
  if(!id){el.className="info";el.innerHTML=`<p class="hint">${LAYER==="s"?"Ťukni na štát alebo na bodku hlavného mesta.":"Ťukni na miesto na mape alebo vyber názov zo zoznamu."}</p>`;return}
  el.className="info on"; const it=ITEMS[id];
  if(it.k==="c"){const s=STATES[it.of];el.innerHTML=`<div class="nm">${esc(it.n)}</div><div class="ty">hlavné mesto štátu ${esc(s.n)}</div>`;return}
  if(it.k==="s"){const s=STATES[id];
    el.innerHTML=s.noCap?`<div class="nm">${esc(s.n)}</div><div class="ty">${esc(s.ty)}</div><p class="hint">${esc(s.note)}</p>`
      :`<div class="nm">${esc(s.n)}</div><div class="ty">Hlavné mesto: <b>${esc(s.cap)}</b>${s.capNote?` (${esc(s.capNote)})`:""}</div>
        <ul>${s.facts.map(f=>`<li>${esc(f.t)}</li>`).join("")}</ul>
        <p class="hint">${esc(s.more)}${s.places.length?` Známe miesta: ${esc(s.places.join(", "))}.`:""}</p>`;return}
  const t=TERMS[id]; el.innerHTML=`<div class="nm">${esc(t.n)}</div><div class="ty">${esc(t.ty)}</div><p class="hint">${esc(t.note)}</p>`;
}
function select(id,scroll){
  S.sel=id; clearMarks(); mark(id,"sel"); showInfo(id);
  app.querySelectorAll(".legend button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.id===id)));
  if(scroll){const inf=document.getElementById("info");if(inf.getBoundingClientRect().top<0)inf.scrollIntoView({block:"start",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});focusOn(id)}
}

/* --- testy --- */
function weighted(ids,n){
  const st=stats();
  return ids.map(id=>{const s=st[id]||{r:0,w:0};return {id,v:Math.random()*1.2+s.w*.5-Math.min(s.r,5)*.25}})
    .sort((a,b)=>b.v-a.v).slice(0,n).map(o=>o.id);
}
function startQuiz(m){
  let queue;
  if(m==="find"||m==="name") queue=shuffle(weighted(layerIds(LAYER),qCount(m))).map(id=>({k:m,id}));
  else if(m==="caps") queue=capsQueue();
  else queue=factsQueue();
  S={mode:m,queue,i:0,score:0,done:false,missed:[]};
  renderQ();
}
function capsQueue(){
  const out=[], cs=capStates(), n=MODES.caps.count;
  if(cs.length*2<=n) cs.forEach(id=>shuffle(["cap","capstate","capmap"]).slice(0,2).forEach(k=>out.push({k,id})));
  else{ // veľa štátov: každý najviac raz, častejšie tie, ktoré ešte nejdú
    const st=stats(), bad=id=>["cap","capstate","capmap"].reduce((a,k)=>{const s=st[`${k}:${id}`]||{r:0,w:0};return a+s.w*.6-Math.min(s.r,3)*.2},0);
    cs.map(id=>({id,v:Math.random()*1.5+bad(id)})).sort((a,b)=>b.v-a.v).slice(0,n).forEach(o=>out.push({k:pick(["cap","capstate","capmap"]),id:o.id}));
  }
  let q=shuffle(out); // nech nejde ten istý štát dvakrát po sebe
  for(let i=1;i<q.length;i++)if(q[i].id===q[i-1].id){const j=q.findIndex((x,k)=>k>i&&x.id!==q[i].id&&(!q[k+1]||q[k+1].id!==q[i].id));if(j>0)[q[i],q[j]]=[q[j],q[i]]}
  return q;
}
function factsQueue(){
  const cs=capStates(), facts=[], places=[];
  cs.forEach(id=>{STATES[id].facts.forEach((f,i)=>facts.push({k:"f2s",id,fi:i}));STATES[id].places.forEach(p=>places.push({k:"place",id,p}))});
  const s2f=shuffle(cs).slice(0,2).map(id=>({k:"s2f",id}));
  const sel=[...shuffle(facts).slice(0,5),...s2f,...shuffle(places).slice(0,3)];
  return shuffle(sel);
}
const statKey=q=>q.k==="find"||q.k==="name"?q.id:q.k==="f2s"?`${q.k}:${q.id}:${q.fi}`:q.k==="place"?`place:${q.p}`:`${q.k}:${q.id}`;
function stateOpts(id,exclude=[]){
  const others=shuffle(capStates().filter(x=>x!==id&&!exclude.includes(x))).slice(0,3);
  return shuffle([id,...others]).map(x=>({t:STATES[x].n,ok:x===id}));
}
function buildOpts(q){
  const s=STATES[q.id];
  if(q.k==="name"){
    const it=ITEMS[q.id], same=layerIds(LAYER).filter(x=>x!==q.id);
    const near=same.slice().sort((a,b)=>dist(it.c,ITEMS[a].c)-dist(it.c,ITEMS[b].c)).slice(0,4);
    const two=shuffle(near).slice(0,2), one=shuffle(same.filter(x=>!two.includes(x))).slice(0,1);
    return shuffle([q.id,...two,...one]).map(x=>({t:ITEMS[x].n,ok:x===q.id}));
  }
  if(q.k==="cap"){
    const local=shuffle(s.cities).slice(0,1), other=shuffle(capStates().filter(x=>x!==q.id).map(x=>STATES[x].cap)).slice(0,3-local.length);
    return shuffle([s.cap,...local,...other]).map(t=>({t,ok:t===s.cap}));
  }
  if(q.k==="capstate")return stateOpts(q.id);
  if(q.k==="f2s")return stateOpts(q.id,s.facts[q.fi].also||[]);
  if(q.k==="place")return stateOpts(q.id);
  if(q.k==="s2f"){
    const right=pick(s.facts);
    const pool=[];capStates().filter(x=>x!==q.id).forEach(x=>STATES[x].facts.forEach(f=>{if(!(f.also||[]).includes(q.id)&&!(right.also||[]).includes(x))pool.push(f.t)}));
    return shuffle([right.t,...shuffle(pool).slice(0,3)]).map(t=>({t,ok:t===right.t}));
  }
}
function askMarkup(q){
  const s=STATES[q.id];
  switch(q.k){
    case "find": return `<p class="q">Nájdi na mape</p><p class="big">${esc(nameOf(q.id))}</p>`;
    case "name": return `<p class="q">Čo je na mape vysvietené?</p>`;
    case "cap": return `<p class="q">Aké je hlavné mesto?</p><p class="big">${esc(s.n)}</p>`;
    case "capstate": return `<p class="q">Ktorého štátu je to hlavné mesto?</p><p class="big">${esc(s.cap)}</p>`;
    case "capmap": return `<p class="q">Ťukni na mape na hlavné mesto</p><p class="big">${esc(s.cap)}</p>`;
    case "f2s": return `<p class="q">O ktorom štáte to platí?</p><p class="fact">${esc(s.facts[q.fi].t)}</p>`;
    case "s2f": return `<p class="q">Čo platí o tomto štáte?</p><p class="big">${esc(s.n)}</p>`;
    case "place": return `<p class="q">V ktorom štáte to je?</p><p class="big">${esc(q.p)}</p>`;
  }
}
function renderQ(){
  const q=S.queue[S.i], total=S.queue.length, pct=Math.round(S.i/total*100);
  S.done=false;
  const needOpts=!["find","capmap"].includes(q.k);
  if(needOpts&&!q.opts)q.opts=buildOpts(q);
  let map="";
  if(q.k==="find") map=toolsMarkup(`<p class="hint">Ťukni na správne miesto.</p>`)+`<div class="mapwrap">${mapMarkup({layer:LAYER,active:layerIds(LAYER),live:true})}</div>`;
  else if(q.k==="name") map=toolsMarkup()+`<div class="mapwrap">${mapMarkup({layer:LAYER,active:layerIds(LAYER)})}</div>`;
  else if(q.k==="capmap") map=toolsMarkup(`<p class="hint">Ťukni na správnu bodku.</p>`)+`<div class="mapwrap">${mapMarkup({layer:"c",active:capStates().map(id=>"c-"+id),live:true})}</div>`;
  else if(q.k==="cap") map=`<div class="mapwrap mini">${mapMarkup({layer:"s",active:[q.id]})}</div>`;
  const long=q.opts&&q.opts.some(o=>o.t.length>28);
  app.innerHTML=`<div class="bar"><button class="x" data-act="home" aria-label="Späť na začiatok">✕</button>
      <div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div></div>
    <div class="ask">${q.retry?`<span class="again">Ešte raz</span>`:""}${askMarkup(q)}</div>
    ${map}
    ${q.opts?`<div class="opts${long?" one":""}">${q.opts.map((o,i)=>`<button class="opt" data-act="opt" data-i="${i}">${esc(o.t)}</button>`).join("")}</div>`:""}
    <div id="fb" aria-live="polite"></div>`;
  if(q.k==="find")mountMap((x,y,tol)=>answerMap(x,y,tol,layerIds(LAYER),q.id));
  else if(q.k==="capmap")mountMap((x,y,tol)=>answerMap(x,y,tol,capStates().map(id=>"c-"+id),"c-"+q.id));
  else mountMap(null);
  if(q.k==="name"){mark(q.id,"target");requestAnimationFrame(()=>focusOn(q.id))}
  if(q.k==="cap")mark(q.id,"target");
}
function feedback(ok,text){
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><p>${text}</p><button class="btn primary" data-act="next">Ďalej</button></div>`;
  app.querySelector('[data-act="next"]').focus({preventScroll:true});
}
function missText(q){
  const s=STATES[q.id];
  switch(q.k){
    case "find":case "name":return nameOf(q.id);
    case "cap":case "capstate":case "capmap":return `${s.n} – ${s.cap}`;
    case "f2s":return `${s.n}: ${s.facts[q.fi].t}`;
    case "s2f":return `${s.n}: ${s.facts.map(f=>f.t).join(" ")}`;
    case "place":return `${q.p} – ${s.n}`;
  }
}
function settle(ok){
  const q=S.queue[S.i];
  if(ok&&!q.retry)S.score++;
  if(!q.retry)note(statKey(q),ok);
  if(!ok){S.queue.push({...q,retry:true,opts:null});const t=missText(q);if(!S.missed.includes(t))S.missed.push(t)}
  const m=app.querySelector(".map.live");if(m)m.classList.remove("live");
}
function answerMap(x,y,tol,ids,target){
  if(S.done)return;
  const id=hits(target,x,y,tol)?target:pickAt(x,y,ids,tol);
  if(!id)return;
  S.done=true; const ok=id===target; clearMarks();
  const q=S.queue[S.i], isCap=q.k==="capmap";
  if(ok){mark(id,"ok");feedback(true,`${praise()} ${isCap?`${esc(STATES[q.id].cap)} je hlavné mesto štátu ${esc(STATES[q.id].n)}.`:`Toto je ${esc(nameOf(id))}.`}`)}
  else{mark(id,"bad");mark(target,"ok");focusOn(target);
    feedback(false,isCap?`Toto je ${esc(nameOf(id))} (${esc(STATES[ITEMS[id].of].n)}). ${esc(STATES[q.id].cap)} je zelená bodka.`
      :`Ťukla si na: ${esc(nameOf(id))}. ${esc(nameOf(target))} je zelené.`)}
  settle(ok);
}
function answerOpt(i){
  if(S.done)return; S.done=true;
  const q=S.queue[S.i], ok=q.opts[i].ok, right=q.opts.find(o=>o.ok).t;
  app.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add("right");else if(j===i)b.classList.add("wrong")});
  if(q.k==="name"){clearMarks();mark(q.id,ok?"ok":"bad")}
  if(q.k==="cap"){clearMarks();mark(q.id,"ok")}
  const s=STATES[q.id];
  const extra=!s||q.k==="name"?"":{cap:`${s.cap} je hlavné mesto štátu ${s.n}.`,capstate:`${s.cap} je hlavné mesto štátu ${s.n}.`,place:`${q.p} je v štáte ${s.n}.`,f2s:`Platí to o štáte ${s.n}.`,s2f:`O štáte ${s.n} platí: ${right}`}[q.k]||"";
  feedback(ok,ok?`${praise()} ${esc(extra)}`:`Správne je: ${esc(right)}. ${q.k==="name"?"":esc(extra)}`);
  settle(ok);
}
function next(){S.i++; if(S.i>=S.queue.length)end(); else{renderQ();window.scrollTo({top:0})}}
function end(){
  const n=qCount(S.mode), s=S.score, k=bestKey(S.mode);
  if(s>load(k,0))save(k,s);
  const stars=s>=n*.9?3:s>=n*.6?2:1;
  const msg=stars===3?"Výborne!":stars===2?"Dobrá práca!":"Ide ti to, skús znova!";
  app.innerHTML=`<div class="end"><div class="stars" aria-label="${stars} z 3 hviezd">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
    <h2>${msg}</h2><p class="score">Na prvý pokus správne: ${s} z ${n}</p>
    ${S.missed.length?`<div class="miss"><h3>Ešte potrénuj</h3><ul>${S.missed.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}
    <div class="row"><button class="btn primary" data-act="quiz" data-m="${S.mode}">Hrať znova</button><button class="btn" data-act="home">Späť na začiatok</button></div></div>`;
  window.scrollTo(0,0);
}

app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const a=b.dataset.act;
  if(a==="sec"){SEC=b.dataset.k;save("afrika-sec",SEC);home()}
  else if(a==="layer"){LAYER=b.dataset.k;save("afrika-layer",LAYER);home()}
  else if(a==="learn")learn();
  else if(a==="quiz")startQuiz(b.dataset.m);
  else if(a==="home")home();
  else if(a==="opt")answerOpt(+b.dataset.i);
  else if(a==="next")next();
  else if(a==="pick")select(b.dataset.id,true);
  else if(a==="names"){S.names=!S.names;renderLearn()}
  else if(a==="zin"){const i=ZL.indexOf(ZOOM);if(i<ZL.length-1)applyZoom(ZL[i+1])}
  else if(a==="zout"){const i=ZL.indexOf(ZOOM);if(i>0)applyZoom(ZL[i-1])}
});

home();
</script>
<script>
/* Odkaz späť na rozcestník Učíme sa hravo (len na webe) */
(function(){
  if(!/^https?:$/.test(location.protocol))return;
  var css=document.createElement("style");
  css.textContent='.hub-back{display:inline-flex;align-items:center;margin:0 0 12px;padding:5px 12px 5px 9px;border-radius:999px;border:1.5px solid currentColor;color:inherit;opacity:.7;font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;text-decoration:none;transform:none;position:relative;z-index:1}.hub-back:focus-visible{outline:3px solid currentColor;outline-offset:2px}';
  document.head.appendChild(css);
  var T=[[".hero",0],["#home",0],["h1.hello",1]];
  function place(){
    for(var i=0;i<T.length;i++){
      var el=document.querySelector(T[i][0]);if(!el)continue;
      var box=T[i][1]?document.getElementById("app"):el;
      if(!box)return;
      var f=box.firstElementChild;if(f&&f.classList.contains("hub-back"))return;
      var a=document.createElement("a");a.className="hub-back";a.href="./";a.textContent="‹ Všetky appky";
      box.insertBefore(a,box.firstChild);return;
    }
  }
  place();new MutationObserver(place).observe(document.body,{childList:true,subtree:true});
})();
</script>
