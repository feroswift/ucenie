<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Učíme sa hravo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--grid:#E1E7F1;--ink:#2336A8;--text:#1E2233;--muted:#596077;--card:#FFFFFF;--line:#C9D2E3;
  --veronika:#7FD8C4;--simonka:#FFA3C0;--yellow:#FFE45C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#161925;--grid:#222738;--ink:#9AABFF;--text:#ECEFF6;--muted:#A6ADBE;--card:#1E2231;--line:#363D52;--veronika:#2F8C78;--simonka:#B85C7D;--yellow:#C9AE22}}
:root[data-theme="dark"]{--paper:#161925;--grid:#222738;--ink:#9AABFF;--text:#ECEFF6;--muted:#A6ADBE;--card:#1E2231;--line:#363D52;--veronika:#2F8C78;--simonka:#B85C7D;--yellow:#C9AE22}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--text);font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.45;
  background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
a,button{font:inherit;color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1{font-family:Caveat,cursive;font-weight:700;font-size:3.6rem;line-height:1;color:var(--ink);margin:18px 0 8px;transform:rotate(-2deg);transform-origin:left}
.sub{color:var(--muted);margin:0 0 28px}
.who{display:grid;gap:14px}
.person{display:flex;align-items:center;gap:16px;width:100%;padding:22px 20px;border-radius:20px;border:2px solid var(--line);background:var(--card);cursor:pointer;text-align:left}
.person .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:Caveat,cursive;font-size:2.4rem;font-weight:700;color:#1E2233;flex:none}
.person .nm{font-family:Caveat,cursive;font-size:2.4rem;font-weight:700;line-height:1}
.person .ct{color:var(--muted);font-size:.95rem}
.top{display:flex;align-items:center;gap:12px;margin-top:10px}
.back{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:1.2rem;flex:none}
.top h1{margin:0}
.hl{padding:0 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.subject{margin-top:26px}
.subject h2{font-size:1.1rem;font-weight:800;color:var(--muted);margin:0 0 10px}
.apps{display:grid;gap:10px}
.app{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--card);text-decoration:none}
.app:hover{border-color:var(--ink)}
.app .e{font-size:2rem;flex:none}
.app .t{font-weight:800;font-size:1.1rem}
.app .d{color:var(--muted);font-size:.93rem}
.switch{margin-top:34px;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* =====================================================================
   ROZCESTNÍK – všetko sa upravuje len tu.
   Nová appka: skopíruj riadok { title, desc, file, e } do správneho predmetu.
   Nový predmet: skopíruj celý blok { name, apps:[...] }.
   file = názov súboru v tomto priečinku (alebo celá https:// adresa).
   ===================================================================== */
const ANGLICTINA = { name:"Angličtina", apps:[
  { title:"Irregular verbs", desc:"Nepravidelné slovesá", file:"irregular-verbs.html", e:"🇬🇧" }
]};

const KIDS = {
  veronika:{ name:"Veronika", color:"var(--veronika)", subjects:[
    { name:"Chémia", apps:[
      { title:"Prvky po stĺpcoch", desc:"Periodická tabuľka po skupinách", file:"prvky.html", e:"⚗️" }
    ]},
    { name:"Zemepis", apps:[
      { title:"Povrch Slovenska", desc:"Pohoria, nížiny a kotliny na slepej mape", file:"povrch-slovenska.html", e:"🗺️" }
    ]},
    ANGLICTINA
  ]},
  simonka:{ name:"Simonka", color:"var(--simonka)", subjects:[
    { name:"Fyzika", apps:[
      { title:"Fyzika hravo", desc:"Vynálezcovia, veličiny, látky a telesá", file:"fyzika-hravo.html", e:"🔭" }
    ]},
    { name:"Nemčina", apps:[
      { title:"Deutsch hravo", desc:"Slovíčka po lekciách", file:"deutsch-hravo.html", e:"🇩🇪" }
    ]},
    { name:"Angličtina", apps:[
      { title:"Irregular verbs", desc:"Nepravidelné slovesá na piatok (be – leave)", file:"irregular-verbs-simonka.html", e:"🇬🇧" }
    ]}
  ]}
};

/* ===================================================================== */
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function remember(k){try{k?localStorage.setItem("ucenie-kto",k):localStorage.removeItem("ucenie-kto")}catch(e){}}
function remembered(){try{return localStorage.getItem("ucenie-kto")}catch(e){return null}}
const count=k=>KIDS[k].subjects.map(s=>s.name).join(", ");

function pick(){
  remember(null);
  app.innerHTML=`<h1>Učíme sa hravo</h1><p class="sub">Kto sa ide učiť?</p>
  <div class="who">${Object.entries(KIDS).map(([k,c])=>`
    <button class="person" data-k="${k}">
      <span class="av" style="background:${c.color}">${esc(c.name[0])}</span>
      <span><span class="nm">${esc(c.name)}</span><br><span class="ct">${esc(count(k))}</span></span>
    </button>`).join("")}</div>`;
}

function kid(k){
  const c=KIDS[k]; if(!c)return pick();
  remember(k);
  app.innerHTML=`<div class="top"><button class="back" data-act="pick" aria-label="Späť na výber">‹</button>
    <h1><span class="hl" style="background:linear-gradient(transparent 50%,${c.color} 50%,${c.color} 92%,transparent 92%)">${esc(c.name)}</span></h1></div>
    ${c.subjects.map(s=>`<section class="subject"><h2>${esc(s.name)}</h2><div class="apps">
      ${s.apps.map(a=>`<a class="app" href="${esc(a.file)}"><span class="e" aria-hidden="true">${a.e}</span>
        <span><span class="t">${esc(a.title)}</span><br><span class="d">${esc(a.desc)}</span></span></a>`).join("")}
    </div></section>`).join("")}
    <button class="switch" data-act="pick">Nie som ${esc(c.name)}</button>`;
}

app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.k)kid(b.dataset.k);
  else if(b.dataset.act==="pick")pick();
});

const saved=remembered();
saved&&KIDS[saved]?kid(saved):pick();
</script>
</body>
</html>
