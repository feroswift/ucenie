<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VHF Rádiotelefonista – príprava na skúšku</title>
<style>
:root{
  --navy:#0f2a44; --navy2:#173a5e; --sea:#e8f0f7; --paper:#fbfaf6; --ink:#16222e; --mute:#5d6b78;
  --line:#d9e1e8; --red:#c0392b; --green:#1e8a5a; --amber:#d9902a; --blue:#2f6fb3;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;padding:14px 16px 12px;padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;z-index:5}
header .row{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.flag{width:34px;height:34px;flex:none;border-radius:6px;background:
  linear-gradient(90deg,transparent 40%,#fff 40% 60%,transparent 60%),
  linear-gradient(0deg,transparent 40%,#fff 40% 60%,transparent 60%),#c0392b}
header h1{font-size:17px;margin:0;letter-spacing:.2px}
header .sub{font-size:12.5px;opacity:.78}
.count{margin-left:auto;text-align:right;font-size:12px;opacity:.9}
.count b{display:block;font-size:20px;line-height:1}
main{max-width:760px;margin:0 auto;padding:14px 14px 96px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav .in{display:flex;max-width:760px;width:100%}
nav button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px;line-height:1.1}
nav button.on{color:var(--navy);font-weight:700}
nav button.on .i{transform:translateY(-1px)}
h2{font-size:20px;margin:6px 0 10px}
h3{font-size:16px;margin:16px 0 8px}
.muted{color:var(--mute);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;background:var(--navy);color:#fff;font-weight:600}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.red{background:var(--red)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.3px;border-radius:6px;padding:2px 7px;color:#fff}
/* plan */
.day{border-left:4px solid var(--navy);}
.day.today{border-left-color:var(--red);box-shadow:0 0 0 2px #c0392b22}
.day .dh{display:flex;justify-content:space-between;align-items:baseline}
.day .dh b{font-size:16px}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line)}
.task:first-of-type{border-top:0}
.chk{width:24px;height:24px;flex:none;border:2px solid var(--navy2);border-radius:7px;background:#fff;display:grid;place-items:center;font-size:15px;color:#fff;padding:0}
.chk.on{background:var(--green);border-color:var(--green)}
.task .go{margin-left:auto;border:0;background:var(--sea);border-radius:8px;padding:4px 9px;font-size:13px;color:var(--navy);white-space:nowrap}
.task.done span{color:var(--mute);text-decoration:line-through}
.bar{height:8px;background:var(--sea);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 .card{margin:0;padding:10px}
.stat3 b{font-size:22px;display:block}
/* topics */
.topic{padding:0;overflow:hidden}
.topic>button{width:100%;text-align:left;border:0;background:none;padding:12px 14px;display:flex;gap:10px;align-items:center}
.num{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.topic .tt{font-weight:600;font-size:15px;line-height:1.3}
.topic .mast{margin-left:auto;flex:none;font-size:12px;color:var(--mute);text-align:right;min-width:38px}
.topic .body{padding:0 14px 14px;display:none}
.topic.open .body{display:block}
.key{background:#fff7e6;border:1px solid #f1d9a6;border-radius:10px;padding:9px 11px;font-size:14.5px;margin:2px 0 10px}
.key:before{content:"Zapamätaj: ";font-weight:700;color:#a5650a}
.body ul{margin:0;padding-left:18px}
.body li{margin:5px 0;font-size:14.5px}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.symgrid div{border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:12.5px;color:var(--mute)}
.sym{width:100%;max-width:120px;height:auto;color:var(--ink);display:block;margin:0 auto 3px}
.search{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);font:inherit;margin-bottom:6px;background:#fff}
/* quiz */
.qhead{display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-bottom:6px}
.qtext{font-size:18px;font-weight:600;margin:6px 0 12px;line-height:1.35}
.qsym{max-width:180px;margin:0 auto 6px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;margin:8px 0;font-size:15.5px}
.opt.ok{border-color:var(--green);background:#e8f6ef}
.opt.bad{border-color:var(--red);background:#fbecea}
.opt.dim{opacity:.6}
.expl{font-size:14.5px;background:var(--sea);border-radius:10px;padding:10px 12px;margin-top:6px}
.link{border:0;background:none;color:var(--blue);text-decoration:underline;padding:0;font-size:14px}
.flash{min-height:190px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.flash .ans{font-size:18px;font-weight:700;color:var(--green);margin-top:12px}
.big{font-size:44px;font-weight:800;line-height:1}
/* comm */
.scen{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;margin:7px 0;font-size:15px}
.scen .ok{color:var(--green);font-weight:700}
.sit{background:var(--sea);border-radius:12px;padding:11px 13px;font-size:15px}
.slot{min-height:64px;border:2px dashed #b9c7d4;border-radius:12px;padding:6px;margin:10px 0;display:flex;flex-direction:column;gap:6px;background:#fff}
.slot:empty:before{content:"Ťukaj na bloky v správnom poradí…";color:#93a3b2;font-size:14px;padding:12px 6px}
.blk{border:0;border-radius:10px;padding:10px 12px;text-align:left;font-size:15px;font-weight:600;background:var(--navy);color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.2px}
.pool{display:flex;flex-wrap:wrap;gap:7px}
.pool .blk{background:#fff;color:var(--navy);border:1.5px solid var(--navy2)}
.slot .blk.ok{background:var(--green)}
.slot .blk.bad{background:var(--red)}
.slot .blk .n{opacity:.6;margin-right:7px;font-weight:400}
.note{border-left:4px solid var(--amber);background:#fff7e6;padding:10px 12px;border-radius:8px;font-size:14.5px;margin-top:10px}
.spellbig{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:34px;font-weight:800;letter-spacing:4px;text-align:center;color:var(--navy);margin:6px 0}
/* exam */
.res{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.rev{font-size:14px;border-top:1px solid var(--line);padding:9px 0}
.rev .y{color:var(--green)} .rev .n{color:var(--red)}
.drawn{display:flex;gap:10px;align-items:flex-start}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:.95}
@media (min-width:600px){ .qtext{font-size:19px} }
</style>
</head>
<body>
<header><div class="row">
  <div class="flag" aria-hidden="true"></div>
  <div><h1>VHF Rádiotelefonista</h1><div class="sub">Obmedzené osvedčenie · plavebná pohyblivá služba</div></div>
  <div class="count" id="count"></div>
</div></header>
<main id="main"></main>
<nav><div class="in">
  <button data-tab="plan"><span class="i">🗓️</span>Plán</button>
  <button data-tab="tahak"><span class="i">📘</span>Ťahák</button>
  <button data-tab="kviz"><span class="i">✅</span>Kvíz</button>
  <button data-tab="kom"><span class="i">📻</span>Komunikácia</button>
  <button data-tab="skuska"><span class="i">🎓</span>Skúška</button>
</div></nav>
<div class="toast" id="toast"></div>
<script>
// Ťaháky – 53 tém podľa zoznamu otázok. Zdroj: učebnica Rádiotelefonista (YACHTER, 2026) + prezentácie z kurzu.
const AREAS = {
  P: { name: 'Rádiokomunikačné predpisy', short: 'Predpisy', color: '#2f6fb3' },
  R: { name: 'Rádiokomunikačná prevádzka', short: 'Prevádzka', color: '#c0392b' },
  E: { name: 'Elektrotechnika a rádiotechnika', short: 'Elektro', color: '#1e8a5a' }
};

const TOPICS = [
// ===================== PREDPISY =====================
{ id:'P1', a:'P', n:1, t:'Identifikačný znak',
  k:'Bez volacej značky sa nevysiela. Hovorí sa na začiatku, na konci a každých 5 minút.',
  b:[
  'Žiadna stanica nesmie vysielať bez <b>identifikačného znaku</b> (u nás = <b>volacia značka, Call sign</b>).',
  'Volaciu značku prideľuje a eviduje <b>Regulačný úrad SR</b> (ÚREKPS, „teleoff“) podľa Rádiokomunikačného poriadku ITU.',
  'Vysiela sa <b>na začiatku a na konci spojenia a potom každých 5 minút</b> – aj pri skúšobnom vysielaní a nastavovaní vysielača.',
  'Značka je unikátna – nemôže byť pridelená dvom prevádzkovateľom. Nesmie sa dať zameniť s <b>MAYDAY, PAN PAN, SECURITE</b> ani s <b>Q-kódmi</b>.',
  'Identifikáciu nemusia uvádzať <b>stanice na záchranných plavidlách</b> s automatickým tiesňovým signálom (a zariadenia na určenie miesta katastrofy).',
  'Povinne ju uvádzajú stanice služby: amatérskej, rozhlasovej, pevnej, pohyblivej, frekvenčných a časových normálov.',
  'Značka môže obsahovať: názov stanice, umiestnenie, prevádzkovateľa, imatrikulačnú značku, číslo letu, selektívne volacie číslo…',
  'VHF sa prihlasuje v štáte, kde je <b>registrovaná loď</b> – VHF je viazaná na loď, nie na majiteľa. Úrad pridelí <b>volaciu značku a MMSI</b>.',
  'Volacie značky sa delia na <b>medzinárodné</b> a <b>vnútroštátne</b>.'
  ]},
{ id:'P2', a:'P', n:2, t:'Medzinárodné volacie značky, ich tvorba a použitie',
  k:'Slovensko = OM (OMA–OMZ). Loď = 4 písmená + max 2 číslice (OMME23).',
  b:[
  'Musia ich mať stanice s oprávnením na <b>medzinárodnú verejnú korešpondenciu</b> (komunikujú so zahraničím), všetky <b>amatérske</b> stanice a stanice, ktoré môžu rušiť mimo územia štátu.',
  'SR má sériu <b>OMA až OMZ</b> – prvé dve písmená sú vždy <b>OM</b>. (Susedia: ČR – OK, OL; Rakúsko – OE; Nemecko – DA–DR.)',
  '<b>Pozemné stanice:</b> 3 písmená + max. 3 číslice → OMC (pobrežná stanica), OMZ66 (pevná služba MZV). <i>Pomôcka 3+3</i>',
  '<b>Lodné stanice:</b> 4 písmená + max. 2 číslice → OMME (loď), OMME23 (vysielač v jej záchrannom člne). <i>4+2</i>',
  '<b>Lietadlové stanice:</b> 5 písmen → OMSYI, OMAAA. <i>5</i>',
  '<b>Amatérske stanice:</b> OM + 1 číslica (kraj/typ) + 1–3 písmená → OM1ABC, OM3KAA (klub). <i>2+1+3</i>',
  'Číslice <b>nezačínajú 0 ani 1</b> – zámena s písmenami O a I.',
  'Výnimka: stanice slúžiace národnej obrane.'
  ]},
{ id:'P3', a:'P', n:3, t:'Vnútroštátne volacie značky, ich tvorba a použitie',
  k:'3 písmená (kraj–okres–odvetvie) + max 3 číslice. Nesmú komunikovať so zahraničím.',
  b:[
  'Majú ich stanice <b>bez oprávnenia na medzinárodnú korešpondenciu</b> (nekomunikujú so zahraničím a nerušia mimo územia štátu).',
  'Týkajú sa iba staníc <b>pozemnej pohyblivej služby</b>; prideľuje a eviduje Regulačný úrad SR (predpis TPT-R2).',
  'Tvorba: <b>3 písmená + najviac 3 číslice</b>:',
  '1. písmeno = <b>kraj</b> (podľa sídla prevádzkovateľa), 2. = <b>okres</b> (viac okresov: <b>Q</b> alebo <b>R</b>), 3. = <b>odvetvie</b>, čísla = jednotlivé stanice.',
  'Príklady: <b>HAN100</b> – taxikári v Bratislave, <b>HRA100</b> – Group 4 v celej SR.',
  'Úrad môže vydať aj tzv. <b>zvláštne volacie značky</b> (urýchlia prevádzku). Staršie značky ostávajú platné.'
  ]},
{ id:'P4', a:'P', n:4, t:'Poplachový signál',
  k:'Dva tóny 1300 a 2200 Hz, striedanie 250 ms, 30–60 s. Privolá obsluhu – len obchodné (SOLAS) lode.',
  b:[
  '<b>Význam:</b> privolanie obsluhy k rádiostanici (rádiofónna pohotovosť).',
  '<b>Predpis:</b> dva tóny <b>1300 Hz a 2200 Hz</b>, striedajú sa s periódou <b>250 ms</b>, po dobu <b>30 až 60 sekúnd</b> (podľa SOLAS).',
  '<b>Vysiela sa pred tiesňovým volaním</b> na tiesňovej frekvencii. Stanice v dosahu automaticky zazvonia (mostík, rádiostanica, kajuta rádiodôstojníka).',
  'Týka sa <b>len obchodných lodí (SOLAS ships)</b>. Ostatní museli kedysi počúvať VHF v stanovených časoch (napr. každú polhodinu).',
  'Dnes ho nahrádzajú <b>digitálne rádiostanice (DSC)</b> – zvonia ako mobil, netreba „sedieť“ pri stanici. SOLAS lode prešli na digitálne stanice do roku <b>1999</b>.',
  'SOLAS = Safety of Life at Sea. Rekreačná námorná jachta (NON-SOLAS): dĺžka do 24 m, do 12 osôb.',
  'Kanál 16 sa počas plavby <b>monitoruje</b> – platí aj pre rekreačné lode (pred vyplávaním zapnúť VHF a naladiť 16).'
  ]},
{ id:'P5', a:'P', n:5, t:'Používanie falošných identifikačných znakov a signálov',
  k:'Iná značka než pridelená RÚ = falošná. Zneužitie MAYDAY/PAN PAN/SECURITE je trestné.',
  b:[
  'Stanica smie používať <b>len identifikačné kódy pridelené Regulačným úradom SR</b>. Každý iný je <b>falošný identifikačný kód</b>.',
  'Zakázané sú aj <b>falošné signály</b> – tiesňový, súrny, bezpečnostný – v situáciách, keď to Rádiokomunikačný poriadok nepripúšťa (napr. „na utíšenie prevádzky“).',
  'Zneužitie týchto signálov je <b>trestné</b>.'
  ]},
{ id:'P6', a:'P', n:6, t:'Právomoc veliteľa lode pri palubnej rádiostanici',
  k:'Najvyššia právomoc = veliteľ. Rozkaz v rozpore s RP operátor splní a zapíše do denníka.',
  b:[
  'Služba na pohyblivej stanici podlieha <b>najvyššej právomoci veliteľa</b> (osoby zodpovednej za dopravný prostriedok).',
  'Veliteľ zodpovedá za bezpečnosť plavby, posádky a nákladu; <b>vydáva príkaz</b> na vyslanie tiesňového, súrneho alebo bezpečnostného signálu.',
  'Podáva správy o zistených nebezpečenstvách plavby; zodpovedá za <b>dokumentáciu, technický stav</b> stanice a <b>staničný denník</b>; zabezpečuje <b>telekomunikačné tajomstvo</b>.',
  'Ak veliteľ vydá rozkaz v rozpore s RP, operátor ho <b>musí splniť a zapísať do staničného denníka</b>.',
  '<b>Právomoc operátora:</b> so súhlasom veliteľa môže zaučiť poverenú osobu – zápis do staničného denníka.'
  ]},
{ id:'P7', a:'P', n:7, t:'Rádiokomunikačné služby, ich druhy',
  k:'Pevná, pohyblivá (pozemná, námorná, letecká), rozhlasová, rádionavigačná, rádiolokačná, amatérska, družicová…',
  b:[
  '<b>Stanica</b> (podľa RP ITU) = jeden alebo viac vysielačov/prijímačov s príslušenstvom na zabezpečenie rádiokomunikačnej služby. Označuje sa podľa služby.',
  '<b>Pevná služba</b> – medzi pevnými stanicami.',
  '<b>Pohyblivá služba</b> – pozemná, <b>námorná (plavebná)</b>, letecká.',
  'Ďalšie: <b>rozhlasová, rádionavigačná, rádiolokačná, amatérska, družicová</b>, služba časových signálov, rádioastronomická…'
  ]},
{ id:'P8', a:'P', n:8, t:'Predmet úpravy zákona o elektronických komunikáciách (351/2011 → dnes 452/2021)',
  k:'Platí zákon 452/2021 Z.z. (od 1. 2. 2022), nahradil 351/2011. Upravuje siete, služby, rádiové zariadenia, reguláciu, spektrum.',
  b:[
  'V zozname je uvedený <b>zákon č. 351/2011 Z.z.</b>; od <b>1. 2. 2022</b> ho nahradil <b>zákon č. 452/2021 Z.z.</b> o elektronických komunikáciách (ešte starší bol 610/2003).',
  'Upravuje: podmienky poskytovania <b>elektronických komunikačných sietí a služieb</b>, ich ochranu, práva a povinnosti podnikov a užívateľov.',
  'Ďalej: podmienky <b>používania rádiových zariadení</b>, <b>štátnu reguláciu</b>, efektívne využívanie <b>frekvenčného spektra a čísel</b>, oprávnenia k cudzím nehnuteľnostiam, ochranu súkromia, pôsobnosť orgánov štátnej správy.',
  '<b>Účel:</b> vo verejnom záujme vytvoriť podmienky na rozvoj konkurencie v elektronických komunikáciách; preberá právne akty EÚ.',
  '<b>Elektronické komunikácie</b> = zriaďovanie, prevádzkovanie a poskytovanie zariadení, sietí a služieb elektronických komunikácií.'
  ]},
{ id:'P9', a:'P', n:9, t:'Pojem elektronické komunikácie a telekomunikačné zariadenie',
  k:'Komunikácie = činnosť (prenos). Zariadenie = prístroj (telefón, rádio, palubná rádiostanica…).',
  b:[
  '<b>Elektronické komunikácie</b> (činnosť) slúžia na vysielanie, prenos, smerovanie, príjem, prepojenie alebo spracovanie signálov a informácií (obraz, zvuk, dáta) – vedením, rádiovo, opticky alebo inými elektromagnetickými prostriedkami.',
  '<b>Telekomunikačné zariadenie</b> (prístroj) = technické zariadenie na tieto činnosti, vrátane pridružených prostriedkov.',
  'Príklady: telefón, telefax, televízor, rádio, rádiotelefón, rádiodiaľnopis, diaľkové ovládanie hračiek, R a TV vysielače, palubné rádiostanice.'
  ]},
{ id:'P10', a:'P', n:10, t:'Pojem rádiové vlny a rádiové zariadenie',
  k:'Rádiové vlny = elektromagnetické vlny 9 kHz – 3000 GHz, šíria sa voľným priestorom bez umelého vedenia.',
  b:[
  '<b>Rádiové vlny</b> sú elektromagnetické vlny s frekvenciou <b>od 9 kHz do 3000 GHz</b>, ktoré sa šíria vo voľnom priestore <b>bez umelého vedenia</b>.',
  '<b>Rádiové zariadenie</b> = telekomunikačné zariadenie (alebo jeho časť), ktoré komunikuje vysielaním a/alebo príjmom rádiových vĺn v spektre pridelenom pozemským alebo kozmickým rádiokomunikáciám.',
  'Príklady: televízor, rádio, rádiotelefón, diaľkové ovládanie hračiek, vysielače, palubné rádiostanice.'
  ]},
{ id:'P11', a:'P', n:11, t:'Elektronické komunikačné siete a ich delenie',
  k:'Podľa koncových bodov: pevné / mobilné. Podľa okruhu užívateľov: verejné / neverejné.',
  b:[
  '<b>Elektronická komunikačná sieť</b> = funkčne prepojená sústava prenosových systémov (a prepájacích zariadení) na prenos signálu vedením, rádiovo, opticky… – vrátane družicových, internetu, mobilných sietí, rozvodov R/TV a káblových systémov.',
  'Delenie <b>podľa koncových bodov</b>: <b>pevné</b> (napr. Slovak Telekom) a <b>mobilné</b> (Telekom, Orange, O2).',
  'Delenie <b>podľa okruhu užívateľov</b>: <b>verejné</b> (Orange, TV vysielače) a <b>neverejné</b> (uzavretá skupina, napr. osobitná sieť pre obranu a bezpečnosť).'
  ]},
{ id:'P12', a:'P', n:12, t:'Verejná sieť',
  k:'Verejná = služby pre verejnosť (aj R/TV vysielanie). Neverejná = len pre uzavretú skupinu.',
  b:[
  '<b>Verejná telekomunikačná sieť</b> sa používa úplne alebo čiastočne na poskytovanie telekomunikačných služieb verejnosti – najmä verejná telefónna sieť a sieť na prenos dát.',
  'Jej súčasťou sú aj zariadenia na šírenie <b>rozhlasových a televíznych</b> programov.',
  '<b>Neverejná sieť</b> slúži výlučne pre vlastné potreby <b>uzavretej skupiny</b> užívateľov.'
  ]},
{ id:'P13', a:'P', n:13, t:'Zriaďovanie a prevádzkovanie osobitných komunikačných sietí',
  k:'Osobitné siete = obrana a bezpečnosť štátu. Smú ich mať MO SR, MV SR a SIS.',
  b:[
  '<b>Osobitná sieť</b> = neverejná sieť pre určený okruh užívateľov na osobitné účely – najmä <b>obrana a bezpečnosť štátu</b>.',
  'Zriaďovať a prevádzkovať ich smie <b>Ministerstvo obrany SR, Ministerstvo vnútra SR a Slovenská informačná služba (SIS)</b>.',
  'Nesmú poskytovať verejné služby ani to umožniť tretím osobám.',
  'Pripojenie na verejnú sieť len tam, kde je to účelné v <b>dôležitom záujme štátu</b>; prevádzkovateľ verejnej siete musí žiadosti vyhovieť, ak je to technicky možné.'
  ]},
{ id:'P14', a:'P', n:14, t:'Vysielacia rádiová stanica',
  k:'3 podmienky: vyžaruje EM vlny + prenáša správy + frekvencia nad 9 kHz.',
  b:[
  'Telekomunikačné zariadenie na prenos správ (slovo, obraz, signály), ktoré musí spĺňať <b>tri podmienky</b>:',
  '1) pracuje na princípe <b>vyžarovania elektromagnetických vĺn</b>, 2) <b>uskutočňuje prenos správ</b>, 3) vysiela na frekvencii <b>vyššej ako 9 kHz</b>.',
  'Ak jedna podmienka chýba, nejde o vysielaciu rádiostanicu.',
  '<b>Časti:</b> vlastná rádiostanica (vysielač + prijímač), napájací zdroj, anténa, príslušenstvo (mikrofón, reproduktor, DTMF klávesnica…).'
  ]},
{ id:'P15', a:'P', n:15, t:'Pôsobnosť orgánov štátnej správy v oblasti elektronických komunikácií',
  k:'Ministerstvo dopravy = politika a návrh tabuľky spektra. Regulačný úrad = regulácia, správa spektra, dohľad, pokuty.',
  b:[
  '<b>Ministerstvo dopravy SR:</b> národná politika pre elektronické komunikácie, <b>návrh národnej tabuľky frekvenčného spektra</b>, medzinárodné vzťahy.',
  '<b>Úrad pre reguláciu elektronických komunikácií a poštových služieb (RÚ):</b> vykonáva <b>reguláciu</b>, <b>správu frekvenčného spektra</b>, vydáva všeobecne záväzné predpisy, vykonáva <b>dohľad a ukladá sankcie</b>, spolupracuje s Radou pre vysielanie a retransmisiu.',
  '<b>Medzinárodne:</b> <b>ITU</b> (založená 17. 5. 1865 v Paríži; konferencie WRC každé 2–3 roky; vydáva Rádiokomunikačný poriadok), <b>CEPT</b> (1959, SR členom od 1993), <b>IMO</b> (námorná organizácia OSN), <b>RAINWAT</b> (rádiotelefónia na vnútrozemských vodných cestách).'
  ]},
{ id:'P16', a:'P', n:16, t:'Doklady rádiovej stanice plavebnej pohyblivej služby',
  k:'Povolenie lodnej stanice (Ship Station Licence) + osvedčenie operátora + staničný denník.',
  b:[
  '<b>Povolenie na prevádzkovanie lodnej rádiostanice – Ship Station Licence</b> – vydá štát, v ktorom je loď <b>registrovaná</b>. Uvádza všetky povolené rádiové zariadenia na palube (hlavný a núdzový vysielač, ručné stanice, radar…).',
  '<b>Osvedčenie o odbornej spôsobilosti</b> operátora (Operator’s Certificate).',
  '<b>Staničný denník (Radio log)</b> – rádiová korešpondencia, začiatok a koniec služby, údržba zariadení vrátane akumulátorov. <b>Zápisy o nebezpečenstve v plnom znení.</b>',
  'Na rekreačných plavidlách môže staničný denník nahradiť <b>palubný denník (logbook)</b>.',
  'Pri kontrole musia byť k dispozícii aj ďalšie pomôcky predpísané RP.'
  ]},
{ id:'P17', a:'P', n:17, t:'Povoľovanie prevádzkovania rádiového zariadenia, pridelenie frekvencií a identifikačných znakov',
  k:'Druhy povolení: individuálne, osobitné, amatérske. Ostatné zariadenia = všeobecné povolenie. Vydáva RÚ.',
  b:[
  'Zariadenie, ktoré potrebuje <b>pridelenie frekvencie</b> alebo obmedzujúce podmienky, sa prevádzkuje len na základe <b>povolenia</b>; ostatné na základe <b>všeobecného povolenia</b>.',
  'Povoľovacie konanie vedie <b>Regulačný úrad SR</b>; žiadosť na predpísanom tlačive.',
  'Druhy povolení: <b>individuálne, osobitné, amatérske</b>.',
  'Povolenie obsahuje: údaje o držiteľovi, druh zariadenia a technické parametre, druh prevádzky, <b>pridelenú frekvenciu a volaciu značku</b> (platnosť, podmienky), triedu pre amatérov, doklad o úhrade.',
  '<b>Povolenie zaniká:</b> uplynutím lehoty; smrťou/zánikom držiteľa; zrušením povolenia; vrátením alebo vzdaním sa; zánikom licencie, od ktorej záviselo.'
  ]},
{ id:'P18', a:'P', n:18, t:'Telekomunikačné tajomstvo',
  k:'Čo počuješ, nešír. Sprístupniť len dotknutej osobe a oprávneným štátnym orgánom.',
  b:[
  '<b>Predmet:</b> obsah prenášaných informácií a dát, mená a adresy komunikujúcich strán, prevádzkové doklady.',
  'Zachovávať ho musí <b>každý</b>, kto s ním príde do styku (operátor aj užívateľ).',
  'Sprístupniť ho možno <b>len osobe, ktorej sa týka</b>, a <b>štátnym orgánom</b> (bezpečnosť štátu, trestné činy, neoprávnené používanie zariadení).',
  'Zakázané je nahrávanie, odpočúvanie a ukladanie cudzej komunikácie (okrem zmluvne dohodnutého a zákonných oprávnení).',
  'Výnimka: informácie o pôvodcovi <b>výhražného, obťažujúceho alebo zlomyseľného volania</b> a <b>poplašnej správy</b>.',
  'V praxi: nepočúvaj správy, ktoré nie sú pre teba, a nerozširuj ich (ani na sociálne siete).'
  ]},
{ id:'P19', a:'P', n:19, t:'Ochrana proti rušeniu',
  k:'Rušenie = vyžarovanie, ktoré zhoršuje signál v pásme prijímača. Typy: vzájomné, priemyslové, škodlivé. Hlási sa RÚ.',
  b:[
  '<b>Rušenie</b> = každé vyžarovanie EM vĺn, ktoré zhoršuje kvalitu požadovaného signálu, ak je pásmo rušenia <b>zhodné s pásmom prijímača</b>.',
  '<b>Typy:</b> vzájomné, priemyslové, škodlivé. Vzájomné rušenie sa <b>hlási RÚ SR</b>, ktorý ho preverí a môže nariadiť odrušenie.',
  'Zariadenia sa prevádzkujú tak, aby rušenie <b>neprijateľne nezhoršovalo, opakovane neprerušovalo</b> ani neohrozovalo inú prevádzku.',
  'Zariadenia musia mať obmedzené vlastné rušenie a primeranú odolnosť; zabezpečuje výrobca/predajca pred uvedením na trh.',
  'Vybrané telekomunikačné zariadenia (aj <b>rádiové zariadenia a antény</b>) sa smú prevádzkovať len po <b>schválení technickej spôsobilosti</b> – okrem amatérskych.',
  'Schvaľovaniu nepodliehajú zariadenia obrany, vojenského spravodajstva, SIS, polície a civilného letectva.',
  'Na lodi je zakázané: rozprávať o veciach mimo plavby, púšťať hudbu, používať kanál 16 na iné účely než tieseň/bezpečnosť/nadviazanie spojenia.'
  ]},
{ id:'P20', a:'P', n:20, t:'Nedovolené prevádzkovanie rádiového zariadenia, správne delikty',
  k:'Je to správny delikt. Pokuta: fyzická osoba 100 – 10 000 €, podnikateľ 200 € – 5 % obratu.',
  b:[
  'Nedovolené prevádzkovanie rádiového zariadenia je <b>správny delikt</b> – pokutu ukladá Regulačný úrad.',
  'Pokuta napr. za: prevádzku <b>bez povolenia</b> alebo v rozpore s ním; zariadenie prekračujúce rušenie; prevádzku bez posúdenia zhody; <b>obsluhu bez osobitnej odbornej spôsobilosti</b>; nezaplatenie úhrady za frekvenciu.',
  'Úrad prihliada na <b>povahu, závažnosť, spôsob, trvanie a následky</b> porušenia.',
  'Výška: <b>fyzická osoba 100 € až 10 000 €</b>; <b>podnikateľ 200 € až 5 % obratu</b>. Pri opakovaní možno pokutu uložiť opakovane.'
  ]},
{ id:'P21', a:'P', n:21, t:'Osobitná odborná spôsobilosť',
  k:'Overuje RÚ skúškou a osvedčením. V tiesni smie vysielať ktokoľvek – ale len tiesňovú prevádzku.',
  b:[
  'Na obsluhu <b>vybraných rádiových zariadení</b> (letecké, lietadlové, pobrežné, <b>lodné</b>, pozemné, amatérske stanice) treba osobitnú odbornú spôsobilosť.',
  'Overuje ju <b>Regulačný úrad SR skúškou a vydaním osvedčenia</b> (neplatí pre MO, MV a SIS).',
  'So <b>súhlasom veliteľa</b> môže stanicu obsluhovať aj <b>poverená osoba</b>, ktorú kvalifikovaný operátor preukázateľne poučil – <b>zápis do staničného denníka</b>.',
  '<b>V tiesni</b> môže stanicu obsluhovať <b>ktokoľvek</b>, ale len na <b>tiesňovú prevádzku</b>.',
  'Druhy osvedčení: letecké (všeobecné, obmedzené I a II), plavebné GOC, ROC, všeobecné a <b>obmedzené osvedčenie rádiotelefonistu plavebnej pohyblivej služby</b>, vnútrozemské vodné cesty, rádiotelegrafista, amatéri.'
  ]},
{ id:'P22', a:'P', n:22, t:'Obmedzené osvedčenie rádiotelefonistu plavebnej pohyblivej služby',
  k:'Do 200 námorných míľ od pobrežia (alebo pobrežná plavba), len jednoduché vonkajšie ovládacie prvky.',
  b:[
  'Oprávňuje obsluhovať rádiotelefónnu službu na lodnej stanici, ktorá pláva <b>do 200 námorných míľ od pobrežia</b> alebo zabezpečuje <b>pobrežnú plavbu</b>,',
  '…ak ovládanie vysielača spočíva len v <b>jednoduchých vonkajších ovládacích prvkoch</b> (klávesnica, prepínač).',
  'Stratu alebo poškodenie musí držiteľ <b>oznámiť RÚ SR</b> a požiadať o <b>duplikát</b>.'
  ]},
{ id:'P23', a:'P', n:23, t:'Kontrola rádiových staníc plavebnej pohyblivej služby cudzími orgánmi',
  k:'Cudzí kontrolór smie kontrolovať technický stav podľa povolenia, NIE odbornú spôsobilosť operátora.',
  b:[
  'Na princípe <b>reciprocity</b>: cudzie lode u nás a naše lode v zahraničí prevádzkujú stanice na základe povolenia svojho štátu.',
  'Zahraničné orgány smú kontrolovať <b>technický stav stanice podľa povolenia</b> – výkon, frekvencie, druh prevádzky, prevádzkový (staničný) denník.',
  '<b>Nesmú overovať odbornú spôsobilosť</b> operátorov – to smie iba RÚ SR (pre tých, čo skladali skúšku v SR).'
  ]},

// ===================== PREVÁDZKA =====================
{ id:'R1', a:'R', n:1, t:'Prednostné poradie správ v plavebnej pohyblivej službe',
  k:'MAYDAY (tieseň) > PAN PAN (súrnosť) > SECURITE (bezpečnosť) > bežné volanie.',
  b:[
  '<b>1. MAYDAY</b> – tiesňové volanie, správy a korešpondencia (Distress).',
  '<b>2. PAN PAN</b> – súrne správy (Urgency).',
  '<b>3. SECURITE</b> – bezpečnostné správy (Safety); ďalej správy o rádiovom zariadení, navigácii a bezpečnom pohybe lode, meteorologické správy, štátne a služobné správy.',
  '<b>Posledné (bez signálu):</b> bežné volanie loď–loď (Routine) a kontrola rádiostanice.',
  'Prebiehajúcu komunikáciu smiem prerušiť len správou s <b>vyššou prioritou</b>.'
  ]},
{ id:'R2', a:'R', n:2, t:'Účel rádiového zariadenia v pohyblivej službe',
  k:'Prvotný účel = bezpečnosť a záchrana života. Ďalej navigácia, efektívne využitie lodí, vzájomná komunikácia.',
  b:[
  'Výmena informácií <b>loď–loď</b> a <b>loď–pobrežná stanica</b>; pohyblivá služba sa delí na pozemnú, lodnú (námornú) a leteckú.',
  'Prvotný účel: <b>zaistenie bezpečnosti a záchrany života</b>.',
  'Ďalej: orientácia počas plavby (navigácia), efektívnejšie využívanie plavidiel, vzájomná komunikácia.',
  'Rádio je <b>spoločné</b> – na kanáli počujú všetci, vysielať môže naraz len jedna stanica (na rozdiel od mobilu).',
  'Preto <b>štandardné výrazy</b> s jednoznačným významom – neštandardné frázy spôsobovali nehody.',
  'Motto: <i>VHF mobilom nenahradíš.</i>'
  ]},
{ id:'R3', a:'R', n:3, t:'Technika vysielania',
  k:'Jasná reč, správna výslovnosť, cca 100 slov za minútu, stručne, slušne, bez tajných kódov.',
  b:[
  '<b>Jasná reč</b> – všeobecne zrozumiteľné slová bez skrytého významu; zakázané vopred dohodnuté kódy.',
  '<b>Správna výslovnosť</b>, <b>rovnomerná rýchlosť</b> (cca <b>100 slov za minútu</b>), rovnaká hlasitosť.',
  'Žiadne hrubé a vulgárne výrazy; hovoriť <b>stručne</b>, bez zbytočného opakovania.',
  'Pozor na <b>tlačidlo PTT</b> (prepínanie mikrotelefónu) – najprv stlač, potom hovor; po pustení počúvaš.',
  'Simplexná prevádzka: <b>OVER</b> = končím, púšťam tlačidlo a počúvam. <b>OUT</b> = koniec spojenia.'
  ]},
{ id:'R4', a:'R', n:4, t:'Volacie a pracovné frekvencie, spôsob volania',
  k:'Volá sa na kanáli 16 (156,8 MHz), hovorí sa na pracovnom: 6, 8, 9, 10, 67, 69, 72, 73, 77.',
  b:[
  'Spojenie sa nadväzuje na <b>volacej frekvencii 156,8 MHz = kanál 16</b>, ktorá je zároveň <b>tiesňová</b>. Na nej sa nič neoznamuje.',
  'Po nadviazaní sa prejde na <b>pracovný kanál</b> (loď–loď): <b>6, 8, 9, 10, 67, 69, 72, 73, 77</b>. Po skončení späť na 16 (alebo DW – sledovanie dvoch kanálov).',
  '<b>Typ A</b>: volám na 16 → „GO TO CHANNEL 8“ → na pracovnom znovu nadviažem spojenie → odovzdám info.',
  '<b>Typ B</b>: hneď na pracovnom kanáli (dohodnutý, z Pilot book). V praxi lepšie.',
  'Pri <b>MAYDAY a PAN PAN</b> vždy kanál 16 a ostávam na ňom; pri <b>SECURITE</b> ohlásim na 16 pracovný kanál a prejdem naň (krátku správu môžem povedať na 16).',
  'Pobrežná stanica (úrad) preberá <b>riadiacu úlohu</b> a určí pracovný kanál.',
  'Ďalšie kanály: <b>70</b> – len DSC (digitálne volanie), <b>13</b> – bridge-to-bridge, navigačná bezpečnosť; 67 Baleáry a 68 Taliansko – počasie.',
  'Kanály 1–28 pôvodné, doplnkový rad 60–88 vložený medzi (1, 61, 2, 62…).'
  ]},
{ id:'R5', a:'R', n:5, t:'Predbežné operácie pred začiatkom vysielania',
  k:'Skontroluj zdroj, anténu, mikrofón → zapni → nalaď kanál → hlasitosť a squelch → počúvaj, či je voľno.',
  b:[
  'Kontrola pripojenia <b>zdroja, antény a mikrofónu</b>.',
  '<b>Zapnutie</b> a kontrola funkčnosti.',
  'Nastavenie frekvencie (spravidla <b>volacej</b> – kanál 16).',
  'Nastavenie <b>hlasitosti a tlmenia šumu (squelch)</b>, podsvietenia.',
  'Pred vysielaním sa presvedčiť, že na kanáli <b>neprebieha iná komunikácia</b>. Prerušiť ju môžem len správou s vyššou prioritou.',
  'Ak ruším cudziu komunikáciu, musím <b>prestať vysielať na prvú žiadosť</b> rušenej stanice.'
  ]},
{ id:'R6', a:'R', n:6, t:'Volanie a odpoveď na volanie',
  k:'O-K-O: Oslov (3×) – Kto si: THIS IS + meno (3×) – OVER. Odpoveď stačí 1×.',
  b:[
  '<b>Pomôcka O-K-O (oko):</b> <b>O</b> – oslov, koho voláš; <b>K</b> – kto si (THIS IS + meno lode, call sign, MMSI); <b>O</b> – o čom / OVER.',
  '<b>Volanie:</b> meno volanej stanice <b>3×</b>, THIS IS, meno mojej lode <b>3×</b>, OVER. (3× preto, aby obsluha stihla prísť k VHF.)',
  '<b>Odpoveď:</b> stačí <b>1×</b> – volajúci už pri stanici sedí. Napr. „Blue Moon, this is yacht Sirius, over.“',
  'Ak stanica <b>nevie, či volanie patrilo jej</b>, neodpovedá, kým sa volanie nezopakuje.',
  'Ak vie, že volanie patrí jej, ale <b>nie je istá volacou značkou</b> volajúceho, odpovie ihneď a použije služobné skratky (napr. „WHO IS CALLING ME?“).',
  'Ak volaná stanica nereaguje: volanie max <b>3× s 2-minútovými prestávkami</b>, ďalší pokus až po <b>15 minútach</b>.',
  'Pri súkromnom volaní loď–loď sa call sign zvyčajne nepoužíva; pri oficiálnom (SECURITE, loď–pobrežie) áno. Na úrady pri bezpečnostných a núdzových volaniach používam <b>MMSI</b>.',
  'Na pracovnom kanáli, ak sme sami, môžem vynechať oslovenie – <b>na 16 vždy oslovujem</b>. OVER musí zostať.',
  'Ukončenie: celé O-K-O a namiesto OVER → <b>OUT</b>. Druhá loď už neodpovedá.',
  'Pobrežnú stanicu oslovujem „najprv zemepis, potom úrad“: <b>SPLIT RADIO</b>, Rijeka COAST GUARD, …'
  ]},
{ id:'R7', a:'R', n:7, t:'Postup pri vysielaní na skúšku',
  k:'Volaná stanica + moja stanica + RADIO CHECK. Odpoveď = čitateľnosť 1 (nečitateľné) až 5 (výborné).',
  b:[
  '<b>Skúšobné vysielanie obsahuje:</b> volaciu značku volanej stanice (ktorá skontroluje signál), moju volaciu značku a frázu <b>SKÚŠKA RÁDIA – RADIO CHECK</b>.',
  '<b>Odpoveď obsahuje:</b> značku mojej stanice, značku kontrolujúcej stanice a <b>čitateľnosť číslom 1–5</b> (1 = nečitateľné, 5 = dokonale čitateľné) – alebo slovami („silne, ale prerušovane“).',
  'Signály na vyladenie vysielača/prijímača: <b>max. 10 sekúnd</b>, rad vyslovovaných číslic + volacia značka.',
  'Kontrola rádiostanice sa robí na <b>pracovnom kanáli</b> (napr. s marínou), má najnižšiu prioritu.'
  ]},
{ id:'R8', a:'R', n:8, t:'Vyslovovanie čísel a času v rádiotelefónii',
  k:'Číslice po jednej (desiatky nikdy celé!). Čas 4-miestne v UTC: 1712 = one seven one two.',
  b:[
  'Oddelene sa vysielajú <b>číslice 0–9</b>. <b>Celé desiatky sa nesmú vysielať</b> (nie „twenty“, ale „two zero“).',
  'Smú sa vysielať <b>celé stovky a tisícky</b> (one hundred, five hundred).',
  '<b>Čas</b> = 4-miestne číslo hodiny+minúty, štandardne v <b>UTC</b>. V strese je praktické použiť lokálny čas (LT) – nie celkom správne, ale bez chyby v prepočte. Piloti hovoria len minúty.',
  '0 <b>zero</b> (zírou), 1 <b>one</b> (uan), 2 <b>two</b> (tú), 3 <b>three</b> (trí), 4 <b>four</b> (fouer), 5 <b>five</b> (fajf), 6 <b>six</b>, 7 <b>seven</b>, 8 <b>eight</b> (ejt), 9 <b>nine</b> (najn).',
  'Čiarka = <b>DECIMAL</b>, bodka = STOP, pomlčka = DASH, lomka = FRACTION BAR.',
  'Príklad: 156,8 MHz = „one five six DECIMAL eight“. Číslice sa vyslovujú spravidla po dvojiciach alebo trojiciach.'
  ]},
{ id:'R9', a:'R', n:9, t:'Hláskovacia tabuľka (slovenská, medzinárodná)',
  k:'Alfa, Bravo, Charlie, Delta, Echo, Foxtrot, Golf, Hotel, India, Juliett, Kilo, Lima, Mike, November, Oscar, Papa, Quebec, Romeo, Sierra, Tango, Uniform, Victor, Whiskey, X-ray, Yankee, Zulu.',
  b:[
  'Je súčasťou štandardných výrazov – <b>nesmie sa zamieňať</b> za vlastné slová.',
  '<b>Medzinárodná:</b> A Alfa · B Bravo · C Charlie · D Delta · E Echo · F Foxtrot · G Golf · H Hotel · I India · J Juliett · K Kilo · L Lima · M Mike · N November · O Oscar · P Papa · Q Quebec · R Romeo · S Sierra · T Tango · U Uniform · V Victor · W Whiskey · X X-ray · Y Yankee · Z Zulu.',
  'Volacia značka sa vždy <b>hláskuje</b>: OMMA11 = <b>Oscar Mike Mike Alfa one one</b>.',
  '<b>Slovenská</b> (učebnica ju neuvádza, bežne používaná): A Adam · B Božena · C Cyril · D Dávid · E Emil · F František · G Gustáv · H Helena · CH Chrudim · I Ivan · J Jozef · K Karol · L Ľudovít · M Mária · N Norbert · O Oto · P Peter · Q Quido · R Rudolf · S Svätopluk · T Tomáš · U Urban · V Viktor · W dvojité V · X Xaver · Y Ypsilon · Z Zuzana.',
  'Precvič v sekcii <b>Komunikácia → Hláskovanie</b>.'
  ]},
{ id:'R10', a:'R', n:10, t:'Štandardné slová a frázy',
  k:'OVER = príjem/prepínam, OUT = koniec, SAY AGAIN = opakujte, ROGER = rozumiem, STAND BY = čakajte.',
  b:[
  '<b>HOW DO YOU READ ME?</b> – ako ma počujete · <b>GO TO CHANNEL…</b> – prejdite na kanál · <b>OVER</b> – príjem (prepínam) · <b>THIS IS</b> – tu je · <b>CALL SIGN</b> – volacia značka.',
  '<b>GO AHEAD</b> – vysielajte · <b>SAY AGAIN</b> – opakujte · <b>ALL AFTER / ALL BEFORE / ALL BETWEEN</b> – všetko za / pred / medzi.',
  '<b>I SAY AGAIN / I REPEAT</b> – opakujem · <b>READ BACK</b> – zopakujte celú správu · <b>STAND BY</b> alebo <b>WAIT … MINUTES</b> – čakajte.',
  '<b>YES / AFFIRMATIVE</b> – áno · <b>NO / NEGATIVE</b> – nie · <b>WHO IS CALLING ME?</b> – kto ma volá · <b>CONFIRM</b> – potvrďte · <b>WORD TWICE</b> – slovo 2× · <b>ROGER (ROMEO)</b> – rozumiem.',
  '<b>YOUR NUMBER … RECEIVED</b> – potvrdzujem vašu správu · <b>SPEAK SLOWLY</b> – hovorte pomaly · <b>ARE YOU READY?</b> · <b>SILENCE MAYDAY</b> – ticho, tieseň · <b>ALL SHIPS</b> – všetkým lodiam · <b>OUT</b> – koniec.',
  '<b>MAYDAY, MAYDAY RELAY, PAN PAN, SECURITE, MOB</b> (man over board).',
  'Havária: ENGINE FAILURE, MAST LOST, RUDDER LOST, FIRE ON THE SHIP, THE SHIP IS SINKING, THE CREW IN LIFE BOAT.',
  'Lekárska: WE REQUEST THE DOCTOR, … FAST MEDICAL ASSISTANCE, SEVERE ACCIDENT, MASSIVE BURNS.',
  'Bezpečnostná: WARNING ALL SHIPS, A RISK FOR SAILING, INDETERMINED FLOATING OBJECT, A LOOSE FLOATING BUOY.'
  ]},
{ id:'R11', a:'R', n:11, t:'Oprava a opakovanie správ',
  k:'Chyba → CORRECTION + posledná správna skupina + správny text. SAY AGAIN žiada prijímač, REPEAT/READ BACK vysielač.',
  b:[
  'Pri chybe vysielam <b>OPRAVA – CORRECTION</b>, zopakujem <b>poslednú správne vyslanú skupinu</b> a potom správne znenie.',
  'Ak prijímač pochybuje o texte, žiada <b>OPAKUJTE – SAY AGAIN</b>; dá sa spresniť: <b>ALL BEFORE / ALL AFTER / ALL BETWEEN</b>.',
  '<b>SAY AGAIN</b> – vysiela <b>prijímacia</b> stanica: nerozumel som.',
  '<b>REPEAT</b> – vysiela <b>vysielacia</b> stanica: opakujem, zdôrazňujem detail.',
  '<b>READ BACK</b> – vysiela <b>vysielacia</b> stanica: zopakuj celú správu (overenie príjmu).',
  'V letectve sa vždy opakuje celá správa.'
  ]},
{ id:'R12', a:'R', n:12, t:'Overovanie správ a potvrdzovanie správ',
  k:'READ BACK = prijímač musí zopakovať celú správu. CONFIRM = potvrď príjem.',
  b:[
  'Bezchybný príjem overím slovom <b>READ BACK</b> – prijímacia stanica je <b>povinná zopakovať celý text</b>.',
  'Ak treba overiť len <b>čísla</b>, vysielacia stanica požiada o zopakovanie <b>každého čísla</b>.',
  'Potvrdenie príjmu si vyžiadam slovom <b>CONFIRM</b> (potvrďte).',
  'Viac správ za sebou sa potvrdzuje <b>jednotlivo alebo hromadne</b> („potvrdzujem všetky správy“) – zvyčajne s uvedením počtu.',
  'Zmenu kanála potvrdzujem najlepšie <b>zopakovaním čísla kanála</b> (ROGER/ROMEO je slabšie).'
  ]},
{ id:'R13', a:'R', n:13, t:'Medzinárodné tiesňové a volacie frekvencie',
  k:'156,8 MHz (kanál 16) – hlas. 156,525 MHz (kanál 70) – DSC. 2182 kHz MF. Letecká 121,5 MHz.',
  b:[
  '<b>156,800 MHz – VHF kanál 16</b>: tiesňová, súrna, bezpečnostná a <b>volacia</b> frekvencia (hlas). Platí na celom svete.',
  '<b>156,525 MHz – kanál 70</b>: digitálne tiesňové volanie <b>DSC</b> (bez hlasu).',
  '<b>2182 kHz</b> – MF rádiotelefónna tiesňová; <b>2187,5 kHz</b> – MF DSC; v pásme HF (3–30 MHz) je niekoľko DSC frekvencií pre GMDSS (napr. 8 MHz pásmo).',
  '<b>500 kHz</b> – historická rádiotelegrafná tiesňová (SOS). <b>121,5 MHz</b> – letecká tiesňová.',
  '<b>NAVTEX 518 kHz</b> (a 490 kHz) – navigačné a bezpečnostné info, počasie.',
  '<b>EPIRB 406 MHz</b> (COSPAS-SARSAT, aj letecké ELT); <b>AIS</b> 161,975 a 162,025 MHz; <b>SART</b> 9 GHz; GPS 1,5 GHz.',
  'Námorné pásmo VHF: <b>156–162 MHz</b>. Na mori je tiesňová frekvencia zároveň volacia – preto „tiesňová a volacia“.',
  'GMDSS = celosvetový námorný tiesňový a bezpečnostný systém; more je rozdelené na oblasti A1–A4.'
  ]},
{ id:'R14', a:'R', n:14, t:'Tiesňový signál, tiesňové volanie, tiesňová správa',
  k:'Signál = MAYDAY. Volanie = MAYDAY 3×, THIS IS, meno 3×, call sign, MMSI. Správa = M-I-P-D-A-N-I-O.',
  b:[
  '<b>Signál</b> je slovo <b>MAYDAY</b> („mejdej“): loď je v <b>vážnom a bezprostrednom nebezpečenstve</b> a žiada <b>okamžitú pomoc</b>. Zneužitie je trestné.',
  '<b>Tiesňové volanie:</b> MAYDAY <b>3×</b> · THIS IS · meno lode <b>3×</b> · CALL SIGN <b>1×</b> (hláskovane) · MMSI <b>1×</b>. <b>Nikoho neoslovuje</b> (nie je adresované konkrétnej stanici).',
  'Má <b>absolútnu prednosť</b>. Kto ho počuje, musí <b>prestať vysielať a počúvať</b>. Nepotvrdzuje sa, kým nezaznie tiesňová správa.',
  'Po volaní <b>pauza</b> – ostatní si pripravia denník, pero, nahrávanie.',
  '<b>Tiesňová správa – M-I-P-D-A-N-I-O:</b>',
  '<b>M</b> – MAYDAY (1×) · <b>I</b> – Identification: THIS IS, meno, call sign, MMSI · <b>P</b> – Position at time: orientačný bod, smer a vzdialenosť od neho + čas (UTC, v strese LT) · <b>D</b> – Distress: čo sa stalo, jedným slovom (SINKING, FIRE) · <b>A</b> – Assistance: aká pomoc (IMMEDIATE ASSISTANCE) · <b>N</b> – Number: počet osôb vrátane detí · <b>I</b> – Information: modrý trup, opúšťame loď… · <b>O</b> – OVER.',
  'Polohu radšej <b>od orientačného bodu</b> (maják Sestrica, SW, 5 Nm) než súradnicami – menej chýb.',
  'Všetko na <b>156,8 MHz</b> v <b>otvorenej reči</b>. V tiesni možno použiť akýkoľvek prostriedok a frekvenciu.'
  ]},
{ id:'R15', a:'R', n:15, t:'Tiesňová korešpondencia, ukončenie tiesňovej korešpondencie',
  k:'Cudzie MAYDAY: čakaj ~5 min → potvrď (RECEIVED MAYDAY, ETA) alebo prepošli (MAYDAY RELAY). Zrušenie: CANCEL MY DISTRESS ALERT. Koniec ticha: SEELONCE FEENEE.',
  b:[
  '<b>Počujem cudzie MAYDAY:</b> 1) čakám pár minút (cca 5), počúvam a nechávam priestor <b>pobrežnej stanici</b>; 2) ak sa nehlási, preberám iniciatívu – <b>potvrdím</b> (plávam na pomoc) alebo <b>prepošlem</b>.',
  '<b>Potvrdenie:</b> MAYDAY 1× · meno lode v tiesni 3× · THIS IS · moja loď 3× · call sign · MMSI · <b>RECEIVED MAYDAY</b> · <b>ETA IS 1 HOUR</b> (za aký čas, nie o koľkej!) · OUT.',
  '<b>Preposlanie:</b> <b>MAYDAY RELAY 3×</b> · <b>ALL STATIONS 3×</b> · THIS IS · moja loď 3× · môj call sign · MMSI → potom správa lode v tiesni: MAYDAY · jej meno, call sign, MMSI · poloha · čo sa stalo · pomoc · počet osôb · OVER.',
  '<b>Rádiový pokoj:</b> rušiacim staniciam: MAYDAY · ALL STATIONS 3× · THIS IS … · <b>SEELONCE MAYDAY</b> (ticho, prebieha tieseň).',
  '<b>PRUDONCE</b> – obmedzená prevádzka je opäť možná (tieseň ešte trvá). <b>SEELONCE FEENEE</b> (v učebnici „Seelonce Fini“) – koniec rádiového pokoja, tieseň skončila.',
  '<b>Zrušenie vlastného MAYDAY</b> (nájdený MOB, falošný poplach EPIRB/DSC): <b>bez slova MAYDAY</b> · ALL STATIONS 3× · THIS IS · meno 3× · call sign · MMSI · <b>CANCEL MY DISTRESS ALERT</b> (+ čas) · OUT.'
  ]},
{ id:'R16', a:'R', n:16, t:'Súrny signál, súrna správa',
  k:'PAN PAN 3× – len so súhlasom veliteľa. Ohrozenie nie je bezprostredné. Prednosť pred všetkým okrem MAYDAY.',
  b:[
  'Signál je slovo <b>PAN PAN</b> (pan pan / pen pen).',
  'Smie sa vyslať <b>len so súhlasom veliteľa</b> (osoby zodpovednej za loď).',
  '<b>Význam:</b> nasleduje veľmi <b>súrna správa o bezpečnosti</b> lode alebo osoby. Na záchranu nestačím sám, ale <b>ohrozenie nie je bezprostredné</b> (napr. nefunguje motor a unáša nás).',
  '<b>Adresát:</b> všetky stanice, skupina staníc alebo jedna stanica. Ukončenie súrnej korešpondencie <b>nie je predpísané</b>.',
  '<b>Priorita:</b> pred všetkým okrem MAYDAY. Vysiela sa na tiesňovej frekvencii (kanál 16).',
  '<b>Volanie:</b> PAN PAN <b>3×</b> · ALL STATIONS <b>3×</b> · THIS IS · motor boat DAFNE <b>3×</b> · call sign · MMSI · správa podľa M-I-P-D-A-N-I-O (poloha, DRIFTING, NEED TOW, dĺžka lode 42 FEET) · OVER.'
  ]},
{ id:'R17', a:'R', n:17, t:'Bezpečnostný signál, bezpečnostná správa',
  k:'SECURITE 3× – nebezpečenstvo pre plavbu alebo meteo výstraha. Začať na 16, potom pracovný kanál.',
  b:[
  'Signál je slovo <b>SECURITE</b> („sekjúrité“).',
  '<b>Význam:</b> nasleduje <b>bezpečnostná správa</b> o bezpečnosti plavby alebo dôležitá <b>meteorologická výstraha</b> (plávajúca prekážka, búrka…).',
  '<b>Adresát:</b> všetky stanice, skupina alebo jedna stanica. Postup a ukončenie <b>nie sú predpísané</b>. Volať môže loď aj pobrežná stanica či Coast Guard.',
  '<b>Priorita:</b> pred všetkým <b>okrem tiesňových a súrnych</b> správ; vždy v <b>otvorenej reči</b>.',
  '<b>Kanál:</b> začína sa na <b>16</b>, oznámi sa pracovný kanál a prejde sa naň; krátku správu možno povedať priamo na 16.',
  '<b>Volanie:</b> SECURITE <b>3×</b> · ALL STATIONS <b>3×</b> · THIS IS · meno 3× · call sign · MMSI · (pozícia) → správa (FLOATING BOX, 0,5 Nm WEST of Milna, UTC 1712) · OVER/OUT.'
  ]},

// ===================== ELEKTROTECHNIKA =====================
{ id:'E1', a:'E', n:1, t:'Rozdiel medzi vodičom, polovodičom a izolantom',
  k:'Vodič má voľné elektróny (meď), izolant nemá (sklo, plast), polovodič vedie len za určitých podmienok.',
  b:[
  'Nosičmi elektriny sú <b>elektróny</b> – rozhodujú tie na poslednej (<b>valenčnej</b>) dráhe atómu (Bohrov model).',
  '<b>Vodič</b> – veľa <b>voľných elektrónov</b>, vedie prúd. Meď, zlato, striebro… Po pripojení napätia tečú elektróny ku kladnému pólu.',
  '<b>Izolant (nevodič)</b> – <b>nemá voľné elektróny</b>, nevedie prúd. Sklo, vzduch, plast, porcelán…',
  '<b>Polovodič</b> – vedie prúd <b>len za určitých podmienok</b>: vonkajších (teplo – teplomer, svetlo – fotobunka) alebo vnútorných (pridaná <b>prímes</b>, napr. ku kremíku).',
  'Typ <b>N</b> – prímes má elektrón navyše (negatívny); typ <b>P</b> – chýba elektrón, „diera“ (pozitívny).',
  '<b>Dióda</b> (spojenie P a N) prepúšťa prúd <b>len jedným smerom</b> – využitie na usmernenie striedavého prúdu.',
  '<b>Tranzistor</b> (NPN alebo PNP) – <b>zosilňuje</b> slabý signál (napr. z mikrofónu).'
  ]},
{ id:'E2', a:'E', n:2, t:'Schématické značky základných elektrotechnických obvodových prvkov',
  k:'Rezistor = obdĺžnik, kondenzátor = dve rovnobežné čiary, zdroj = dlhá a krátka čiara, ampérmeter = A v krúžku.',
  sym:true,
  b:[
  'Treba poznať značky: <b>vodič, uzemnenie, anténa (prijímacia/vysielacia), zdroj jednosmerného prúdu, jednosmerný a striedavý prúd, rezistor (odpor), kondenzátor, cievka, transformátor so železným jadrom, poistka, žiarovka, ampérmeter, voltmeter, dióda, vypínač</b>.',
  'Precvič ich v kvíze – značky sú nakreslené nižšie.'
  ]},
{ id:'E3', a:'E', n:3, t:'Jednotky elektrických veličín',
  k:'U – volt (V), I – ampér (A), R – ohm (Ω), P – watt (W), f – hertz (Hz), C – farad (F), L – henry (H).',
  b:[
  '<b>Napätie U – volt V</b> · <b>Prúd I – ampér A</b> · <b>Odpor R – ohm Ω</b> · <b>Výkon P – watt W</b>.',
  'Práca A – joule J · Vodivosť G – siemens S · Indukčnosť L – henry H · Kapacita C – farad F · <b>Frekvencia f – hertz Hz</b> · Vlnová dĺžka λ – meter m.',
  'Kapacita akumulátora: <b>ampérhodina Ah</b> (C = I × t).',
  '<b>Násobky:</b> T tera 10¹² · G giga 10⁹ · M mega 10⁶ · k kilo 10³ · m mili 10⁻³ · µ mikro 10⁻⁶ · n nano 10⁻⁹ · p piko 10⁻¹².',
  '1 ampér = náboj 1 coulomb za 1 sekundu.'
  ]},
{ id:'E4', a:'E', n:4, t:'Ohmov zákon',
  k:'U = R × I · I = U / R · R = U / I (pyramída: U hore, R a I dole).',
  b:[
  '<b>U = R × I</b>, <b>I = U / R</b>, <b>R = U / I</b>.',
  '<b>Pyramída:</b> U hore, R a I dole vedľa seba. Vedľa seba = násobenie, nad sebou = delenie.',
  '<b>Voda:</b> prúd = prúd vody v potrubí, odpor = kohútik (čím zavretejší, tým väčší odpor), napätie = výška nádrže.',
  'Väčšie napätie → väčší prúd; väčší odpor → menší prúd.',
  '<b>Ampérmeter</b> meria prúd – zapája sa <b>sériovo</b> (rozpojiť obvod), musí mať <b>čo najmenší vnútorný odpor</b>. Rozsah sa zväčšuje paralelným odporom (bočník).',
  '<b>Voltmeter</b> meria napätie – zapája sa <b>paralelne</b> k spotrebiču, musí mať <b>čo najväčší vnútorný odpor</b>.',
  'Príklad: 12 V, 4 Ω → I = 12/4 = <b>3 A</b>.'
  ]},
{ id:'E5', a:'E', n:5, t:'Elektrický výkon, príkon a účinnosť',
  k:'P = U × I (W). Príkon = výkon + straty. Účinnosť η = výkon / príkon (× 100 %).',
  b:[
  '<b>Výkon</b> = práca za jednotku času, vo <b>wattoch</b>: <b>P = U × I</b>.',
  'Striedavý prúd: zdanlivý P = U·I, <b>činný</b> P = U·I·cos φ (koná prácu), <b>jalový</b> P = U·I·sin φ (vytvára pole, nekoná prácu).',
  '<b>Príkon</b> = energia, ktorú do stroja privádzame: <b>Pp = Pv + Ps</b> (výkon + straty, napr. teplo).',
  '<b>Účinnosť η (eta)</b> = výkon / príkon, v % = Pv/Pp × 100. Je vždy menšia ako 1 (100 %).',
  'Príklad: vrátok s príkonom 1000 W na 12 V → I = 1000/12 ≈ <b>83 A</b>.'
  ]},
{ id:'E6', a:'E', n:6, t:'Zdroje jednosmerného prúdu a ich zapojenie',
  k:'Sériovo: napätia sa sčítajú, prúd rovnaký. Paralelne: prúdy sa sčítajú, napätie rovnaké.',
  b:[
  '<b>Galvanické články</b> – chemická reakcia, článok 1,5 V · <b>Akumulátory</b> – vratná reakcia, nabíjajú sa opakovane (olovené, alkalické) · <b>Dynamá</b> – mechanická energia · <b>Usmerňovače</b> – diódy zo striedavého · <b>Termoelektrické</b> – teplo · <b>Fotoelektrické</b> – svetlo.',
  '<b>Sériové zapojenie (za sebou):</b> <b>napätie sa sčítava</b> (U = U₁ + U₂ + …), prúd sa nemení – je daný zdrojom s najmenším prúdom.',
  '<b>Paralelné zapojenie (vedľa seba):</b> <b>prúdy sa sčítajú</b> (I = I₁ + I₂ + …), napätie sa nemení. Len zdroje <b>rovnakého napätia</b> (inak vyrovnávacie skratové prúdy).',

{ id:'E7', a:'E', n:7, t:'Údržba olovených a alkalických akumulátorov',
  k:'Olovené: čisté svorky, dolievať destilovanú vodu, nabíjať 0,1 × kapacity. Alkalické: 1,2 V, lúh, ľahké. Skladovať oddelene!',
  b:[
  '<b>Formovanie oloveného:</b> vypláchnuť destilovanou vodou → naplniť kyselinou, 2 h nasakovať → nabíjať → po nabití vybiť menovitým prúdom (článok 1,8 V) → znovu nabiť. Pri nabíjaní článok 2,8 V.',
  '<b>V prevádzke:</b> udržiavať <b>čisté svorky</b> (malé prechodové odpory, žiadne samovybíjanie), <b>dolievať destilovanú vodu</b>, kontrolovať napätie, dobíjať. Pred odstavením <b>úplne nabiť</b>.',
  '<b>Kapacita</b> C = I × t (Ah). <b>Nabíjací prúd = 0,1 × C</b> → batéria 50 Ah = 5 A. Moderné nabíjačky majú programy podľa typu batérie.',

{ id:'E8', a:'E', n:8, t:'Fyziologické účinky elektrického prúdu',
  k:'1–3 mA brnenie · 5–10 mA popáleniny · ~10 mA sa nedá pustiť · ~30 mA zlyháva srdce.',
  b:[
  'Ide o účinky prúdu na živé tkanivo; prúd pôsobí aj na <b>nervovú sústavu</b>.',
  '<b>1–3 mA</b> – slabé brnenie.',
  '<b>5–10 mA</b> – rozklad buniek (popáleniny).',

  'Väčšie prúdy – krvné zrazeniny; <b>okolo 30 mA</b> prestáva srdce plniť funkciu.',

  ]},
{ id:'E9', a:'E', n:9, t:'Prvá pomoc pri úraze elektrickým prúdom',
  k:'Vyprostiť z prúdu → nedýcha: dýchanie → nemá pulz: masáž srdca → ošetriť rany → lekár.',
  b:[
  '<b>a)</b> postihnutého <b>uvoľniť od styku s prúdom</b> (vypnúť, odsunúť nevodivým predmetom),',
  '<b>b)</b> ak <b>nedýcha</b> – ihneď <b>umelé dýchanie</b>,',
  '<b>c)</b> ak <b>nemá hmatateľný pulz</b> – <b>nepriama masáž srdca</b>,',
  '<b>d)</b> ošetriť rany, popáleniny, zlomeniny,',
  '<b>e)</b> zavolať lekára.',
  'Konať <b>rýchlo, pokojne a rozvážne</b>. Postihnutého v bezvedomí <b>neprenášať</b> ani neprevážať a <b>nenechať samého</b> – výnimka: silné krvácanie (prevážať ležiaceho).',
  '<b>Ochrana pred nadprúdom:</b> poistky (pri výmene vypnúť, odstrániť skrat, rovnaká hodnota, <b>neopravovať</b>), ističe, nadprúdové relé. <b>Pred prepätím</b> (búrka, dlhé antény): iskrište, dútnavky, výbojky.'

{ id:'E10', a:'E', n:10, t:'Rozdelenie rádiových vĺn a ich šírenie',
  k:'VHF (30–300 MHz, metrové vlny) sa šíri priamočiaro. Dosah závisí od výšky antény: D = 2,5 × (√H₁ + √H₂) Nm.',
  b:[
  '<b>DV</b> dlhé (pod 0,3 MHz) – prízemná vlna, ohýbajú sa, veľké vzdialenosti, cez deň aj v noci.',
  '<b>SV</b> stredné (0,3–3 MHz, 1000–100 m) – cez deň prízemná, <b>v noci odraz</b>; NAVTEX 490/518 kHz.',
  '<b>KV</b> krátke (3–30 MHz, 100–10 m) – <b>odraz od ionosféry</b>, celosvetové spojenie.',
  '<b>VKV / VHF</b> veľmi krátke (<b>30–300 MHz, 10–1 m</b>) – <b>priamočiaro</b>, na optickú vzdialenosť; lodné VHF 156–162 MHz, AIS. Počasie ich prakticky neovplyvňuje.',
  '<b>UKV / UHF</b> (300–3000 MHz) – priamo, cez ionosféru: EPIRB 406 MHz, GPS 1,5 GHz. SART 9 GHz.',
  '<b>Ionosféra</b> – 50–500 km, ionizovaná slnečným žiarením; vrstvy <b>D (~60 km), E (~120 km), F1 a F2 (200–400 km)</b>. Závisí od dennej doby, ročného obdobia a 11-ročného slnečného cyklu; v noci slabne.',
  'Šírenie: <b>prízemná vlna</b> (DV, SV cez deň), <b>priama</b> (VKV), <b>odrazená</b> od terénu, <b>priestorová</b> – od ionosféry (SV v noci, KV).',
  '<b>Rádiový horizont VHF:</b> d [Nm] = 2,5 × √H [m]; dve stanice: <b>D = 2,5 × (√H₁ + √H₂)</b>. Príklad: 16 m a 100 m → 2,5 × (4 + 10) = <b>35 Nm</b>. Lode sa bežne počujú na cca 15–30 Nm.',
  'Maximálny dosah VHF závisí <b>od výšky antény</b>, nie od výkonu.'
  ]},
{ id:'E11', a:'E', n:11, t:'Antény, napájače, druhy',
  k:'Všesmerové (dipól, tyčová λ/4) a smerové (Yagi, parabola). Napájače: dvojlinka 300 Ω, koaxiál 75 Ω (komunikačný 50 Ω).',
  b:[
  '<b>Všesmerové</b> – vyžarujú rovnomerne do všetkých smerov v jednej rovine; <b>smerové</b> – hlavne jedným smerom.',
  '<b>Dipól</b> – polvlnová anténa z dvoch symetrických častí, <b>osmičková</b> charakteristika (v smere žiaričov nevyžaruje).',
  '<b>Tyčová</b> – zvislý dipól, ktorého dolnú polovicu tvorí <b>zem</b>; dĺžka <b>λ/4</b>. Kratšia = menšia účinnosť. Anténa musí byť <b>uzemnená</b>.',
  '<b>Yagi</b> – žiarič + reflektor (vzadu) + direktory (vpredu); viac prvkov = užšia charakteristika. <b>Parabolická</b> – veľmi úzka (pootočenie o 10° = strata signálu). <b>Súfázové</b> – dipóly nad sebou. <b>Rámová</b> – zameriavanie vysielačov (s tyčovou = rádiogoniometer).',
  'Krátka anténa = „široká“ charakteristika, necitlivá na náklon (ručné stanice). Dlhá = „štíhla“, silná, ale pri náklone lode vysiela do neba.',
  '<b>Napájač</b> = vedenie medzi anténou a stanicou. <b>Dvojlinka</b>: symetrická, <b>300 Ω</b>. <b>Koaxiálny kábel</b>: nesymetrický, tienený, <b>75 Ω</b> (komunikačný <b>50 Ω</b>); na symetrickú anténu treba symetrizačný člen.',
  '<b>Zlomená anténa → NEVYSIELAŤ!</b> Signál sa vráti a spáli zosilňovač. Núdzovo: obnažiť vnútorný drôt koaxiálu (učebnica: cca 92 mm).'
  ]},
{ id:'E12', a:'E', n:12, t:'Vzťah medzi frekvenciou a dĺžkou vlny',
  k:'λ = c / f, c = 300 000 km/s. Kratšia vlna = vyššia frekvencia. Kanál 16: λ ≈ 1,9 m.',
  b:[
  '<b>Frekvencia f</b> – počet vĺn za sekundu (Hz). <b>Vlnová dĺžka λ</b> – vzdialenosť, ktorú vlna prejde za jeden kmit (m).',
  'Rádiové vlny sa šíria rýchlosťou svetla <b>c = 300 000 km/s = 3 × 10⁸ m/s</b>.',
  '<b>λ = c / f</b> a <b>f = c / λ</b>.',
  '<b>Čím kratšia vlna, tým vyššia frekvencia.</b> VKV = veľmi krátke vlny = VHF (very high frequency).',
  'Kanál 16: 300 000 000 / 156 800 000 ≈ <b>1,91 m</b>; polovica ≈ 0,96 m (efektívne cca 0,92 m).',
  'Príklad: 100 MHz → 3 m; 30 MHz → 10 m.'
  ]},
{ id:'E13', a:'E', n:13, t:'Simplexná, semiduplexná a duplexná prevádzka',
  k:'Simplex = 1 frekvencia, hovorí jeden (OVER). Duplex = 2 frekvencie naraz ako telefón. Semiduplex = jedna strana duplex, druhá simplex.',
  b:[
  'Rádiostanica má dva obvody – príjem a vysielanie; prepína sa <b>tlačidlom na mikrofóne (PTT)</b>. Bežne je na príjme.',
  '<b>Simplex:</b> <b>jedna frekvencia</b>, hovorí len jeden, druhý počúva. „OVER“ = púšťam tlačidlo. Stačí bežná vysielačka. <b>Loď–loď vždy simplexne</b>.',
  '<b>Duplex:</b> <b>dve frekvencie súčasne</b>, hovoria obaja naraz ako po telefóne (napr. trajekt – most). Treba upravenú stanicu; pobrežná stanica má frekvencie opačne.',
  '<b>Semiduplex:</b> dvojfrekvenčný kanál – pobrežná stanica pracuje duplexne, loď s bežnou stanicou simplexne (kým hovorí, nepočuje). Preto sa ohlasuj <b>typom lode</b>: „This is sailboat…“.',
  '<b>Duplexné kanály</b> majú pod jedným číslom dve frekvencie (väčšina), ostatné sú jednofrekvenčné (napr. 6, 8, 13, 16, 72, 77).',
  '<b>Modulácia</b> = spojenie signálu reči s nosnou vlnou; obe stanice musia mať rovnaký druh modulácie.',
  '<b>DW (dual watch)</b> – sledovanie dvoch kanálov (pracovného a 16).'
  ]}
];
