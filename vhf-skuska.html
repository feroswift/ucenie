<script>
(function(){
'use strict';
// ---------- storage ----------
const KEY='vhf-skuska-v1';
let S={res:{},plan:{},scen:{},exams:[]};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const main=$('#main');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a,n)=>shuffle(a).slice(0,n);
const TOP={}; TOPICS.forEach(t=>TOP[t.id]=t);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1600);}

// ---------- questions ----------
const QS=Q.map(q=>({k:q[0]+'|'+q[1],t:q[0],q:q[1],ok:q[2],wr:[q[3],q[4],q[5]],e:q[6]||''}));
SYMBOLS.forEach(s=>QS.push({k:'E2|sym|'+s.n,t:'E2',q:'Čo predstavuje táto schematická značka?',sym:s.s,ok:s.n,wr:null,e:''}));
function opts(q){
  const wr=q.wr||pick(SYMBOLS.filter(s=>s.n!==q.ok).map(s=>s.n),3);
  return shuffle([q.ok].concat(wr));
}
const byTopic={}; QS.forEach(q=>(byTopic[q.t]=byTopic[q.t]||[]).push(q));
function mastery(tid){const qs=byTopic[tid]||[];let ok=0,seen=0;qs.forEach(q=>{if(q.k in S.res){seen++;if(S.res[q.k])ok++;}});return {ok,seen,n:qs.length,p:qs.length?ok/qs.length:0};}
function areaMastery(a){let ok=0,n=0;TOPICS.filter(t=>t.a===a).forEach(t=>{const m=mastery(t.id);ok+=m.ok;n+=m.n;});return n?ok/n:0;}

// ---------- countdown ----------
(function(){
  const exam=new Date(2026,10,18); const now=new Date(); now.setHours(0,0,0,0);
  const d=Math.round((exam-now)/864e5);
  $('#count').innerHTML=d>1?`<b>${d}</b>dní do skúšky`:d===1?'<b>zajtra</b>skúška':d===0?'<b>dnes</b>skúška!':'<b>✓</b>po skúške';
})();

// ---------- nav ----------
let tab='plan';
const VIEW={};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
let retTab=null, planY=0;
function go(t,opt){opt=opt||{};if(tab==='plan')planY=window.scrollY;retTab=(opt.tab||opt.topic||opt.open||opt.spell)&&tab!==t?tab:null;tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));VIEW[t](opt);window.scrollTo(0,t==='plan'?planY:0);}
function back(fallback){if(retTab){const r=retTab;retTab=null;go(r);}else fallback();}

// ================= PLÁN =================
VIEW.plan=function(){
  const today=new Date(); const iso=today.getFullYear()+'-'+(today.getMonth()+1)+'-'+today.getDate();
  const dayIdx={'2026-11-13':0,'2026-11-14':1,'2026-11-15':2,'2026-11-16':3,'2026-11-17':4,'2026-11-18':5}[iso];
  let total=0,done=0;
  PLAN.forEach((d,i)=>d.items.forEach((x,j)=>{total++;if(S.plan[i+'-'+j])done++;}));
  let h=`<h2>5-dňový plán</h2>
  <div class="card"><div class="muted" style="margin-bottom:6px">Splnené úlohy: ${done} / ${total}</div><div class="bar"><i style="width:${total?done/total*100:0}%"></i></div>
  <div class="stat3" style="margin-top:12px">${['P','R','E'].map(a=>`<div class="card"><span class="tag" style="background:${AREAS[a].color}">${AREAS[a].short}</span><b>${Math.round(areaMastery(a)*100)} %</b><span class="muted">zvládnuté</span></div>`).join('')}</div></div>`;
  PLAN.forEach((d,i)=>{
    h+=`<div class="card day ${i===dayIdx?'today':''}"><div class="dh"><b>${d.d} · ${d.h}</b>${i===dayIdx?'<span class="tag" style="background:var(--red)">DNES</span>':''}</div>`;
    d.items.forEach((x,j)=>{const on=!!S.plan[i+'-'+j];
      h+=`<div class="task ${on?'done':''}"><button class="chk ${on?'on':''}" data-p="${i}-${j}" aria-label="splnené">${on?'✓':''}</button><span>${esc(x.t)}</span><button class="go" data-a='${JSON.stringify(x.act)}'>Otvoriť →</button></div>`;});
    h+=`</div>`;
  });
  h+=`<p class="muted">Tip: každý deň aspoň 5 minút hláskovania a 1 MAYDAY scenár. Tieseň (MAYDAY, PAN PAN, SECURITE) býva jadro skúšky.</p>`;
  main.innerHTML=h;
  main.querySelectorAll('.chk').forEach(b=>b.onclick=()=>{S.plan[b.dataset.p]=!S.plan[b.dataset.p];save();VIEW.plan();});
  main.querySelectorAll('.go').forEach(b=>b.onclick=()=>{const a=JSON.parse(b.dataset.a);go(a.tab,a);});
};

// ================= ŤAHÁK =================
let tArea='P', tOpen=null, tSearch='';
VIEW.tahak=function(o){
  if(o.area&&o.area!=='X')tArea=o.area; if(o.open){tOpen=o.open;tArea=TOP[o.open].a;}
  let h=`<h2>Ťahák</h2><div class="pills">${['P','R','E'].map(a=>`<button class="pill ${a===tArea&&!tSearch?'on':''}" data-a="${a}">${AREAS[a].short} (${TOPICS.filter(t=>t.a===a).length})</button>`).join('')}</div>
  <input class="search" id="srch" placeholder="Hľadať v ťaháku… (napr. MMSI, 16, Ohm)" value="${esc(tSearch)}">`;
  const s=tSearch.trim().toLowerCase();
  const list=s?TOPICS.filter(t=>(t.t+' '+t.k+' '+t.b.join(' ')).toLowerCase().includes(s)):TOPICS.filter(t=>t.a===tArea);
  if(!s)h+=`<p class="muted">${AREAS[tArea].name}. Číslovanie podľa zoznamu otázok na skúšku. Ťukni na tému.</p>`;
  if(s&&!list.length)h+=`<p class="muted">Nič sa nenašlo.</p>`;
  h+=`<div id="tl">`+list.map(t=>{const m=mastery(t.id);
    return `<div class="card topic ${tOpen===t.id?'open':''}" id="t-${t.id}"><button data-t="${t.id}"><span class="num" style="background:${AREAS[t.a].color}">${t.a==='P'?'':t.a==='R'?'':''}${t.n}</span><span class="tt">${esc(t.t)}</span><span class="mast">${m.seen?Math.round(m.p*100)+' %':'–'}</span></button>
    <div class="body"><div class="key">${t.k}</div><ul>${t.b.map(x=>`<li>${x}</li>`).join('')}</ul>
    ${t.sym?`<div class="symgrid">${SYMBOLS.map(s=>`<div>${s.s}${esc(s.n)}</div>`).join('')}</div>`:''}
    <div class="btns"><button class="btn" data-q="${t.id}">Kvíz z témy (${(byTopic[t.id]||[]).length})</button></div></div></div>`;}).join('')+`</div>`;
  main.innerHTML=h;
  main.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{tArea=b.dataset.a;tSearch='';tOpen=null;VIEW.tahak({});});
  const inp=$('#srch'); inp.oninput=()=>{tSearch=inp.value;const pos=inp.selectionStart;VIEW.tahak({});const n=$('#srch');n.focus();n.setSelectionRange(pos,pos);};
  main.querySelectorAll('.topic>button').forEach(b=>b.onclick=()=>{const id=b.dataset.t;tOpen=tOpen===id?null:id;main.querySelectorAll('.topic').forEach(c=>c.classList.toggle('open',c.id==='t-'+tOpen));});
  main.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>go('kviz',{topic:b.dataset.q,start:true}));
  if(o.open){const el=$('#t-'+o.open);if(el)setTimeout(()=>el.scrollIntoView({block:'start'}),30);}
};

// ================= KVÍZ =================
let qArea='P', qMode='quiz', QZ=null;
function poolFor(area,topic){
  if(topic)return byTopic[topic]||[];
  if(area==='X')return QS.filter(q=>S.res[q.k]===0);
  if(area==='A')return QS;
  return QS.filter(q=>TOP[q.t].a===area);
}
function startQuiz(area,topic){
  const pool=poolFor(area,topic);
  if(!pool.length){toast(area==='X'?'Zatiaľ nemáš žiadne chyby 👍':'Žiadne otázky');return VIEW.kviz({});}
  // prednostne nevidené a chybné
  const w=q=>!(q.k in S.res)?3:S.res[q.k]===0?4:1;
  const ranked=shuffle(pool).sort((a,b)=>w(b)-w(a)+ (Math.random()-.5)*1.5);
  const n=topic?pool.length:Math.min(10,pool.length);
  QZ={from:retTab,area,topic,items:ranked.slice(0,n).map(q=>({q,o:opts(q),a:null})),i:0,flip:false};
}
VIEW.kviz=function(o){
  if(o.area){qArea=o.area;QZ=null;}
  if(o.topic){startQuiz(null,o.topic);}
  if(QZ)return renderQ();
  const cnt=a=>poolFor(a).length;
  let h=`<h2>Kvíz a kartičky</h2>
  <div class="pills">${[['quiz','Kvíz'],['flash','Kartičky']].map(([k,l])=>`<button class="pill ${qMode===k?'on':''}" data-m="${k}">${l}</button>`).join('')}</div>
  <div class="card"><b>Z čoho?</b><div class="pills" style="margin-bottom:0">
  ${['P','R','E'].map(a=>`<button class="pill ${qArea===a?'on':''}" data-a="${a}">${AREAS[a].short} (${cnt(a)})</button>`).join('')}
  <button class="pill ${qArea==='A'?'on':''}" data-a="A">Všetko (${cnt('A')})</button>
  <button class="pill ${qArea==='X'?'on':''}" data-a="X">❗ Moje chyby (${cnt('X')})</button></div></div>
  <button class="btn wide" id="go">${qMode==='quiz'?'Spustiť kvíz – 10 otázok':'Spustiť kartičky – 10 kusov'}</button>
  <p class="muted">Kvíz uprednostňuje otázky, ktoré si ešte nevidel alebo si ich pokazil. Výsledky sa ukladajú v tomto prehliadači.</p>
  <h3>Prehľad podľa tém</h3>`;
  ['P','R','E'].forEach(a=>{
    h+=`<div class="card"><span class="tag" style="background:${AREAS[a].color}">${AREAS[a].short}</span><div style="margin-top:8px">`+
    TOPICS.filter(t=>t.a===a).map(t=>{const m=mastery(t.id);const c=!m.seen?'#cfd8e0':m.p>=.8?'var(--green)':m.p>=.5?'var(--amber)':'var(--red)';
      return `<button class="pill" style="margin:3px;border-color:${c};border-width:2px" data-t="${t.id}" title="${esc(t.t)}">${t.n}</button>`;}).join('')+`</div></div>`;
  });
  h+=`<p class="muted">Farba čísla: šedá = nevidené, červená/oranžová/zelená = úspešnosť. Ťukni na číslo pre kvíz z témy.</p>`;
  main.innerHTML=h;
  main.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{qMode=b.dataset.m;VIEW.kviz({});});
  main.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{qArea=b.dataset.a;VIEW.kviz({});});
  main.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>VIEW.kviz({topic:b.dataset.t}));
  $('#go').onclick=()=>{startQuiz(qArea);renderQ();};
};
function record(q,ok){S.res[q.k]=ok?1:0;save();}
function renderQ(){
  const it=QZ.items[QZ.i]; const q=it.q; const t=TOP[q.t];
  const head=`<div class="qhead"><span><span class="tag" style="background:${AREAS[t.a].color}">${AREAS[t.a].short} ${t.n}</span> ${esc(t.t.length>38?t.t.slice(0,36)+'…':t.t)}</span><span style="white-space:nowrap">${QZ.i+1} / ${QZ.items.length}</span></div><div class="bar" style="margin-bottom:10px"><i style="width:${(QZ.i)/QZ.items.length*100}%"></i></div>`;
  let h=`<div class="card">${head}`;
  if(q.sym)h+=`<div class="qsym">${q.sym}</div>`;
  h+=`<div class="qtext">${esc(q.q)}</div>`;
  if(qMode==='flash'){
    h+=`<div class="flash" id="fl">${QZ.flip?`<div class="ans">${esc(q.ok)}</div>${q.e?`<div class="expl" style="text-align:left">${esc(q.e)}</div>`:''}`:'<div class="muted">Povedz si odpoveď nahlas a ťukni pre otočenie ↻</div>'}</div>`;
    if(QZ.flip)h+=`<div class="btns"><button class="btn red" id="no" style="flex:1">Nevedel som</button><button class="btn" id="yes" style="flex:1;background:var(--green)">Vedel som</button></div>`;
  } else {
    h+=it.o.map((x,i)=>{let c='';if(it.a!==null){if(x===q.ok)c='ok';else if(i===it.a)c='bad';else c='dim';}return `<button class="opt ${c}" data-i="${i}" ${it.a!==null?'disabled':''}>${esc(x)}</button>`;}).join('');
    if(it.a!==null){const ok=it.o[it.a]===q.ok;
      h+=`<div class="expl"><b>${ok?'✓ Správne.':'✗ Správne je: '+esc(q.ok)}</b>${q.e?' '+esc(q.e):''}<br><button class="link" id="tl">Otvoriť ťahák k téme</button></div>
      <button class="btn wide" id="nx" style="margin-top:12px">${QZ.i+1<QZ.items.length?'Ďalej →':'Výsledok'}</button>`;}
  }
  h+=`</div><button class="link" id="quit">← ukončiť</button>`;
  main.innerHTML=h;
  $('#quit').onclick=()=>{const f=QZ.from;QZ=null;f?go(f):VIEW.kviz({});};
  if(qMode==='flash'){
    $('#fl').onclick=()=>{QZ.flip=!QZ.flip;renderQ();};
    if(QZ.flip){$('#no').onclick=()=>{it.a=0;record(q,false);nextQ();};$('#yes').onclick=()=>{it.a=1;record(q,true);nextQ();};}
  } else {
    main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{it.a=+b.dataset.i;record(q,it.o[it.a]===q.ok);renderQ();});
    if(it.a!==null){$('#nx').onclick=nextQ;$('#tl').onclick=()=>go('tahak',{open:q.t});}
  }
}
function nextQ(){QZ.flip=false;if(QZ.i+1<QZ.items.length){QZ.i++;renderQ();}else quizDone();}
function quizDone(){
  const its=QZ.items; const ok=its.filter(it=>qMode==='flash'?it.a===1:it.o[it.a]===it.q.ok).length;
  const pct=Math.round(ok/its.length*100);
  let h=`<div class="card" style="text-align:center"><div class="big" style="color:${pct>=80?'var(--green)':pct>=50?'var(--amber)':'var(--red)'}">${pct} %</div><p>${ok} z ${its.length} správne</p>
  <p class="muted">${pct>=80?'Výborne, ide ti to!':pct>=50?'Dobre, ešte to precvič.':'Pozri si ťahák a skús znova.'}</p></div>`;
  const bad=its.filter(it=>!(qMode==='flash'?it.a===1:it.o[it.a]===it.q.ok));
  if(bad.length)h+=`<h3>Na zopakovanie</h3>`+bad.map(it=>`<div class="rev"><b>${esc(it.q.q)}</b><br><span class="y">✓ ${esc(it.q.ok)}</span> · <button class="link" data-t="${it.q.t}">ťahák</button></div>`).join('');
  h+=`<div class="btns"><button class="btn" id="again" style="flex:1">Ďalšie kolo</button><button class="btn ghost" id="back" style="flex:1">${QZ.from==='plan'?'Späť na plán':QZ.from==='tahak'?'Späť na ťahák':'Späť'}</button></div>`;
  const prev=QZ; main.innerHTML=h;
  main.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>go('tahak',{open:b.dataset.t}));
  $('#again').onclick=()=>{startQuiz(prev.area||qArea,prev.topic);QZ.from=prev.from;renderQ();};
  $('#back').onclick=()=>{QZ=null;prev.from?go(prev.from):VIEW.kviz({});};
  QZ=null;
}

// ================= KOMUNIKÁCIA =================
let K=null, komFrom=null; // {sc, pool:[{txt,id}], picked:[ids], checked}
VIEW.kom=function(o){
  if(o.tab)komFrom=retTab;
  if(o.spell)return startSpell();
  if(K)return renderK();
  const groups=[...new Set(SCEN.map(s=>s.g))];
  let h=`<h2>Tréning komunikácie</h2><p class="muted">Poskladaj volanie z blokov v správnom poradí. Nahlas si ho pri tom hovor – presne tak ako do mikrofónu.</p>
  <button class="scen" id="sp" style="border-color:var(--navy2)"><span><b>🔤 Hláskovanie volacej značky</b><br><span class="muted">Náhodná značka → poskladaj Alfa, Bravo…</span></span><span>›</span></button>`;
  groups.forEach(g=>{h+=`<h3>${g}</h3>`+SCEN.filter(s=>s.g===g).map(s=>`<button class="scen" data-s="${s.id}"><span>${esc(s.t)}</span><span class="${S.scen[s.id]?'ok':'muted'}">${S.scen[s.id]?'✓':'›'}</span></button>`).join('');});
  h+=`<div class="card"><b>Pomôcka O-K-O</b><br><span class="muted">Oslov (3×) · Kto si – THIS IS + meno (3×) · O čom / OVER. Odpoveď stačí 1×. Koniec: OUT.</span><br><br><b>M-I-P-D-A-N-I-O</b><br><span class="muted">Mayday · Identification · Position (at time) · Distress · Assistance · Number · Information · Over</span></div>`;
  main.innerHTML=h;
  $('#sp').onclick=startSpell;
  main.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>startScen(SCEN.find(s=>s.id===b.dataset.s)));
};
function startScen(sc){
  const all=sc.b.map((t,i)=>({txt:t,c:i})).concat((sc.d||[]).map(t=>({txt:t,c:-1})));
  K={sc,pool:shuffle(all).map((x,i)=>Object.assign(x,{id:i})),picked:[],checked:false};renderK();
}
function startSpell(){
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const r=()=>L[Math.floor(Math.random()*26)];
  const type=Math.random();
  let cs = type<0.6 ? 'OM'+r()+r()+(2+Math.floor(Math.random()*8))+(Math.floor(Math.random()*10)) : type<0.85 ? 'OM'+r()+r() : 'OM'+(1+Math.floor(Math.random()*8))+r()+r()+r();
  const words=[...cs].map(ch=>/\d/.test(ch)?NUMW[+ch]:NATO[ch]);
  const used=new Set(words);
  const fakes=pick(Object.values(NATO).filter(w=>!used.has(w)).concat(FAKE_WORDS),4);
  const sc={id:'spell',t:'Hláskovanie',s:`Vyhláskuj volaciu značku:<div class="spellbig">${cs}</div>`,b:words,d:fakes,n:'Písmená podľa medzinárodnej hláskovacej tabuľky, číslice po jednej anglicky (zero, one, two…).',spell:true};
  startScen(sc);
}
function renderK(){
  const sc=K.sc;
  let h=`<div class="qhead"><span class="tag" style="background:var(--navy2)">${esc(sc.g||'Hláskovanie')}</span><span></span></div><h2 style="margin-top:4px">${esc(sc.t)}</h2>
  <div class="sit">${sc.spell?sc.s:esc(sc.s)}</div>
  <div class="slot" id="slot">${K.picked.map((pid,i)=>{const x=K.pool[pid];let c='';if(K.checked)c=(x.c===i)?'ok':'bad';return `<button class="blk ${c}" data-u="${i}"><span class="n">${i+1}.</span>${esc(x.txt)}</button>`;}).join('')}</div>
  <div class="pool">${K.pool.filter(x=>!K.picked.includes(x.id)).map(x=>`<button class="blk" data-p="${x.id}">${esc(x.txt)}</button>`).join('')}</div>`;
  if(K.checked){
    const ok=K.picked.length===sc.b.length&&K.picked.every((pid,i)=>K.pool[pid].c===i);
    h+= ok?`<div class="note" style="border-color:var(--green);background:#e8f6ef"><b>✓ Výborne, presne tak!</b><br>${esc(sc.n)}</div>`
          :`<div class="note"><b>Ešte nie. Správne poradie:</b><ol style="margin:6px 0 4px;padding-left:20px">${sc.b.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${esc(sc.n)}</div>`;
    if(ok&&!sc.spell){S.scen[sc.id]=true;save();}
    h+=`<div class="btns"><button class="btn" id="again" style="flex:1">${sc.spell?'Ďalšia značka':'Skúsiť znova'}</button><button class="btn ghost" id="back" style="flex:1">Zoznam</button></div>`;
  } else {
    h+=`<div class="btns"><button class="btn" id="chk" style="flex:2" ${K.picked.length?'':'disabled'}>Skontrolovať</button><button class="btn ghost" id="undo" style="flex:1" ${K.picked.length?'':'disabled'}>↶ Späť</button></div>
    <button class="link" id="back" style="margin-top:12px">← zoznam scenárov</button>`;
  }
  main.innerHTML=h;
  main.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{K.picked.push(+b.dataset.p);renderK();});
  main.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{if(K.checked)return;K.picked.splice(+b.dataset.u,1);renderK();});
  const c=$('#chk'); if(c)c.onclick=()=>{K.checked=true;renderK();};
  const u=$('#undo'); if(u)u.onclick=()=>{K.picked.pop();renderK();};
  const a=$('#again'); if(a)a.onclick=()=>{sc.spell?startSpell():startScen(sc);};
  $('#back').onclick=()=>{K=null;if(sc.spell&&komFrom){const f=komFrom;komFrom=null;go(f);}else VIEW.kom({});};
}

// ================= SKÚŠKA =================
let EX=null;
VIEW.skuska=function(){
  if(EX)return EX.oral?renderOral():renderEx();
  let h=`<h2>Simulácia skúšky</h2>
  <div class="card"><b>📝 Písomná simulácia</b><p class="muted" style="margin:6px 0 10px">15 otázok: 5 z predpisov, 5 z prevádzky, 5 z elektrotechniky – každá z inej témy. Výsledok uvidíš až na konci.</p><button class="btn wide" id="w">Začať test</button></div>
  <div class="card"><b>🎤 Ťahanie tém (ústne)</b><p class="muted" style="margin:6px 0 10px">Vylosuje 5 tém z každej oblasti. Povedz si nahlas, čo o téme vieš, potom si otvor ťahák a ohodnoť sa.</p><button class="btn ghost wide" id="o">Vylosovať témy</button></div>`;
  if(S.exams.length){h+=`<h3>Moje pokusy</h3><div class="card">`+S.exams.slice(-8).reverse().map(e=>`<div class="res"><span>${e.d}</span><span>P ${e.p}/5 · R ${e.r}/5 · E ${e.e}/5 · <b>${e.p+e.r+e.e}/15</b></span></div>`).join('')+`</div>`;}
  main.innerHTML=h;
  $('#w').onclick=()=>{
    const items=[];['P','R','E'].forEach(a=>{pick(TOPICS.filter(t=>t.a===a),5).sort((x,y)=>x.n-y.n).forEach(t=>{const q=pick(byTopic[t.id],1)[0];items.push({q,o:opts(q),a:null});});});
    EX={items,i:0};renderEx();};
  $('#o').onclick=()=>{EX={oral:true,list:['P','R','E'].map(a=>pick(TOPICS.filter(t=>t.a===a),5).sort((x,y)=>x.n-y.n)),open:null,score:{}};renderOral();};
};
function renderEx(){
  if(EX.done)return exDone();
  const it=EX.items[EX.i]; const q=it.q; const t=TOP[q.t];
  let h=`<div class="card"><div class="qhead"><span class="tag" style="background:${AREAS[t.a].color}">${AREAS[t.a].name}</span><span>${EX.i+1} / 15</span></div><div class="bar" style="margin-bottom:10px"><i style="width:${EX.i/15*100}%"></i></div>
  ${q.sym?`<div class="qsym">${q.sym}</div>`:''}<div class="qtext">${esc(q.q)}</div>`+
  it.o.map((x,i)=>`<button class="opt ${it.a===i?'on':''}" style="${it.a===i?'border-color:var(--navy);background:var(--sea)':''}" data-i="${i}">${esc(x)}</button>`).join('')+
  `<div class="btns"><button class="btn ghost" id="pv" ${EX.i?'':'disabled'} style="flex:1">← Späť</button><button class="btn" id="nx" style="flex:2" ${it.a===null?'disabled':''}>${EX.i<14?'Ďalej →':'Odovzdať test'}</button></div></div>
  <button class="link" id="quit">← zrušiť test</button>`;
  main.innerHTML=h;
  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{it.a=+b.dataset.i;renderEx();});
  $('#pv').onclick=()=>{EX.i--;renderEx();};
  $('#nx').onclick=()=>{if(EX.i<14){EX.i++;renderEx();}else{EX.done=true;
    const sc={P:0,R:0,E:0};EX.items.forEach(it=>{const ok=it.o[it.a]===it.q.ok;record(it.q,ok);if(ok)sc[TOP[it.q.t].a]++;});
    const d=new Date();S.exams.push({d:d.getDate()+'. '+(d.getMonth()+1)+'. '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'),p:sc.P,r:sc.R,e:sc.E});save();renderEx();}};
  $('#quit').onclick=()=>{EX=null;VIEW.skuska();};
}
function exDone(){
  const sc={P:0,R:0,E:0};EX.items.forEach(it=>{if(it.o[it.a]===it.q.ok)sc[TOP[it.q.t].a]++;});
  const tot=sc.P+sc.R+sc.E;
  let h=`<div class="card" style="text-align:center"><div class="big" style="color:${tot>=12?'var(--green)':tot>=9?'var(--amber)':'var(--red)'}">${tot} / 15</div><p class="muted">${tot>=12?'Skvelé – takto to na skúške zvládneš.':tot>=9?'Slušné, doplň slabé témy.':'Ešte to chce opakovanie – pozri chyby nižšie.'}</p></div>
  <div class="card">${['P','R','E'].map(a=>`<div class="res"><span>${AREAS[a].name}</span><b>${sc[a]} / 5</b></div>`).join('')}</div><h3>Prehľad odpovedí</h3>`;
  h+=EX.items.map(it=>{const ok=it.o[it.a]===it.q.ok;const t=TOP[it.q.t];return `<div class="rev"><span class="${ok?'y':'n'}">${ok?'✓':'✗'}</span> <b>${t.a}${t.n}</b> ${esc(it.q.q)}<br>${ok?'':`<span class="n">Tvoja: ${esc(it.o[it.a])}</span><br>`}<span class="y">Správne: ${esc(it.q.ok)}</span> · <button class="link" data-t="${t.id}">ťahák</button></div>`;}).join('');
  h+=`<div class="btns"><button class="btn" id="nw" style="flex:1">Nový test</button><button class="btn ghost" id="bk" style="flex:1">Späť</button></div>`;
  main.innerHTML=h;
  main.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{EX=null;go('tahak',{open:b.dataset.t});});
  $('#nw').onclick=()=>{EX=null;VIEW.skuska();$('#w').click();};
  $('#bk').onclick=()=>{EX=null;VIEW.skuska();};
}
function renderOral(){
  let h=`<h2>Vylosované témy</h2><p class="muted">Ku každej téme povedz nahlas aspoň 3 fakty. Potom ťukni, pozri ťahák a ohodnoť sa.</p>`;
  EX.list.forEach((ts,ai)=>{const a=['P','R','E'][ai];
    h+=`<h3><span class="tag" style="background:${AREAS[a].color}">${AREAS[a].name}</span></h3>`+ts.map(t=>{const s=EX.score[t.id];const op=EX.open===t.id;
      return `<div class="card topic ${op?'open':''}"><button data-t="${t.id}"><span class="num" style="background:${AREAS[a].color}">${t.n}</span><span class="tt">${esc(t.t)}</span><span class="mast">${s===1?'✅':s===0?'❌':'👀'}</span></button>
      <div class="body"><div class="key">${t.k}</div><ul>${t.b.map(x=>`<li>${x}</li>`).join('')}</ul>${t.sym?`<div class="symgrid">${SYMBOLS.map(s=>`<div>${s.s}${esc(s.n)}</div>`).join('')}</div>`:''}
      <div class="btns"><button class="btn red" data-s="${t.id}|0" style="flex:1">Nevedel som</button><button class="btn" data-s="${t.id}|1" style="flex:1;background:var(--green)">Vedel som</button></div></div></div>`;}).join('');});
  const sc=Object.values(EX.score);
  h+=`<div class="card"><b>Výsledok: ${sc.filter(x=>x===1).length} / 15 vedel</b></div><div class="btns"><button class="btn" id="nw" style="flex:1">Vylosovať znova</button><button class="btn ghost" id="bk" style="flex:1">Späť</button></div>`;
  main.innerHTML=h;
  main.querySelectorAll('.topic>button').forEach(b=>b.onclick=()=>{EX.open=EX.open===b.dataset.t?null:b.dataset.t;renderOral();const el=b.closest('.topic');});
  main.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const [id,v]=b.dataset.s.split('|');EX.score[id]=+v;EX.open=null;renderOral();});
  $('#nw').onclick=()=>{EX=null;VIEW.skuska();$('#o').click();};
  $('#bk').onclick=()=>{EX=null;VIEW.skuska();};
}

go('plan');
})();

</script>
</body>
</html>
