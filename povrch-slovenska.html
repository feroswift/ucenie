<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Povrch Slovenska</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: zošit na štvorčeky, slepá mapa ako hlavná plocha, ovládanie pod ňou */
:root{
  --paper:#FFFFFF; --grid:#E1E7F1; --ink:#2336A8; --onink:#FFFFFF;
  --text:#1E2233; --muted:#596077; --card:#FFFFFF; --line:#C9D2E3;
  --mapbg:#F3F6FB; --land:#FFFDF6; --landline:#2B2F45; --border:#A3ABBE; --river:#3F7FD6;
  --mtn:#E9C8A2; --mtnline:#94622F; --low:#BFE2C5; --lowline:#3B8552;
  --target:#FFE45C; --okfill:#8FD9AE; --badfill:#F5A7A7; --label:#2B2F45;
  --mint:#7FD8C4; --yellow:#FFE45C;
  --green:#1F8A57; --greenbg:#DDF5E8; --red:#C93C3C; --redbg:#FCE3E3;
  --display:Caveat,"Comic Sans MS",cursive; --body:Nunito,"Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161925; --grid:#222738; --ink:#9AABFF; --onink:#111420;
    --text:#ECEFF6; --muted:#A6ADBE; --card:#1E2231; --line:#363D52;
    --mapbg:#1A1E2B; --land:#262B3C; --landline:#C9CFE0; --border:#5A6278; --river:#6FA3EE;
    --mtn:#6E5035; --mtnline:#D7A06A; --low:#2D5B3C; --lowline:#7BCB92;
    --target:#E2C42A; --okfill:#2F8F5B; --badfill:#9A3B3B; --label:#F1F3F9;
    --mint:#2F8C78; --yellow:#C9AE22;
    --green:#56D094; --greenbg:#173A2B; --red:#F07A7A; --redbg:#3E1F25; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#161925; --grid:#222738; --ink:#9AABFF; --onink:#111420;
  --text:#ECEFF6; --muted:#A6ADBE; --card:#1E2231; --line:#363D52;
  --mapbg:#1A1E2B; --land:#262B3C; --landline:#C9CFE0; --border:#5A6278; --river:#6FA3EE;
  --mtn:#6E5035; --mtnline:#D7A06A; --low:#2D5B3C; --lowline:#7BCB92;
  --target:#E2C42A; --okfill:#2F8F5B; --badfill:#9A3B3B; --label:#F1F3F9;
  --mint:#2F8C78; --yellow:#C9AE22;
  --green:#56D094; --greenbg:#173A2B; --red:#F07A7A; --redbg:#3E1F25; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--text);font-family:var(--body);font-size:17px;line-height:1.45;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px}
main{max-width:980px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1,h2{text-wrap:balance}

.hero{margin:14px 4px 22px}
.eyebrow{margin:0;color:var(--muted);font-weight:800;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
.hero h1{font-family:var(--display);font-weight:700;font-size:3.6rem;line-height:1;color:var(--ink);margin:6px 0 0;transform:rotate(-2deg);transform-origin:left}
.hero p.sub{margin:10px 0 0;color:var(--muted)}
.hl{padding:0 6px;background:linear-gradient(transparent 50%,var(--mint) 50%,var(--mint) 92%,transparent 92%);box-decoration-break:clone;-webkit-box-decoration-break:clone}

.lbl{font-weight:800;margin:0 0 8px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:800}
.chip small{color:var(--muted);font-weight:700;margin-left:4px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--onink)}
.chip[aria-pressed="true"] small{color:var(--onink);opacity:.8}

.acts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.act{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px;border-radius:18px;border:2px solid var(--line);background:var(--card)}
.act:hover{border-color:var(--ink)}
.act h2{font-family:var(--display);font-size:2rem;line-height:1.05;margin:0;color:var(--ink)}
.act p{margin:0;color:var(--muted)}
.act .best{margin-top:auto;padding-top:6px;font-weight:800;color:var(--text);font-size:.95rem}
.note{color:var(--muted);margin:20px 4px 0;font-size:.95rem}

.bar{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.x{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.1rem;flex:none}
.prog{flex:1;height:14px;border-radius:8px;background:var(--line);overflow:hidden}
.prog div{height:100%;background:var(--ink);border-radius:8px;transition:width .3s ease}
.bar h2{margin:0;font-family:var(--display);font-size:2rem;flex:1;min-width:0}

.ask{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:0 2px 10px}
.ask .q{margin:0;color:var(--muted);font-weight:800}
.ask .big{margin:0;font-family:var(--display);font-size:2.5rem;line-height:1;color:var(--ink);font-weight:700}
.again{display:inline-block;padding:2px 10px;border-radius:8px;background:var(--yellow);color:#1E2233;font-weight:800;font-size:.85rem}

.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.zoom{display:flex;align-items:center;gap:6px;margin-left:auto}
.zb{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:1.2rem}
.zb:disabled{opacity:.4;cursor:default}
.zl{min-width:3.4em;text-align:center;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.95rem}
.tog{padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800}
.tog[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.hint{color:var(--muted);font-size:.95rem;margin:0}

.mapwrap{overflow:auto;max-height:min(72vh,660px);border:2px solid var(--line);border-radius:16px;background:var(--mapbg);touch-action:pan-x pan-y pinch-zoom}
.map{display:block;width:100%;height:auto;aspect-ratio:var(--ar);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.map .land{fill:var(--land)}
.map .edge{fill:none;stroke:var(--landline);stroke-width:2;stroke-linejoin:round;pointer-events:none}
.map .borders{fill:none;stroke:var(--border);stroke-width:1.3;stroke-dasharray:6 4;pointer-events:none}
.map .riv{fill:none;stroke:var(--river);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;opacity:.75;pointer-events:none}
.map .cty{fill:var(--muted);font:800 13px var(--body);letter-spacing:.25em;opacity:.7;pointer-events:none}
.rg{stroke-width:1.3;cursor:pointer;transition:fill .15s}
.rg.p{fill:var(--mtn);stroke:var(--mtnline)}
.rg.n{fill:var(--low);stroke:var(--lowline)}
.rg.off{opacity:.28;cursor:default}
.rg.sel,.rg.target{fill:var(--target);stroke:var(--ink);stroke-width:3}
.rg.target{animation:pulse 1.1s ease-in-out infinite}
.rg.ok{fill:var(--okfill);stroke:var(--green);stroke-width:3}
.rg.bad{fill:var(--badfill);stroke:var(--red);stroke-width:3}
@keyframes pulse{50%{stroke-width:7}}
@media (hover:hover){.map.live .rg:not(.off):not(.ok):not(.bad):not(.target):not(.sel):hover{filter:brightness(1.06);stroke-width:2.5}}
.tl{font:800 15px var(--body);fill:var(--label);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.tl.off{opacity:.35}
.tn{font:700 10.5px var(--body);fill:var(--label);text-anchor:middle;paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none}

.info{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border-radius:14px;border:2px dashed var(--line);background:var(--card);margin-bottom:10px}
.info.on{border-style:solid;border-color:var(--ink)}
.badge{flex:none;min-width:42px;height:42px;padding:0 8px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1.2rem;border:2px solid var(--mtnline);background:var(--mtn);color:var(--label)}
.badge.n{border-color:var(--lowline);background:var(--low)}
.info .nm{font-family:var(--display);font-size:1.9rem;line-height:1;font-weight:700}
.info .ty{color:var(--muted);font-size:.92rem}

.legend{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:18px}
.legend h3{margin:0 0 8px;font-size:1rem}
.legend ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.legend button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 8px;border-radius:10px;border:2px solid transparent;background:transparent}
.legend button:hover{border-color:var(--line);background:var(--card)}
.legend button[aria-pressed="true"]{border-color:var(--ink);background:var(--card)}
.legend .badge{min-width:32px;height:32px;font-size:.95rem;border-radius:9px}

.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:12px}
.opt{min-height:58px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:1.05rem;text-align:left}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--greenbg)}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
@media (max-width:420px){.opts{grid-template-columns:1fr}.opt{min-height:50px}}

.fb{margin-top:12px;padding:14px 16px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fb.ok{background:var(--greenbg);border:2px solid var(--green)}
.fb.no{background:var(--redbg);border:2px solid var(--red)}
.fb p{margin:0;font-weight:700;min-width:0;flex:1 1 220px}
.btn{padding:12px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:800}
.btn.primary{background:var(--ink);color:var(--onink)}

.end{text-align:center;padding-top:26px}
.stars{font-size:3rem;letter-spacing:6px}
.end h2{font-family:var(--display);font-size:3rem;color:var(--ink);margin:8px 0 4px}
.score{font-size:1.25rem;font-weight:800;margin:0 0 18px}
.miss{max-width:520px;margin:0 auto 22px;text-align:left;padding:14px 18px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.miss h3{margin:0 0 6px;font-size:1rem}
.miss ul{margin:0;padding-left:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){.rg.target{animation:none;stroke-width:5}.prog div{transition:none}}
@media (max-width:520px){.hero h1{font-size:3rem}.ask .big{font-size:2.1rem}}
</style>
</head>

  const g=r.g;
  if(g.t==="e"){
    const a=-g.rot*Math.PI/180, dx=x-g.cx, dy=y-g.cy;
    const xr=dx*Math.cos(a)-dy*Math.sin(a), yr=dx*Math.sin(a)+dy*Math.cos(a);
    const d=Math.hypot(xr/g.rx,yr/g.ry), dist=Math.hypot(dx,dy);
    let inside=d<=1; if(inside&&r.k==="n"&&!inPoly(OUTLINE,x,y))inside=false;
    return [inside, d<=1?0:dist*(1-1/d)];
  }
  if(inPoly(g.pts,x,y)&&inPoly(OUTLINE,x,y)) return [true,0];
  let m=1e9; g.pts.forEach((p,i)=>{m=Math.min(m,segDist(x,y,p,g.pts[(i+1)%g.pts.length]))}); return [false,m];
}
function pickAt(x,y,ids,tol){
  let best=null,bestA=1e12,near=null,nearD=tol;
  ids.forEach(id=>{const r=BY[id],[inside,d]=measure(r,x,y);
    if(inside&&r.area<bestA){best=id;bestA=r.area}
    else if(!inside&&d<nearD){near=id;nearD=d}});
  return best||near;
}

/* ===== pamäť (len v tomto prehliadači) ===== */
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const stats=()=>load("povrch-stats",{});
function note(id,ok){const s=stats();s[id]=s[id]||{r:0,w:0};ok?s[id].r++:s[id].w++;save("povrch-stats",s)}
const bestKey=(m,s)=>`povrch-best-${m}-${s}`;

/* ===== pomocné ===== */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const PRAISE=["Správne!","Výborne!","Presne tak!","Super!","Paráda!"];
const badge=(r,cls="")=>`<span class="badge ${r.k==="n"?"n":""} ${cls}">${esc(r.id)}</span>`;

/* ===== mapa ===== */
let ZOOM=null; const ZL=[1,1.5,2,3];
function mapMarkup(active,names){
  const on=new Set(active);
  const sh=r=>{const g=r.g,cls=`rg ${r.k}${on.has(r.id)?"":" off"}`;
    return g.t==="e"
      ?`<ellipse class="${cls}" data-id="${r.id}" cx="${g.cx}" cy="${g.cy}" rx="${g.rx}" ry="${g.ry}" transform="rotate(${g.rot} ${g.cx} ${g.cy})"/>`
      :`<path class="${cls}" data-id="${r.id}" d="${g.d}"/>`};
  const poly=REG.filter(r=>r.g.t==="p"), mtn=REG.filter(r=>r.k==="p"), bas=REG.filter(r=>r.k==="n"&&r.g.t==="e");
  const tl=r=>`<text class="tl${on.has(r.id)?"":" off"}" data-for="${r.id}" x="${r.c[0]}" y="${r.c[1]}">${esc(r.id)}</text>`
    +(names&&on.has(r.id)?`<text class="tn" x="${r.c[0]}" y="${r.c[1]+(r.g.t==="e"?Math.min(r.g.rx,r.g.ry)+12:22)}">${esc(r.n)}</text>`:"");
  return `<svg class="map live" viewBox="${VB.join(" ")}" style="--ar:${VB[2]}/${VB[3]}" role="img" aria-label="Slepá mapa Slovenska">
    <defs><clipPath id="sk"><path d="${GEO.outline}"/></clipPath></defs>
    <path class="borders" d="${GEO.borders}"/>
    <path class="land" d="${GEO.outline}"/>
    <g clip-path="url(#sk)">${poly.map(sh).join("")}</g>
    <path class="riv" d="${GEO.riv}" clip-path="url(#sk)"/>
    <g>${mtn.map(sh).join("")}</g>
    <g clip-path="url(#sk)">${bas.map(sh).join("")}</g>
    <path class="edge" d="${GEO.outline}"/>
    ${GEO.countries.map(c=>`<text class="cty" x="${c.x}" y="${c.y}" text-anchor="middle"${c.r?` transform="rotate(${c.r} ${c.x} ${c.y})"`:""}>${c.t}</text>`).join("")}
    <g>${REG.map(tl).join("")}</g>
  </svg>`;
}
function toolsMarkup(extra=""){
  return `<div class="tools">${extra}<div class="zoom" role="group" aria-label="Priblíženie mapy">
    <button class="zb" data-act="zout" aria-label="Oddialiť">−</button><span class="zl" id="zl"></span>
    <button class="zb" data-act="zin" aria-label="Priblížiť">+</button></div></div>`;
}
function mountMap(onPick){
  const wrap=app.querySelector(".mapwrap"), svg=wrap.querySelector("svg");
  if(ZOOM===null) ZOOM = wrap.clientWidth<620?2:1;
  applyZoom(ZOOM,false);
  svg.addEventListener("click",e=>{
    if(!onPick)return;
    const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
    const q=p.matrixTransform(svg.getScreenCTM().inverse());
    const scale=svg.getBoundingClientRect().width/VB[2];
    const id=pickAt(q.x,q.y,S.active,24/scale);
    if(id)onPick(id);
  });
}
function applyZoom(z,keep=true){
  const wrap=app.querySelector(".mapwrap");if(!wrap)return;
  const svg=wrap.querySelector("svg");
  const fx=keep&&wrap.scrollWidth?(wrap.scrollLeft+wrap.clientWidth/2)/wrap.scrollWidth:.5;
  const fy=keep&&wrap.scrollHeight?(wrap.scrollTop+wrap.clientHeight/2)/wrap.scrollHeight:.5;
  ZOOM=z; svg.style.width=(z*100)+"%";
  wrap.scrollLeft=fx*wrap.scrollWidth-wrap.clientWidth/2;
  wrap.scrollTop=fy*wrap.scrollHeight-wrap.clientHeight/2;
  const i=ZL.indexOf(z);
  const zl=document.getElementById("zl"); if(zl)zl.textContent=Math.round(z*100)+" %";
  app.querySelectorAll('[data-act="zout"]').forEach(b=>b.disabled=i<=0);
  app.querySelectorAll('[data-act="zin"]').forEach(b=>b.disabled=i>=ZL.length-1);
}
function focusOn(id){
  const wrap=app.querySelector(".mapwrap");if(!wrap)return;
  const svg=wrap.querySelector("svg"), s=svg.clientWidth/VB[2], r=BY[id];
  const x=r.c[0]*s, y=r.c[1]*s, m=60;
  const vis=x>wrap.scrollLeft+m&&x<wrap.scrollLeft+wrap.clientWidth-m&&y>wrap.scrollTop+m&&y<wrap.scrollTop+wrap.clientHeight-m;
  if(!vis) wrap.scrollTo({left:x-wrap.clientWidth/2,top:y-wrap.clientHeight/2,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
function mark(id,cls){app.querySelectorAll(`.rg[data-id="${id}"]`).forEach(el=>el.classList.add(cls))}
function clearMarks(){app.querySelectorAll(".rg").forEach(el=>el.classList.remove("sel","target","ok","bad"))}

/* ===== obrazovky ===== */
const app=document.getElementById("app");
let SET=load("povrch-set","pohoria"); if(!SETS[SET])SET="pohoria";
let S={active:[]};

function home(){
  S={active:[]};
  const sets=Object.entries(SETS).map(([k,s])=>`<button class="chip" data-act="set" data-k="${k}" aria-pressed="${k===SET}">${s.label}<small>${s.ids.length}</small></button>`).join("");
  const best=m=>{const b=load(bestKey(m,SET),0);return b?`Najlepšie: ${b} z ${SETS[SET].count}`:"Ešte nehrané"};
  app.innerHTML=`<header class="hero"><p class="eyebrow">Zemepis</p><h1><span class="hl">Povrch Slovenska</span></h1>
    <p class="sub">Pohoria, nížiny a kotliny na slepej mape</p></header>
    <p class="lbl">Čo sa učíme</p><div class="sets" role="group" aria-label="Okruh">${sets}</div>
    <div class="acts">
      <button class="act" data-act="learn"><h2>Prezri si mapu</h2><p>Ťukni na miesto na mape a uvidíš jeho názov. Dole je zoznam ako na pracovnom liste.</p><span class="best">Na učenie</span></button>
      <button class="act" data-act="quiz" data-m="find"><h2>${MODES.find.title}</h2><p>${MODES.find.desc}</p><span class="best">${best("find")}</span></button>
      <button class="act" data-act="quiz" data-m="name"><h2>${MODES.name.title}</h2><p>${MODES.name.desc}</p><span class="best">${best("name")}</span></button>
    </div>
    <p class="note">Písmená a čísla na mape sú rovnaké ako na pracovnom liste. Častejšie sa pýtam na to, čo ti ešte nejde.</p>`;
  window.scrollTo(0,0);
}

function learn(){
  S={mode:"learn",active:SETS[SET].ids,names:false,sel:null};
  renderLearn();
}
function renderLearn(){
  const groups=[["Pohoria","p"],["Nížiny a kotliny","n"]].map(([t,k])=>{
    const ids=S.active.filter(id=>BY[id].k===k); if(!ids.length)return "";
    return `<section><h3>${t}</h3><ol>${ids.map(id=>{const r=BY[id];
      return `<li><button data-act="pick" data-id="${id}" aria-pressed="${S.sel===id}">${badge(r)}<span>${esc(r.n)}</span></button></li>`}).join("")}</ol></section>`}).join("");
  app.innerHTML=`<div class="bar"><button class="x" data-act="home" aria-label="Späť na začiatok">✕</button><h2>Prezri si mapu</h2></div>
    <div class="info" id="info"></div>
    ${toolsMarkup(`<button class="tog" data-act="names" aria-pressed="${S.names}">Názvy na mape</button>`)}
    <div class="mapwrap">${mapMarkup(S.active,S.names)}</div>
    <div class="legend">${groups}</div>`;
  mountMap(id=>select(id,false));
  if(S.sel)select(S.sel,false); else showInfo(null);
}
function showInfo(r){
  const el=document.getElementById("info");
  if(!r){el.className="info";el.innerHTML=`<p class="hint">Ťukni na pohorie alebo kotlinu na mape, alebo vyber názov zo zoznamu.</p>`;return}
  el.className="info on";
  el.innerHTML=`${badge(r)}<div><div class="nm">${esc(r.n)}</div><div class="ty">${typ(r.n)}${r.alt?" · "+esc(r.alt):""}</div></div>`;
}
function select(id,scroll){
  S.sel=id; clearMarks(); mark(id,"sel"); showInfo(BY[id]);
  app.querySelectorAll('.legend button').forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.id===id)));
  if(scroll)focusOn(id);
}

function startQuiz(m){
  const set=SETS[SET], st=stats();
  const ids=set.ids.map(id=>{const s=st[id]||{r:0,w:0};return {id,v:Math.random()*1.2+s.w*.5-Math.min(s.r,5)*.25}})
    .sort((a,b)=>b.v-a.v).slice(0,set.count).map(o=>o.id);
  S={mode:m,active:set.ids,queue:shuffle(ids).map(id=>({id,retry:false})),i:0,score:0,done:false,missed:[]};
  renderQ();
}
function optionsFor(id){
  const r=BY[id], same=S.active.filter(x=>x!==id&&BY[x].k===r.k);
  const near=same.slice().sort((a,b)=>dist(r.c,BY[a].c)-dist(r.c,BY[b].c)).slice(0,4);
  const two=shuffle(near).slice(0,2), one=shuffle(same.filter(x=>!two.includes(x))).slice(0,1);
  return shuffle([id,...two,...one]);
}
function renderQ(){
  const q=S.queue[S.i], r=BY[q.id], total=S.queue.length, pct=Math.round(S.i/total*100);
  S.done=false;
  if(S.mode==="name"&&!q.opts)q.opts=optionsFor(q.id);
  const ask=S.mode==="find"
    ?`<p class="q">Nájdi na mape</p><p class="big">${esc(r.n)}</p>`
    :`<p class="q">Čo je na mape vysvietené?</p>`;
  app.innerHTML=`<div class="bar"><button class="x" data-act="home" aria-label="Späť na začiatok">✕</button>
      <div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div></div>
    <div class="ask">${q.retry?`<span class="again">Ešte raz</span>`:""}${ask}</div>
    ${toolsMarkup(S.mode==="find"?`<p class="hint">Ťukni na správne miesto.</p>`:"")}
    <div class="mapwrap">${mapMarkup(S.active,false)}</div>
    ${S.mode==="name"?`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-act="opt" data-i="${i}">${esc(BY[o].n)}</button>`).join("")}</div>`:""}
    <div id="fb" aria-live="polite"></div>`;
  mountMap(S.mode==="find"?answerFind:null);
  if(S.mode==="name"){mark(q.id,"target");requestAnimationFrame(()=>focusOn(q.id))}
}
function feedback(ok,text){
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><p>${text}</p><button class="btn primary" data-act="next">Ďalej</button></div>`;
  const b=app.querySelector('[data-act="next"]'); b.focus({preventScroll:true});
}
function settle(ok){
  const q=S.queue[S.i];
  if(ok&&!q.retry)S.score++;
  if(!q.retry)note(q.id,ok);
  if(!ok){S.queue.push({id:q.id,retry:true});if(!S.missed.includes(q.id))S.missed.push(q.id)}
  app.querySelector(".map").classList.remove("live");
}
function answerFind(id){
  if(S.done)return; S.done=true;
  const q=S.queue[S.i], ok=id===q.id; clearMarks();
  if(ok){mark(id,"ok");feedback(true,`${PRAISE[Math.floor(Math.random()*PRAISE.length)]} Toto je ${esc(BY[id].n)}.`)}
  else{mark(id,"bad");mark(q.id,"ok");focusOn(q.id);
    feedback(false,`Ťukla si na: ${esc(BY[id].n)} (${esc(id)}). ${esc(BY[q.id].n)} je zelené (${esc(q.id)}).`)}
  settle(ok);
}
function answerName(i){
  if(S.done)return; S.done=true;
  const q=S.queue[S.i], pick=q.opts[i], ok=pick===q.id;
  app.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.id)b.classList.add("right");else if(j===i)b.classList.add("wrong")});
  clearMarks(); mark(q.id,ok?"ok":"bad");
  feedback(ok,ok?`${PRAISE[Math.floor(Math.random()*PRAISE.length)]}`:`Správne je: ${esc(BY[q.id].n)} (${esc(q.id)}).`);
  settle(ok);
}
function next(){S.i++; if(S.i>=S.queue.length)end(); else{renderQ();window.scrollTo({top:0})}}
function end(){
  const n=SETS[SET].count, s=S.score, k=bestKey(S.mode,SET);
  if(s>load(k,0))save(k,s);
  const stars=s>=n*.9?3:s>=n*.6?2:1;
  const msg=stars===3?"Výborne!":stars===2?"Dobrá práca!":"Ide ti to, skús znova!";
  app.innerHTML=`<div class="end"><div class="stars" aria-label="${stars} z 3 hviezd">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
    <h2>${msg}</h2><p class="score">Na prvý pokus správne: ${s} z ${n}</p>
    ${S.missed.length?`<div class="miss"><h3>Ešte potrénuj</h3><ul>${S.missed.map(id=>`<li>${esc(BY[id].n)} (${esc(id)})</li>`).join("")}</ul></div>`:""}
    <div class="row"><button class="btn primary" data-act="quiz" data-m="${S.mode}">Hrať znova</button><button class="btn" data-act="home">Späť na začiatok</button></div></div>`;
  window.scrollTo(0,0);
}

app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const a=b.dataset.act;
  if(a==="set"){SET=b.dataset.k;save("povrch-set",SET);home()}
  else if(a==="learn")learn();
  else if(a==="quiz")startQuiz(b.dataset.m);
  else if(a==="home")home();
  else if(a==="opt")answerName(+b.dataset.i);
  else if(a==="next")next();
  else if(a==="pick")select(b.dataset.id,true);
  else if(a==="names"){S.names=!S.names;renderLearn()}
  else if(a==="zin"){const i=ZL.indexOf(ZOOM);if(i<ZL.length-1)applyZoom(ZL[i+1])}
  else if(a==="zout"){const i=ZL.indexOf(ZOOM);if(i>0)applyZoom(ZL[i-1])}
});

home();
</script>
<script>
/* Odkaz späť na rozcestník Učíme sa hravo (len na webe) */
(function(){
  if(!/^https?:$/.test(location.protocol))return;
  var css=document.createElement("style");
  css.textContent='.hub-back{display:inline-flex;align-items:center;margin:0 0 12px;padding:5px 12px 5px 9px;border-radius:999px;border:1.5px solid currentColor;color:inherit;opacity:.7;font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;text-decoration:none;transform:none;position:relative;z-index:1}.hub-back:focus-visible{outline:3px solid currentColor;outline-offset:2px}';
  document.head.appendChild(css);
  var T=[[".hero",0],["#home",0],["h1.hello",1]];
  function place(){
    for(var i=0;i<T.length;i++){
      var el=document.querySelector(T[i][0]);if(!el)continue;
      var box=T[i][1]?document.getElementById("app"):el;
      if(!box)return;
      var f=box.firstElementChild;if(f&&f.classList.contains("hub-back"))return;
      var a=document.createElement("a");a.className="hub-back";a.href="./";a.textContent="‹ Všetky appky";
      box.insertBefore(a,box.firstChild);return;
    }
  }
  place();new MutationObserver(place).observe(document.body,{childList:true,subtree:true});
})();
</script>
