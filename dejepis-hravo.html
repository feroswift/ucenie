<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dejepis hravo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --grid:#EEE3DA; --ink:#A3312A; --onink:#FFFFFF;
  --text:#2A1E1B; --muted:#6E5F5A; --card:#FFFFFF; --line:#DCCFC6;
  --yellow:#FFE45C; --pink:#FFB59E; --green:#1F8A57; --greenbg:#DDF5E8; --red:#C93C3C; --redbg:#FCE3E3;
  --mark:#FFE45C; --mark2:#FFB59E;
  --sea:#CFE5F3; --land:#F1EADB; --border:#BFB39C; --gold:#E9B949; --route:#7B3FA0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1A1716; --grid:#2A2422; --ink:#FF9B88; --onink:#1A1110;
    --text:#F2ECE9; --muted:#B5A8A3; --card:#24201E; --line:#41383A;
    --yellow:#C9AE22; --pink:#B8644F; --green:#56D094; --greenbg:#173A2B; --red:#F07A7A; --redbg:#3E1F25;
    --mark:#6E5B14; --mark2:#7A3A2C;
    --sea:#1C2E3E; --land:#3A3530; --border:#5E554B; --gold:#D8A93A; --route:#C79BE6;
  }
}
:root[data-theme="dark"]{
  --paper:#1A1716; --grid:#2A2422; --ink:#FF9B88; --onink:#1A1110;
  --text:#F2ECE9; --muted:#B5A8A3; --card:#24201E; --line:#41383A;
  --yellow:#C9AE22; --pink:#B8644F; --green:#56D094; --greenbg:#173A2B; --red:#F07A7A; --redbg:#3E1F25;
  --mark:#6E5B14; --mark2:#7A3A2C;
  --sea:#1C2E3E; --land:#3A3530; --border:#5E554B; --gold:#D8A93A; --route:#C79BE6;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:Nunito, "Segoe UI", system-ui, -apple-system, sans-serif; font-size:17px; line-height:1.45;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
main{max-width:600px;margin:0 auto;padding:20px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

.hero{margin:18px 4px 24px}
.hero h1{font-family:Caveat, "Comic Sans MS", cursive;font-weight:700;font-size:3.6rem;line-height:1;color:var(--ink);margin:0;transform:rotate(-2deg);transform-origin:left}
.hero p{margin:10px 0 0;color:var(--muted)}

.topic{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px 18px 18px;margin-bottom:16px}
.topic .emo{position:absolute;right:16px;top:12px;font-size:2.4rem}
.topic h2{font-family:Caveat, cursive;font-size:2.3rem;line-height:1.1;margin:0 56px 4px 0;font-weight:700}
.hl{padding:0 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hl-yellow{background:linear-gradient(transparent 50%,var(--mark) 50%,var(--mark) 92%,transparent 92%)}
.hl-pink{background:linear-gradient(transparent 50%,var(--mark2) 50%,var(--mark2) 92%,transparent 92%)}
.meta{margin:0 0 14px;color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);min-height:64px}
.mode .me{font-size:1.6rem;flex:none}
.mode b{display:block;font-weight:800;line-height:1.2;white-space:nowrap}
.mode small{display:block;color:var(--muted);font-size:.85rem;line-height:1.25}
.mode.main{grid-column:1/-1;background:var(--ink);border-color:var(--ink);color:var(--onink)}
.mode.main small{color:inherit;opacity:.85}
.mode.err{grid-column:1/-1;border-color:var(--red);background:var(--redbg)}
.row{display:flex;gap:10px;flex-wrap:wrap}

.btn{padding:12px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:800}
.btn.primary{background:var(--ink);color:var(--onink)}
.btn.ghost{border-color:var(--line);color:var(--text)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:default}

.bar{display:flex;align-items:center;gap:12px;margin:6px 0 22px}
.x{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.1rem;flex:none}
.prog{flex:1;height:14px;border-radius:8px;background:var(--line);overflow:hidden}
.prog div{height:100%;background:var(--ink);border-radius:8px;transition:width .3s ease}
.cnt{font-weight:800;color:var(--muted);flex:none}

/* Učím sa */
.dots{flex:1;display:flex;gap:5px;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--card);padding:0}
.dot.on{background:var(--ink);border-color:var(--ink)}
.dot.seen{border-color:var(--ink)}
.lcard{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-bottom:16px}
.lemo{position:absolute;right:14px;top:10px;font-size:2.6rem}
.lcard h2{font-family:Caveat, cursive;font-size:2.3rem;line-height:1.1;margin:0 60px 8px 0}
.year{display:inline-block;margin:0 0 6px;padding:2px 10px;border-radius:8px;background:var(--ink);color:var(--onink);font-weight:800;font-size:.95rem}
.pts{margin:6px 0 0;padding-left:1.2em}
.pts li{margin:0 0 8px}
.pts li::marker{color:var(--ink)}
.pts b{background:linear-gradient(transparent 55%,var(--mark) 55%,var(--mark) 92%,transparent 92%);padding:0 2px}
.extra{margin-top:12px;padding:10px 12px;border-radius:12px;border:2px dashed var(--line);color:var(--muted);font-size:.95rem}
.extra b{color:var(--text)}
.lnav{display:flex;gap:10px;margin-bottom:12px}
.lnav .btn{flex:1}
.tryme{width:100%}

/* Kvíz */
.q{margin-bottom:18px}
.again{display:inline-block;margin:0 0 10px;padding:2px 10px;border-radius:8px;background:var(--yellow);color:#1E2233;font-weight:700;font-size:.9rem}
.tag{display:inline-block;margin:0 0 8px;padding:2px 10px;border-radius:8px;border:2px solid var(--line);color:var(--muted);font-weight:700;font-size:.85rem}
.prompt{margin:0;font-size:1.35rem;font-weight:800;line-height:1.3}
.stmt{margin:0;font-family:Caveat, cursive;font-size:2.2rem;line-height:1.15;color:var(--ink);font-weight:700}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two .opt{text-align:center;min-height:72px;font-size:1.25rem}
.opt{min-height:58px;padding:12px 16px;text-align:left;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:1.08rem}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--greenbg)}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
.opt.right::after{content:" ✓";color:var(--green)}
.opt.wrong::after{content:" ✗";color:var(--red)}
.fb{margin-top:18px;padding:14px 16px;border-radius:14px}
.fb.ok{background:var(--greenbg);border:2px solid var(--green)}
.fb.no{background:var(--redbg);border:2px solid var(--red)}
.fb p{margin:0 0 6px;font-weight:800;font-size:1.1rem}
.fb .why{font-weight:600;font-size:1rem;margin:0 0 10px}
.fb .btn{width:100%;margin-top:4px}

.end{text-align:center;padding-top:24px}
.stars{font-size:3rem;letter-spacing:6px}
.end h2{font-family:Caveat, cursive;font-size:3rem;color:var(--ink);margin:8px 0 4px}
.score{font-size:1.25rem;font-weight:800;margin:0 0 20px}
.end .row{justify-content:center}
.missed{text-align:left;margin:0 0 22px;padding:14px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.missed h3{margin:0 0 8px;font-size:1rem;color:var(--muted)}
.missed li{margin:0 0 6px}
.missed ul{margin:0;padding-left:1.1em}

/* Spájačka */
.mhint{color:var(--muted);margin:0 0 14px}
.mgrid{display:grid;grid-template-columns:2fr 3fr;gap:10px}
.mcol{display:grid;gap:10px;align-content:start}
.mi{min-height:58px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;text-align:left;font-size:1rem;line-height:1.25;transition:opacity .3s}
.mi.term{font-weight:800}
.mi.sel{border-color:var(--ink);background:var(--yellow);color:#1E2233}
.mi.done{border-color:var(--green);background:var(--greenbg);opacity:.55}
.mi.bad{border-color:var(--red);background:var(--redbg)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Časová os */
.tl{list-style:none;margin:0 0 16px;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:17px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:2px}
.tl li{position:relative;display:flex;gap:12px;align-items:center;margin:0 0 8px;min-height:44px}
.tl .n{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;background:var(--card);border:2px solid var(--line);z-index:1}
.tl li.f .n{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.tl .t{flex:1;padding:8px 12px;border-radius:12px;border:2px dashed var(--line);color:var(--muted)}
.tl li.f .t{border-style:solid;border-color:var(--green);background:var(--greenbg);color:var(--text);font-weight:700}
.tl .y{display:block;font-size:.85rem;color:var(--ink);font-weight:800}
.pool{display:grid;gap:10px}
.ev{min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;text-align:left;display:flex;gap:10px;align-items:center}
.ev .ee{font-size:1.5rem;flex:none}
.ev.bad{border-color:var(--red);background:var(--redbg)}
.ev .y{display:block;font-size:.85rem;color:var(--ink);font-weight:800}
.tip{margin:0 0 14px;padding:8px 12px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:.95rem;color:var(--muted)}
.tip b{color:var(--text)}
.msg{min-height:28px;margin:10px 0 0;font-weight:800}
.msg.no{color:var(--red)}
.msg.ok{color:var(--green)}

/* Mapa */
.mapwrap{margin:0 -8px 12px;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:var(--sea);touch-action:manipulation}
.map{display:block;width:100%;height:auto;-webkit-user-select:none;user-select:none}
.map .sea{fill:var(--sea)}
.map .c{fill:var(--land);stroke:var(--border);stroke-width:.8px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.map .c.hi{fill:var(--gold)}
.map .c.ok{fill:var(--green);fill-opacity:.55}
.map .c.show{fill:var(--red);fill-opacity:.55}
.map .alps{fill:#8B6B4A;fill-opacity:.38;stroke:#8B6B4A;stroke-opacity:.6;stroke-width:1px;pointer-events:none;vector-effect:non-scaling-stroke}
.map .alps.ok{fill:var(--green);fill-opacity:.6}
.map .alps.show{fill:var(--red);fill-opacity:.6}
.map .route{fill:none;stroke:var(--route);stroke-width:3.5px;stroke-dasharray:8 6;stroke-linecap:round;pointer-events:none;vector-effect:non-scaling-stroke}
.map .pt{fill:var(--ink);stroke:var(--paper);stroke-width:3;pointer-events:none}
.map .pt.ok{fill:var(--green)}
.map .pt.show{fill:var(--red)}
.map .lab{font-family:Caveat, cursive;font-weight:700;fill:var(--text);paint-order:stroke;stroke:var(--paper);stroke-width:5;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
.map .lab.sea-l{fill:#2C6E99;font-style:italic}
.map .ring{fill:none;stroke:var(--red);stroke-width:4;pointer-events:none;animation:pulse 1s ease-out 2}
@keyframes pulse{from{opacity:1}to{opacity:.2}}
.find{margin:0 0 10px}
.find .prompt{font-size:1.1rem;color:var(--muted);font-weight:700}
.find .big{margin:2px 0 0;font-family:Caveat, cursive;font-size:2.5rem;line-height:1.05;color:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0 14px;color:var(--muted);font-size:.95rem}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--gold)}
.legend .lr::before{background:none;border-top:3px dashed var(--route);height:0;border-radius:0;vertical-align:4px;width:18px}
.legend .la::before{background:#8B6B4A;opacity:.5}
.legend .lp::before{border-radius:50%;background:var(--ink)}
@media (prefers-reduced-motion: reduce){.prog div{transition:none}.shake,.map .ring{animation:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ============================================================
   DÁTA – každá téma (lekcia) je jeden objekt v TOPICS.
   Ďalšie témy z dejepisu sa pridajú ako ďalší objekt.
   ============================================================ */
const TOPICS=[{
  id:"rim-republika",
  title:"Rímska republika",
  years:"509 – 27 pred n. l.",
  e:"🏛️", color:"yellow",

  /* Kapitoly na čítanie (Učím sa) */
  chapters:[
    {id:"vznik", e:"👑", title:"Vznik republiky", year:"509 pred n. l.", map:{pts:["rim"],labels:["ITA"],view:[6,36.5,19,47]},
     pts:["V roku <b>509 pred n. l.</b> Rimania vyhnali posledného kráľa <b>Tarquinia Superba</b> (Pyšného).",
          "Skončilo sa <b>kráľovstvo</b> a vznikla <b>republika</b>.",
          "Rimania sa zaprisahali, že <b>kráľa už nechcú</b>.",
          "Vytvorili <b>nové orgány moci</b>.",
          "Republika trvala až do roku <b>27 pred n. l.</b>"],
     extra:"Niekde nájdeš aj rok 510 pred n. l. Najčastejšie sa uvádza <b>509 pred n. l.</b>"},
    {id:"moc", e:"⚖️", title:"Kto vládol v Ríme",
     pts:["Na čele Ríma stáli <b>dvaja konzuli</b>.",
          "Počas <b>vojny alebo krízy</b> vládol <b>diktátor</b>.",
          "Sprevádzalo ich <b>12 liktorov</b> – ochrancovia a pomocníci.",
          "<b>Senát</b> mal <b>300 členov</b>."],
     extra:"<b>Vieš, že…?</b> Liktori nosili zväzok prútov so sekerou. Na obrázku v prezentácii ich vidíš vedľa konzula."},
    {id:"obcania", e:"👥", title:"Patricijovia a plebejci",
     pts:["Občania sa delili na dve skupiny:",
          "<b>Patricijovia</b> – bohatí, mali moc, boli <b>senátormi</b>.",
          "<b>Plebejci</b> – chudobní, <b>nemali moc</b>.",
          "Plebejcom sa to nepáčilo – <b>odchádzali z Ríma</b> a vznikali <b>nepokoje</b>."]},
    {id:"zakony", e:"📜", title:"Zákony 12 tabúľ",
     pts:["Spočiatku boli zákony len <b>ústne (zvykové)</b>.",
          "Zákony 12 tabúľ boli výsledkom <b>boja plebejcov s patricijmi</b>.",
          "Plebejci chceli <b>jasne napísané zákony</b>, aby ich patricijovia nemohli zneužívať.",
          "Tabule boli <b>vystavené</b>, aby si ich mohol <b>každý prečítať</b>.",
          "Každý občan sa mohol <b>odvolať</b> proti rozhodnutiu úradu alebo súdu."],
     extra:"<b>Navyše:</b> zákony spísali okolo roku 450 pred n. l."},
    {id:"priklady", e:"🔍", title:"Čo hovorili zákony",
     pts:["<b>Oko za oko</b> – kto inému spôsobil ťažké zranenie, mohol byť potrestaný rovnako, alebo sa mohol <b>vyplatiť peniazmi</b>.",
          "<b>Pohreb</b> – ženy nesmeli nahlas nariekať ani si škriabať líca. Zákon obmedzoval <b>prepych a hlučné obrady</b>.",
          "<b>Krivá prísaha</b> – kto svedčil falošne, mohol byť zhodený z <b>Tarpejskej skaly</b>.",
          "<b>Nočná krádež</b> – zlodeja pristihnutého v noci mohli <b>beztrestne zabiť</b>.",
          "<b>Hraničné kamene</b> – kto úmyselne posunul hranicu pozemku, bol prísne potrestaný (hranice boli <b>posvätné</b>)."]},
    {id:"demokracia", e:"🗳️", title:"Rímska demokracia",
     pts:["Plebejci začali voliť <b>tribúnov ľudu</b> – svojich zástupcov.",
          "Tribúni ľudu <b>chránili plebejcov</b>, mali <b>právo veta</b> a boli <b>nedotknuteľní</b>.",
          "Občania sa schádzali na <b>ľudových zhromaždeniach</b> – schvaľovali rozhodnutia konzulov a senátu.",
          "<b>Res publica</b> = <b>vec verejná</b>."],
     extra:"<b>Vieš, že…?</b> Veto po latinsky znamená „zakazujem“. Nedotknuteľný = nikto mu nesmel ublížiť."},
    {id:"italia", e:"🛡️", title:"Ovládli celé Taliansko", year:"3. storočie pred n. l.", map:{hi:["ITA"],pts:["rim"],labels:["ITA","alpy"],alps:1,view:[4,36,20,48.2]},
     pts:["Najprv porazili susedné kmene – <b>Latinov, Sabinov a Etruskov</b>.",
          "Problémy im robili <b>Kelti</b>.",
          "V <b>3. storočí pred n. l.</b> už vládli <b>celej Itálii</b>."]},
    {id:"punske", e:"🐘", title:"Púnske vojny s Kartágom", year:"146 pred n. l.", map:{pts:["rim","kartago"],labels:["more"],route:1,alps:1,view:[-6,33,24,48]},
     pts:["Rím bojoval s bohatým mestom <b>Kartágo</b> (v dnešnom <b>Tunisku</b>).",
          "Najslávnejší kartáginský vojvodca bol <b>Hannibal</b> – prešiel cez <b>Alpy so slonmi</b>.",
          "Rím nakoniec <b>zvíťazil</b> a Kartágo bolo <b>zničené</b> v roku <b>146 pred n. l.</b>"],
     extra:"Fialová čiara na mape je <b>Hannibalova cesta</b> – zo Španielska cez Alpy až do Itálie (218 pred n. l.)."},
    {id:"velmoc", e:"🌍", title:"Rím – veľmoc", map:{hi:["ITA","GRC","EGY","ESP","FRA"],labels:["ITA","GRC","EGY","ESP","FRA","more"],pts:["rim"]},
     pts:["Rím ovládol <b>Grécko, Egypt, Španielsko, Galiu</b> (dnešné <b>Francúzsko</b>) a mnohé ďalšie územia.",
          "Z malej mestskej republiky sa stal <b>mocný štát okolo Stredozemného mora</b>."]},
    {id:"kriza", e:"🌾", title:"Kríza republiky",
     pts:["Po výbojoch sa zväčšovali <b>rozdiely medzi bohatými a chudobnými</b>.",
          "<b>Dovážané obilie bolo lacnejšie</b> ako rímske – roľníci ťažko predávali svoje.",
          "Bohatí patricijovia vlastnili <b>obrovské pozemky</b>, chudobní roľníci <b>strácali pôdu</b>.",
          "Preto chceli <b>štátnu pôdu prerozdeliť</b> medzi chudobných."],
     extra:"<b>Navyše:</b> o rozdelenie pôdy sa snažili bratia <b>Gracchovci</b> (tribúni ľudu)."},
    {id:"triumvirat", e:"🤝", title:"Triumvirát",
     pts:["Slovo <b>triumvirát</b> je z latinčiny a znamená <b>„vláda troch mužov“</b>.",
          "Tvorili ho: <b>Gaius Julius Caesar</b> – slávny vojvodca a politik, <b>Pompeius</b> – úspešný veliteľ, <b>Crassus</b> – najbohatší muž v Ríme.",
          "🟢 Spojili sa, získali všetku moc a <b>ovládli Rím</b>.",
          "🔴 Potom sa začali hádať o moc. Caesar a Pompeius sa stali nepriateľmi → <b>občianska vojna</b>, ktorú vyhral <b>Caesar</b>."]},
    {id:"koniec", e:"🗡️", title:"Koniec republiky", year:"44 pred n. l.",
     pts:["Caesar sa stal <b>diktátorom na doživotie</b>.",
          "Niektorí sa báli, že zruší republiku a stane sa <b>kráľom</b>.",

function mapSVG(o){
  o=o||{};
  let vx=0,vy=0,vw=G.W,vh=G.H;
  if(o.view){const a=fwd(o.view[0],o.view[3]),b=fwd(o.view[2],o.view[1]);vx=a[0];vy=a[1];vw=b[0]-a[0];vh=b[1]-a[1];}
  const k=vw/G.W, fs=o.view?Math.max(15,30*k*1.6):FS, pr=Math.max(5,9*k*(o.view?1.4:1));
  const hi=new Set(o.hi||[]);
  let s=`<svg class="map" viewBox="${vx.toFixed(1)} ${vy.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}" role="img" aria-label="Mapa okolia Stredozemného mora">`;
  s+=`<rect class="sea" x="${vx-50}" y="${vy-50}" width="${vw+100}" height="${vh+100}"/>`;
  s+=G.c.map(c=>`<path class="c${hi.has(c.id)?" hi":""}" data-id="${c.id}" d="${c.d}"/>`).join("");
  if(o.alps)s+=`<path class="alps" id="alps" d="${pd(ALPS)}Z"/>`;
  if(o.route)s+=`<path class="route" d="${pd(ROUTE)}"/>`;
  (o.pts||[]).forEach(p=>{const q=fwd(...PLACES[p]);s+=`<circle class="pt" id="pt-${p}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${pr.toFixed(1)}"/>`;});
  if(o.route){const a=fwd(5.8,46.9);s+=`<text x="${a[0]}" y="${a[1]}" font-size="${fs*1.25}" style="pointer-events:none">🐘</text>`;}
  const labs=[...(o.labels||[]),...(o.pts||[])];
  s+=`<g id="labs">`+labs.map(l=>labelSVG(l,fs)).join("")+`</g>`;
  return s+`</svg>`;
}
function labelSVG(l,fs){
  const L=LABELS[l];if(!L)return"";
  const q=fwd(L[0],L[1]);let dy=0,dx=0;
  if(l==="rim"){dy=-fs*.3;dx=-fs*1.15;}
  if(l==="kartago"){dy=-fs*.6;dx=fs*.2;}
  return `<text class="lab${l==="more"?" sea-l":""}" x="${(q[0]+dx).toFixed(1)}" y="${(q[1]+dy).toFixed(1)}" font-size="${fs.toFixed(1)}">${L[2]}</text>`;
}

/* zostavenie otázok z dát */
function questions(T){
  const out=[];
  T.mc.forEach((m,i)=>out.push({id:T.id+":mc"+i,type:"mc",ch:m[0],prompt:m[1],answer:m[2],opts:shuffle([m[2],...m[3]]),ex:m[4]||""}));
  T.tf.forEach((t,i)=>out.push({id:T.id+":tf"+i,type:"tf",ch:t[0],prompt:t[1],answer:t[2]?"Pravda":"Nepravda",opts:["Pravda","Nepravda"],ex:t[3]||""}));
  return out;
}
function weight(q){const r=DB.s[q.id];if(!r)return 2;return Math.max(.4,1+r[1]*1.5-r[0]*.4+(r[2]?0:2));}
function wpick(list,n){
  const pool=list.slice(),res=[];
  while(res.length<n&&pool.length){
    const tot=pool.reduce((a,q)=>a+weight(q),0);let r=Math.random()*tot,i=0;
    for(;i<pool.length;i++){r-=weight(pool[i]);if(r<=0)break;}
    res.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  return res;
}
function mistakes(T){return questions(T).filter(q=>DB.s[q.id]&&DB.s[q.id][2]===0);}
function chTitle(T,id){const c=T.chapters.find(c=>c.id===id);return c?c.title:"";}

function startQuiz(ti,kind,ch){
  const T=TOPICS[ti],all=questions(T);let qs,title="";
  if(kind==="ch"){const c=all.filter(q=>q.ch===ch);qs=shuffle(wpick(c,Math.min(5,c.length)));title=chTitle(T,ch);}
  else if(kind==="errs"){qs=shuffle(mistakes(T)).slice(0,12);title="Opakovanie chýb";}
  else{qs=shuffle([...wpick(all.filter(q=>q.type==="mc"),9),...wpick(all.filter(q=>q.type==="tf"),3)]);}
  S={mode:"quiz",ti,kind,ch,title,queue:qs.map(q=>({...q,retry:false})),n:qs.length,i:0,score:0,answered:false,missed:[]};
  renderQ();
}
function renderQ(){
  const q=S.queue[S.i],pct=Math.round(S.i/S.queue.length*100);
  const tf=q.type==="tf";
  app.innerHTML=`<div class="bar"><button class="x" data-act="home" aria-label="Späť na začiatok">✕</button>

      ${tf?`<span class="tag">Pravda, alebo nepravda?</span><p class="stmt">${q.prompt}</p>`:`<p class="prompt">${q.prompt}</p>`}
    </div>

    <div id="fb" aria-live="polite"></div>`;
  window.scrollTo(0,0);
}
function answer(i){
  if(S.answered)return;S.answered=true;
  const q=S.queue[S.i],ok=q.opts[i]===q.answer;
  if(!q.retry){stat(q.id,ok);if(ok)S.score++;else S.missed.push(q);}
  else if(ok&&S.kind==="errs"){stat(q.id,true);}
  if(!ok)S.queue.push({...q,retry:true,opts:q.type==="tf"?q.opts:shuffle(q.opts)});
  app.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.answer)b.classList.add("right");else if(j===i)b.classList.add("wrong");});
  const why=q.ex?`<p class="why">${q.ex}</p>`:"";
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">
    <p>${ok?pick(PRAISE):(q.type==="tf"?`Je to ${q.answer.toLowerCase()}.`:`Správne je: ${q.answer}`)}</p>${why}
    <button class="btn primary" data-act="next">Ďalej</button></div>`;
  const nb=app.querySelector('[data-act="next"]');nb.focus({preventScroll:true});
  nb.scrollIntoView({block:"nearest",behavior:"smooth"});
}

  const stars=s>=n*.9?3:s>=n*.6?2:1;
  const msg=stars===3?"Výborne!":stars===2?"Dobrá práca!":"Ide ti to, skús znova!";
  const again=S.kind==="ch"?`data-act="chquiz" data-t="${S.ti}" data-c="${S.ch}"`:S.kind==="errs"?`data-act="errs" data-t="${S.ti}"`:`data-act="quiz" data-t="${S.ti}"`;
  const left=mistakes(T).length;
  app.innerHTML=`<div class="end">
    <div class="stars" aria-label="${stars} z 3 hviezd">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
    <h2>${msg}</h2>
    <p class="score">Na prvý pokus správne: ${s} z ${n}</p>
    ${S.missed.length?`<div class="missed"><h3>Zapamätaj si:</h3><ul>${S.missed.map(q=>`<li>${q.type==="tf"?`${q.prompt} → <b>${q.answer}</b>${q.ex?` (${q.ex})`:""}`:`${q.prompt} → <b>${q.answer}</b>`}</li>`).join("")}</ul></div>`:""}
    <div class="row"><button class="btn primary" ${again}>Hrať znova</button>
    ${left&&S.kind!=="errs"?`<button class="btn" data-act="errs" data-t="${S.ti}">Opakovať chyby (${left})</button>`:""}
    <button class="btn ghost" data-act="home">Domov</button></div></div>`;
  window.scrollTo(0,0);
}

/* ===== Spájačka ===== */
function startMatch(ti){
  const T=TOPICS[ti];
  S={mode:"match",ti,round:0,rounds:3,errors:0,used:new Set()};
  matchRound();
}
function matchRound(){
  const T=TOPICS[S.ti];
  const avail=shuffle(T.pairs.filter(p=>!S.used.has(p[0])));
  const pool=avail.length>=5?avail:shuffle(T.pairs);
  const pick5=[],groups=new Set();
  for(const p of pool){if(pick5.length>=5)break;if(p[2]&&groups.has(p[2]))continue;if(p[2])groups.add(p[2]);pick5.push(p);S.used.add(p[0]);}
  S.pairs=pick5;S.left=shuffle(pick5.map((p,i)=>i));S.right=shuffle(pick5.map((p,i)=>i));S.sel=null;S.done=new Set();
  renderMatch();
}
function renderMatch(){
  const pct=Math.round(S.round/S.rounds*100);
  app.innerHTML=`<div class="bar"><button class="x" data-act="home" aria-label="Späť na začiatok">✕</button>
    <div class="prog"><div style="width:${pct}%"></div></div><span class="cnt">kolo ${S.round+1}/${S.rounds}</span></div>
    <p class="mhint">Ťukni na pojem vľavo a potom na jeho význam vpravo.</p>
    <div class="mgrid"><div class="mcol">${S.left.map(i=>`<button class="mi term" data-act="ml" data-i="${i}">${S.pairs[i][0]}</button>`).join("")}</div>
    <div class="mcol">${S.right.map(i=>`<button class="mi" data-act="mr" data-i="${i}">${S.pairs[i][1]}</button>`).join("")}</div></div>
    <p class="msg" id="msg" aria-live="polite"></p>`;
  window.scrollTo(0,0);
}
function matchTap(side,i,btn){
  if(S.done.has(i))return;
  const msg=document.getElementById("msg");
  if(side==="l"){app.querySelectorAll('.mi.term').forEach(b=>b.classList.remove("sel"));S.sel=i;btn.classList.add("sel");msg.textContent="";msg.className="msg";return;}
  if(S.sel==null){msg.textContent="Najprv vyber pojem vľavo 🙂";msg.className="msg";return;}
  const L=app.querySelector(`.mi.term[data-i="${S.sel}"]`);
  if(i===S.sel){
    S.done.add(i);[L,btn].forEach(b=>{b.classList.remove("sel");b.classList.add("done");b.disabled=true;});
    S.sel=null;msg.textContent=pick(PRAISE);msg.className="msg ok";
    if(S.done.size===S.pairs.length){
      S.round++;
      setTimeout(()=>{if(S&&S.mode==="match"){if(S.round>=S.rounds)endMatch();else matchRound();}},800);
    }
  }else{
    S.errors++;btn.classList.add("bad","shake");
    msg.textContent="Toto k sebe nepatrí. Skús iný význam.";msg.className="msg no";
    setTimeout(()=>btn.classList.remove("bad","shake"),600);
  }
}
function endMatch(){
  const e=S.errors,stars=e<=1?3:e<=4?2:1,T=TOPICS[S.ti];
  setBest(T.id+":match",stars);
  app.innerHTML=`<div class="end"><div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
    <h2>${stars===3?"Výborne!":stars===2?"Dobrá práca!":"Skús to ešte raz!"}</h2>
    <p class="score">Spojila si ${S.rounds*5} dvojíc${e?`, omylov: ${e}`:" bez jediného omylu"}.</p>
    <div class="row"><button class="btn primary" data-act="match" data-t="${S.ti}">Hrať znova</button><button class="btn ghost" data-act="home">Domov</button></div></div>`;
  window.scrollTo(0,0);
}

/* ===== Časová os ===== */
function startTime(ti){S={mode:"time",ti,round:0,rounds:3,errors:0};timeRound();}
function timeRound(){
  const T=TOPICS[S.ti];
  const ev=shuffle(T.events).slice(0,5).sort((a,b)=>a[0]-b[0]);
  S.ev=ev;S.placed=0;S.order=shuffle(ev.map((e,i)=>i));
  renderTime();
}
function renderTime(){
  const pct=Math.round(S.round/S.rounds*100),fin=S.placed>=S.ev.length;
  const yr=e=>e[2]?`<span class="y">${e[2]}</span>`:"";
  app.innerHTML=`<div class="bar"><button class="x" data-act="home" aria-label="Späť na začiatok">✕</button>
    <div class="prog"><div style="width:${pct}%"></div></div><span class="cnt">kolo ${S.round+1}/${S.rounds}</span></div>
    <p class="tip">Zoraď udalosti <b>od najstaršej</b>. Pri rokoch <b>pred n. l.</b> platí: <b>čím väčšie číslo, tým skôr</b> to bolo.</p>
    <ol class="tl">${S.ev.map((e,i)=>i<S.placed?`<li class="f"><span class="n">${i+1}</span><span class="t">${e[3]} ${e[1]}${yr(e)}</span></li>`:`<li><span class="n">${i+1}</span><span class="t">${i===S.placed?"Čo bolo "+(i===0?"najskôr":"potom")+"?":"…"}</span></li>`).join("")}</ol>
    ${fin?`<p class="msg ok">${pick(PRAISE)} Takto to išlo za sebou.</p><button class="btn primary" style="width:100%" data-act="tnext">${S.round+1>=S.rounds?"Hotovo":"Ďalšie kolo"}</button>`:
    `<p class="msg" id="msg" aria-live="polite" style="margin:0 0 10px"></p>
    <div class="pool">${S.order.filter(i=>i>=S.placed).map(i=>{const e=S.ev[i];return `<button class="ev" data-act="tev" data-i="${i}"><span class="ee">${e[3]}</span><span>${e[1]}${yr(e)}</span></button>`;}).join("")}</div>`}`;
}
function timeTap(i,btn){
  if(i===S.placed){S.placed++;renderTime();}
  else{S.errors++;btn.classList.add("shake","bad");const m=document.getElementById("msg");m.textContent="Hmm, toto sa stalo neskôr. Skús inú udalosť.";m.className="msg no";setTimeout(()=>btn.classList.remove("shake","bad"),700);}
}
function timeNext(){S.round++;if(S.round>=S.rounds)endTime();else timeRound();}
function endTime(){
  const e=S.errors,stars=e<=1?3:e<=4?2:1,T=TOPICS[S.ti];
  setBest(T.id+":time",stars);
  app.innerHTML=`<div class="end"><div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
    <h2>${stars===3?"Si majsterka dejín!":stars===2?"Dobrá práca!":"Skús to ešte raz!"}</h2>
    <p class="score">${e?`Omylov: ${e}`:"Bez jediného omylu!"}</p>
    <div class="row"><button class="btn primary" data-act="time" data-t="${S.ti}">Hrať znova</button><button class="btn ghost" data-act="home">Domov</button></div></div>`;
  window.scrollTo(0,0);
}

/* ===== Mapa ===== */
function mapLook(ti){
  const T=TOPICS[ti];S={mode:"maplook",ti};
  app.innerHTML=`<div class="rhead bar"><button class="x" data-act="home" aria-label="Späť na začiatok">✕</button><h2 style="font-family:Caveat,cursive;font-size:2.2rem;margin:0">Mapa</h2></div>
    <p class="mhint">Pozri si, kde sa odohrávali dejiny Rímskej republiky. Zlatou sú krajiny, ktoré Rím ovládol. Mapu si môžeš priblížiť dvoma prstami.</p>
    <div class="mapwrap">${mapSVG({hi:["ITA","GRC","EGY","ESP","FRA"],labels:["ITA","GRC","EGY","ESP","FRA","more","alpy"],pts:["rim","kartago"],alps:1,route:1})}</div>
    <div class="legend"><span>ovládol Rím</span><span class="lp">mesto</span><span class="la">Alpy</span><span class="lr">Hannibalova cesta</span></div>
    <button class="btn primary" style="width:100%" data-act="mapgo" data-t="${ti}">🔎 Hľadaj na mape</button>`;
  window.scrollTo(0,0);
}
function startMapGame(ti){
  const T=TOPICS[ti];
  S={mode:"map",ti,queue:shuffle(T.map).map(t=>({...t,retry:false})),n:T.map.length,i:0,score:0,answered:false,found:[]};
  renderMap();
}
function renderMap(){
  const t=S.queue[S.i],pct=Math.round(S.i/S.queue.length*100);
  app.innerHTML=`<div class="bar"><button class="x" data-act="home" aria-label="Späť na začiatok">✕</button>
    <div class="prog"><div style="width:${pct}%"></div></div><span class="cnt">${Math.min(S.i+1,S.queue.length)}/${S.queue.length}</span></div>
    <div class="find">${t.retry?`<p class="again">Skúsme to ešte raz</p>`:""}<p class="prompt">Ťukni na mape:</p><p class="big">${t.n}</p></div>
    <div class="mapwrap" id="mw">${mapSVG({alps:1,pts:["rim","kartago"]})}</div>
    <div id="fb" aria-live="polite"></div>`;
  const svg=app.querySelector(".map");
  S.found.forEach(k=>mark(svg,k,"ok"));
  svg.addEventListener("click",e=>mapTap(e,svg));
}
function mark(svg,k,cls){
  if(k==="rim"||k==="kartago"){const c=svg.querySelector("#pt-"+k);if(c)c.classList.add(cls);}
  else if(k==="alpy"){svg.querySelector("#alps").classList.add(cls);}
  else if(k==="more"){}
  else svg.querySelectorAll(`path.c[data-id="${k}"]`).forEach(p=>p.classList.add(cls));
  if(cls==="ok"||cls==="show"){const g=svg.querySelector("#labs");if(g&&!g.querySelector(`[data-l="${k}"]`)){
    const tmp=document.createElementNS("http://www.w3.org/2000/svg","g");tmp.setAttribute("data-l",k);
    tmp.innerHTML=labelSVG(k,FS);g.appendChild(tmp);}}
}
function inPoly(P,x,y){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function isMed(lon,lat){return lon>-5.6&&lon<36.6&&lat>30&&lat<46.2&&!(lon>26.3&&lat>40.3)&&!(lon<1.5&&lat>43.2)&&!(lon>32.2&&lat<31.4);}
const PR=48;
function near(k,x,y){const q=fwd(...PLACES[k]);return Math.hypot(q[0]-x,q[1]-y)<=PR;}
function hit(t,x,y,cid){
  if(t.t==="pt")return near(t.k,x,y)||(t.also||[]).includes(cid);
  if(t.t==="c")return cid===t.k||(t.also||[]).includes(cid);
  if(t.t==="alps")return inPoly(ALPS,x,y);
  if(t.t==="sea"){const [lon,lat]=inv(x,y);return !cid&&isMed(lon,lat);}
  return false;
}
function whatIs(x,y,cid){
  if(near("rim",x,y))return "Rím";if(near("kartago",x,y))return "Kartágo";
  if(inPoly(ALPS,x,y))return "Alpy";
  if(cid)return SKN[cid]||"iná krajina";
  const [lon,lat]=inv(x,y);return isMed(lon,lat)?"Stredozemné more":"more";
}
function mapTap(e,svg){
  if(S.answered)return;
  const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=p.matrixTransform(svg.getScreenCTM().inverse());
  const el=e.target.closest("path.c"),cid=el?el.dataset.id:null;
  const t=S.queue[S.i],ok=hit(t,m.x,m.y,cid);
  S.answered=true;
  if(ok){
    if(!t.retry)S.score++;S.found.push(t.k);mark(svg,t.k,"ok");
    document.getElementById("fb").innerHTML=`<div class="fb ok"><p>${pick(PRAISE)}</p></div>`;
    setTimeout(()=>{if(S&&S.mode==="map")nextMap();},850);
  }else{
    S.queue.push({...t,retry:true});
    mark(svg,t.k,"show");
    if(t.t==="pt"){const q=fwd(...PLACES[t.k]);svg.insertAdjacentHTML("beforeend",`<circle class="ring" cx="${q[0]}" cy="${q[1]}" r="26"/>`);}
    const w=whatIs(m.x,m.y,cid);
    document.getElementById("fb").innerHTML=`<div class="fb no"><p>${w===t.n?"Skoro!":`To je ${w}.`} ${t.n} je vyznačené červenou.</p>
      <button class="btn primary" data-act="mapnext">Ďalej</button></div>`;
    document.getElementById("fb").scrollIntoView({block:"nearest",behavior:"smooth"});
  }
}
function nextMap(){S.i++;S.answered=false;if(S.i>=S.queue.length)endMap();else renderMap();}
function endMap(){
  const s=S.score,n=S.n,stars=s>=n*.9?3:s>=n*.6?2:1,T=TOPICS[S.ti];
  setBest(T.id+":map",s);
  app.innerHTML=`<div class="end"><div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
    <h2>${stars===3?"Výborne!":stars===2?"Dobrá práca!":"Skús to ešte raz!"}</h2>
    <p class="score">Na prvý pokus: ${s} z ${n}</p>
    <div class="row"><button class="btn primary" data-act="mapgo" data-t="${S.ti}">Hrať znova</button><button class="btn" data-act="map" data-t="${S.ti}">Pozrieť mapu</button><button class="btn ghost" data-act="home">Domov</button></div></div>`;
  window.scrollTo(0,0);
}

/* ===== ovládanie ===== */
app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const a=b.dataset.act,ti=+b.dataset.t;
  if(a==="home")home();
  else if(a==="learn")learn(ti,0);
  else if(a==="ch")learn(S.ti,+b.dataset.i);
  else if(a==="quiz")startQuiz(ti,"all");
  else if(a==="chquiz")startQuiz(ti,"ch",b.dataset.c);
  else if(a==="errs")startQuiz(ti,"errs");
  else if(a==="opt")answer(+b.dataset.i);
  else if(a==="next")nextQ();
  else if(a==="match")startMatch(ti);
  else if(a==="ml")matchTap("l",+b.dataset.i,b);
  else if(a==="mr")matchTap("r",+b.dataset.i,b);
  else if(a==="time")startTime(ti);
  else if(a==="tev")timeTap(+b.dataset.i,b);
  else if(a==="tnext")timeNext();
  else if(a==="map")mapLook(ti);
  else if(a==="mapgo")startMapGame(ti);
  else if(a==="mapnext")nextMap();
});
/* potiahnutie prstom v Učím sa */
let tx0=null,ty0=null;
app.addEventListener("touchstart",e=>{if(S&&S.mode==="learn"&&!e.target.closest(".map")){tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;}},{passive:true});
app.addEventListener("touchend",e=>{
  if(tx0==null||!S||S.mode!=="learn")return;
  const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;tx0=null;
  if(Math.abs(dx)>70&&Math.abs(dy)<50){const n=TOPICS[S.ti].chapters.length,ci=S.ci+(dx<0?1:-1);if(ci>=0&&ci<n)learn(S.ti,ci);}
},{passive:true});
document.addEventListener("keydown",e=>{
  if(!S)return;
  if(S.mode==="learn"){if(e.key==="ArrowRight"&&S.ci<TOPICS[S.ti].chapters.length-1)learn(S.ti,S.ci+1);if(e.key==="ArrowLeft"&&S.ci>0)learn(S.ti,S.ci-1);}
});

home();
</script>
<script>
/* Odkaz späť na rozcestník Učíme sa hravo (len na webe) */
(function(){
  if(!/^https?:$/.test(location.protocol))return;
  var css=document.createElement("style");
  css.textContent='.hub-back{display:inline-flex;align-items:center;margin:0 0 12px;padding:5px 12px 5px 9px;border-radius:999px;border:1.5px solid currentColor;color:inherit;opacity:.7;font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;text-decoration:none;transform:none;position:relative;z-index:1}.hub-back:focus-visible{outline:3px solid currentColor;outline-offset:2px}';
  document.head.appendChild(css);
  var T=[[".hero",0],["#home",0],["h1.hello",1]];
  function place(){
    for(var i=0;i<T.length;i++){
      var el=document.querySelector(T[i][0]);if(!el)continue;
      var box=T[i][1]?document.getElementById("app"):el;
      if(!box)return;
      var f=box.firstElementChild;if(f&&f.classList.contains("hub-back"))return;
      var a=document.createElement("a");a.className="hub-back";a.href="./";a.textContent="‹ Všetky appky";
      box.insertBefore(a,box.firstChild);return;
    }
  }
  place();new MutationObserver(place).observe(document.body,{childList:true,subtree:true});
})();
</script>
